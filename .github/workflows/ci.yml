name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-baseline:
    name: Fast baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js from repo baseline
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Align npm baseline
        run: npm install -g npm@10.9.8

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install PDF renderer for HR visual audit
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run anonymized HR attendance PDF visual audit
        run: npm run audit:hr-attendance-documents:visual:ci

      - name: Run fast verification baseline
        run: npm test

  hr-team-browser:
    name: HR Team browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js from repo baseline
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Align npm baseline
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm exec --yes --package=playwright -c "playwright install --with-deps chromium"
      - name: Run My Day draft regression browser smoke
        run: npm run test:browser:my-day-draft

      - name: Run My Day AI composer browser smoke
        run: npm run test:browser:my-day-ai-composer

      - name: Run My Day interactions browser smoke
        run: npm run test:browser:my-day-interactions


      - name: Run access editor lifecycle and focus browser smoke
        run: npm run test:browser:account-access:lifecycle

      - name: Run access editor dirty draft and failed-save browser smoke
        run: npm run test:browser:account-access:draft

      - name: Run access editor tri-state page browser smoke
        run: npm run test:browser:account-access:tri-state

      - name: Run access editor test-backend persistence browser smoke
        run: npm run test:browser:account-access:backend

      - name: Run access editor mobile browser smoke
        run: npm run test:browser:account-access:mobile

      - name: Run deterministic sidebar timeline browser smoke
        run: npm run test:browser:sidebar-timeline

      - name: Run booking light and dark theme browser smoke
        run: npm run test:browser:booking-theme

      - name: Run Task Center theme browser smoke
        run: npm run test:browser:task-center

      - name: Run HR Team browser smoke
        run: npm run test:browser:hr-team

      - name: Run HR Today metrics browser smoke
        run: npm run test:browser:hr-today

      - name: Run HR Pulse refresh-only permission hydration browser smoke
        run: npm run test:browser:hr-pulse

      - name: Run HR onboarding cross-surface browser smoke
        run: npm run test:browser:hr-onboarding

      - name: Run staff schedule overlap and paid-role browser smoke
        run: npm run test:browser:staff-schedule

  hr-payroll-postgres:
    name: HR and payroll PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventgenix_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eventgenix_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js from repo baseline
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Align npm baseline
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Run attendance lock and full backup recovery integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:attendance-lock:isolated

      - name: Run disposable token-backed permission integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:permissions:isolated

      - name: Run disposable onboarding and hire integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:hr-onboarding:isolated

      - name: Run legacy hire backfill migration integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:hr-legacy-backfill:isolated

      - name: Run payroll profession and reversal integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:payroll-profiles:isolated

      - name: Run admission ticket catalog and concurrency integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:admission-tickets:isolated

      - name: Run My Day PostgreSQL classification integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:my-day:isolated

      - name: Run banquet production recovery integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:banquet-recovery:isolated

      - name: Install Chromium for full-stack onboarding smoke
        run: npm exec --yes --package=playwright -c "playwright install --with-deps chromium"

      - name: Run browser to API to PostgreSQL onboarding flow
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:browser:hr-onboarding:fullstack:isolated

  checkbox-park-postgres:
    name: Checkbox park PostgreSQL mock integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventgenix_checkbox_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eventgenix_checkbox_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js from repo baseline
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Align npm baseline
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Run migration governance check
        run: npm run check:migrations

      - name: Run Checkbox OpenAPI compatibility gate
        run: npm run check:checkbox-openapi

      - name: Run Checkbox source safety scan
        run: npm run check:checkbox-safety

      - name: Run Checkbox thin unit contracts
        run: node --test tests/checkbox-provider-bridge.test.js tests/checkbox-sandbox-harness.test.js tests/checkbox-park-config.test.js tests/payment-fiscal-ledger-foundation.test.js tests/payment-readiness.test.js

      - name: Run Checkbox park configuration PostgreSQL test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_checkbox_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:checkbox-park-config:isolated

      - name: Run Checkbox park fresh PostgreSQL and local HTTP mock smoke
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_checkbox_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:checkbox-park-cashier-smoke:isolated

      - name: Install Chromium for cashier payment UI smoke
        run: npm exec --yes --package=playwright -c "playwright install --with-deps chromium"

      - name: Run cashier payment UI smoke
        run: npm run smoke:cashier-payments

      - name: Run cashier payment real routes PostgreSQL browser smoke
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventgenix_checkbox_ci_test
          TEST_DATABASE_RESET_CONFIRM: RESET_DISPOSABLE_TEST_DATABASE
        run: npm run test:integration:checkbox-ui-real:isolated
