    <style>
        /* ==========================================
           ANALYTICS PAGE STYLES
           ========================================== */

        :root {
            --an-surface: #FFFFFF;
            --an-surface-soft: #F8FAFC;
            --an-surface-muted: #F1F5F9;
            --an-border: rgba(148, 163, 184, 0.22);
            --an-border-strong: rgba(148, 163, 184, 0.32);
            --an-text: #0F172A;
            --an-text-2: #475569;
            --an-text-3: #94A3B8;
            --an-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
            --an-success-text: #059669;
            --an-success-fill: #10B981;
            --an-danger-text: #DC2626;
            --an-danger-fill: #EF4444;
            --an-info-text: #2563EB;
            --an-info-fill: #3B82F6;
            --an-purple-fill: #8B5CF6;
            --an-warning-text: #D97706;
            --an-warning-fill: #F59E0B;
            --an-orange-fill: #F97316;
            --an-teal-fill: #14B8A6;
            --an-inactive-text: #64748B;
            --an-inactive-fill: #94A3B8;
        }

        [data-theme="dark"] {
            --an-surface: rgba(15, 23, 42, 0.92);
            --an-surface-soft: rgba(30, 41, 59, 0.86);
            --an-surface-muted: rgba(51, 65, 85, 0.58);
            --an-border: rgba(148, 163, 184, 0.18);
            --an-border-strong: rgba(148, 163, 184, 0.28);
            --an-text: #F8FAFC;
            --an-text-2: #CBD5E1;
            --an-text-3: #94A3B8;
            --an-shadow: 0 18px 38px rgba(2, 6, 23, 0.34);
            --an-success-text: #6EE7B7;
            --an-success-fill: #34D399;
            --an-danger-text: #F87171;
            --an-danger-fill: #F87171;
            --an-info-text: #93C5FD;
            --an-info-fill: #60A5FA;
            --an-purple-fill: #A78BFA;
            --an-warning-text: #FBBF24;
            --an-warning-fill: #FBBF24;
            --an-orange-fill: #FB923C;
            --an-teal-fill: #5EEAD4;
            --an-inactive-text: #CBD5E1;
            --an-inactive-fill: #94A3B8;
        }

        /* Period tabs */
        .an-period-tabs {
            display: flex;
            gap: 4px;
            background: var(--an-surface-muted);
            border: 1px solid var(--an-border);
            border-radius: var(--radius);
            padding: 3px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .an-period-tab {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            color: var(--an-text-2);
            white-space: nowrap;
            min-height: 44px;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .an-period-tab.active {
            background: var(--an-surface);
            color: var(--an-text);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        }

        .an-custom-range {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .an-custom-range.visible { display: flex; }
        .an-custom-range input {
            padding: 8px 12px;
            border: 1px solid var(--an-border);
            border-radius: var(--radius-sm);
            background: var(--an-surface);
            color: var(--an-text);
            font-size: 16px;
            font-family: inherit;
            min-height: 44px;
            box-sizing: border-box;
        }
        .an-range-separator {
            color: var(--an-text-3);
            font-weight: 700;
        }
        .an-custom-range button {
            padding: 8px 16px;
            min-height: 44px;
        }

        /* KPI cards grid */
        .an-kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .an-kpi-card {
            background: var(--an-surface);
            border-radius: var(--radius);
            padding: 18px;
            border: 1px solid var(--an-border);
            box-shadow: var(--an-shadow);
            position: relative;
            overflow: hidden;
        }

        .an-kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
        }
        .an-kpi-card.green::before { background: var(--an-success-fill); }
        .an-kpi-card.blue::before { background: var(--an-info-fill); }
        .an-kpi-card.purple::before { background: var(--an-purple-fill); }
        .an-kpi-card.orange::before { background: var(--an-orange-fill); }
        .an-kpi-card.red::before { background: var(--an-danger-fill); }
        .an-kpi-card.teal::before { background: var(--an-teal-fill); }

        .an-kpi-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--an-text-2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .an-kpi-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--an-text);
            line-height: 1.2;
        }
        .an-kpi-value--split {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 22px;
        }
        .an-inline-divider {
            color: var(--an-text-3);
            font-size: 16px;
        }
        .an-inline-meta {
            color: var(--an-text-3);
            font-size: 14px;
        }

        .an-kpi-sub {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .an-growth {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }
        .an-growth.up { background: rgba(16, 185, 129, 0.12); color: var(--an-success-text); }
        .an-growth.down { background: rgba(239, 68, 68, 0.12); color: var(--an-danger-text); }
        .an-growth.flat { background: var(--an-surface-muted); color: var(--an-text-2); }

        .an-kpi-prev {
            color: var(--an-text-3);
            font-size: 11px;
        }

        /* Section titles */
        .an-section {
            margin-bottom: 24px;
        }
        .an-section-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--an-text);
            margin: 0 0 12px 0;
        }

        /* Charts */
        .an-chart-container {
            background: var(--an-surface);
            border: 1px solid var(--an-border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--an-shadow);
        }
        .an-chart-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--an-text-2);
            margin: 0 0 12px 0;
        }
        .an-chart-title--spaced { margin-bottom: 8px; }

        .an-bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 160px;
        }
        .an-bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 16px;
        }
        .an-bar-pair {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            width: 100%;
            height: 140px;
        }
        .an-bar {
            flex: 1;
            border-radius: 3px 3px 0 0;
            min-height: 2px;
            transition: height 0.3s ease;
        }
        .an-bar.green { background: var(--an-success-fill); }
        .an-bar.red { background: var(--an-danger-fill); }
        .an-bar.blue { background: var(--an-info-fill); }
        .an-bar.purple { background: var(--an-purple-fill); }
        .an-bar.orange { background: var(--an-orange-fill); }
        .an-bar-label {
            font-size: 9px;
            color: var(--an-text-2);
            text-align: center;
            white-space: nowrap;
        }

        /* Two-column chart layout */
        .an-charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        /* Programs table */
        .an-mini-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .an-mini-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--an-border);
            color: var(--an-text-2);
        }
        .an-mini-table .rank {
            width: 26px; height: 26px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: white;
        }
        .rank-1 { background: var(--an-warning-fill); color: #111827; }
        .rank-2 { background: var(--an-inactive-fill); color: #0F172A; }
        .rank-3 { background: var(--an-orange-fill); color: #111827; }
        .rank-n { background: var(--an-surface-muted); color: var(--an-text-2); }
        .an-program-name {
            font-weight: 700;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--an-text);
        }
        .an-table-count {
            color: var(--an-text-3);
            font-size: 12px;
            text-align: center;
        }

        /* Horizontal bar */
        .an-hbar-row {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 0; border-bottom: 1px solid var(--an-border);
        }
        .an-hbar-row:last-child { border-bottom: none; }
        .an-hbar-label {
            color: var(--an-text-2);
            font-size: 13px;
            font-weight: 700;
            min-width: 80px;
        }
        .an-hbar-track {
            flex: 1; height: 8px;
            background: var(--an-surface-muted); border-radius: 4px; overflow: hidden;
        }
        .an-hbar-fill {
            background: var(--an-hbar-accent, var(--an-info-fill));
            height: 100%; border-radius: 4px; transition: width 0.6s ease;
        }
        .an-hbar-value {
            color: var(--an-text-2);
            font-size: 12px;
            font-weight: 800;
            min-width: 60px;
            text-align: right;
        }

        /* Comparison table */
        .an-comp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .an-comp-table th {
            background: var(--an-surface-soft);
            padding: 10px 14px;
            text-align: right;
            font-size: 11px;
            font-weight: 700;
            color: var(--an-text-2);
            text-transform: uppercase;
            border-bottom: 2px solid var(--an-border-strong);
        }
        .an-comp-table th:first-child { text-align: left; }
        .an-comp-table td {
            padding: 10px 14px; text-align: right;
            border-bottom: 1px solid var(--an-border);
            color: var(--an-text-2);
        }
        .an-comp-table td:first-child { text-align: left; font-weight: 700; color: var(--an-text); }
        .an-comp-current { color: var(--an-text); font-weight: 800; }

        /* Customer segments mini */
        .an-segments {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .an-segment {
            text-align: center;
            padding: 12px 8px;
            background: var(--an-surface-soft);
            border: 1px solid var(--an-border);
            border-radius: var(--radius-sm);
        }
        .an-segment-count {
            font-size: 22px; font-weight: 900; line-height: 1.2;
        }
        .an-segment-count--champions { color: var(--an-success-text); }
        .an-segment-count--loyal { color: var(--an-info-text); }
        .an-segment-count--potential { color: var(--an-warning-text); }
        .an-segment-count--inactive { color: var(--an-inactive-text); }
        .an-segment-label {
            font-size: 10px; font-weight: 700;
            color: var(--an-text-2); text-transform: uppercase;
            margin-top: 2px;
        }

        /* Legend */
        .an-legend {
            display: flex; gap: 16px; font-size: 12px; margin-top: 8px;
        }
        .an-legend-item {
            color: var(--an-text-2);
            display: flex; align-items: center; gap: 4px;
        }
        .an-legend-dot {
            width: 10px; height: 10px; border-radius: 2px;
        }
        .an-legend-dot--success { background: var(--an-success-fill); }
        .an-legend-dot--info { background: var(--an-info-fill); }
        .an-legend-dot--danger { background: var(--an-danger-fill); }

        .an-danger-text { color: var(--an-danger-text); }
        .an-success-text { color: var(--an-success-text); }
        .an-warning-text { color: var(--an-warning-text); }
        .an-money-positive {
            color: var(--an-success-text);
            font-weight: 800;
            text-align: right;
        }
        .an-empty-state {
            align-self: center;
            width: 100%;
            padding: 40px 12px;
            color: var(--an-text-3);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }
        .an-empty-state--compact { padding: 8px; text-align: left; }
        .an-empty-state--chart { padding: 30px 12px; }
        .an-helper-text,
        .an-segment-total {
            color: var(--an-text-3);
            font-size: 12px;
            font-weight: 700;
        }
        .an-segment-total {
            margin-top: 8px;
            text-align: center;
        }
        .an-bar-chart--short { height: 120px; }
        .an-bar-chart--deals { height: 140px; }
        .an-kpi-grid--compact { margin-bottom: 12px; }

        /* Dark mode */
        [data-theme="dark"] .an-period-tab.active {
            background: rgba(15, 23, 42, 0.96);
            border-color: var(--an-border);
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.34);
        }
        [data-theme="dark"] .an-kpi-card,
        [data-theme="dark"] .an-chart-container {
            box-shadow: var(--an-shadow);
        }
        [data-theme="dark"] .an-hbar-track {
            background: rgba(71, 85, 105, 0.48);
        }
        [data-theme="dark"] .rank-1,
        [data-theme="dark"] .rank-2,
        [data-theme="dark"] .rank-3 {
            color: #0F172A;
        }
        [data-theme="dark"] .an-growth.up { background: rgba(16, 185, 129, 0.16); }
        [data-theme="dark"] .an-growth.down { background: rgba(248, 113, 113, 0.16); }
        [data-theme="dark"] .an-growth.flat { background: rgba(71, 85, 105, 0.52); }

        /* Responsive */
        @media (max-width: 768px) {
            .an-kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .an-charts-row { grid-template-columns: 1fr; }
            .an-segments { grid-template-columns: repeat(2, 1fr); }
            .an-bar-label { font-size: 8px; }
            .an-kpi-value { font-size: 22px; }
        }
        /* Embed mode: hide chrome when loaded in iframe */
        .embed-mode .sidebar-nav,
        .embed-mode .header,
        .embed-mode .sidebar-overlay,
        .embed-mode .skip-link,
        .embed-mode .page-login-overlay { display: none !important; }
        .embed-mode .page-container { margin-left: 0 !important; padding: 16px !important; }
    </style>
</head>
