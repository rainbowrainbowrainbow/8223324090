<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script>
    (function(){try{var s=localStorage.getItem('pzp_dark_mode');var d=s!=='false';document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Genix | Банкетний лист</title>
    <meta name="description" content="Preview і друк банкетного листа Event Genix">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=0.80.6">
    <link rel="stylesheet" href="css/dark-mode.css?v=0.80.6">
    <link rel="stylesheet" href="css/responsive.css?v=0.80.6">
    <link rel="stylesheet" href="css/booking-summary.css?v=0.80.6">
</head>
<body class="booking-summary-page">
    <header class="booking-summary-toolbar" aria-label="Дії з банкетним листом">
        <div>
            <p class="booking-summary-kicker">Event Genix</p>
            <h1>Банкетний лист</h1>
        </div>
        <div class="booking-summary-actions">
            <button id="bookingSummaryCopy" type="button" class="booking-summary-btn booking-summary-btn-secondary">Скопіювати текст</button>
            <button id="bookingSummaryClientPdf" type="button" class="booking-summary-btn booking-summary-btn-primary" data-booking-summary-pdf-mode="client">PDF для клієнта</button>
            <button id="bookingSummaryPrint" type="button" class="booking-summary-btn booking-summary-btn-secondary">Друк</button>
            <button id="bookingSummaryClose" type="button" class="booking-summary-close" aria-label="Закрити банкетний лист" title="Закрити">×</button>
        </div>
    </header>

    <main class="booking-summary-shell" id="bookingSummaryRoot">
        <section id="bookingSummaryState" class="booking-summary-state" role="status">
            Завантаження банкетного листа...
        </section>
        <section id="bookingSummaryWarnings" class="booking-summary-warnings" hidden></section>
        <section id="bookingSummaryArrivalEditor" class="booking-summary-arrival-editor" data-state="idle" aria-labelledby="bookingSummaryArrivalTitle" hidden>
            <div class="booking-summary-arrival-editor__view">
                <div>
                    <span id="bookingSummaryArrivalTitle" class="booking-summary-arrival-editor__label">Прихід гостей</span>
                    <strong id="bookingSummaryArrivalCurrent">—</strong>
                </div>
                <button id="bookingSummaryArrivalEdit" type="button" class="booking-summary-btn booking-summary-btn-secondary">Змінити</button>
            </div>
            <form id="bookingSummaryArrivalForm" class="booking-summary-arrival-editor__form" hidden novalidate>
                <label for="bookingSummaryArrivalInput">Новий час приходу</label>
                <input id="bookingSummaryArrivalInput" type="time" step="60" autocomplete="off" required aria-required="true" aria-describedby="bookingSummaryArrivalStatus">
                <div class="booking-summary-arrival-editor__actions">
                    <button id="bookingSummaryArrivalSave" type="submit" class="booking-summary-btn booking-summary-btn-primary">Зберегти</button>
                    <button id="bookingSummaryArrivalCancel" type="button" class="booking-summary-btn booking-summary-btn-secondary">Скасувати</button>
                </div>
                <p id="bookingSummaryArrivalStatus" class="booking-summary-arrival-editor__status" role="status" aria-live="polite"></p>
            </form>
        </section>
        <div id="bookingSummaryPrintRoot" class="booking-summary-print-root" hidden>
            <article id="bookingSummaryDocument" class="booking-summary-document booking-summary-a4-page" aria-label="Документ банкетного листа" hidden></article>
        </div>
    </main>

    <script src="js/api.js?v=0.80.6" defer></script>
    <script src="js/ws.js?v=0.80.6" defer></script>
    <script src="js/auth.js?v=0.80.6" defer></script>
    <script src="js/booking-summary-page.js?v=0.80.6" defer></script>
</body>
</html>
