<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-MnV2jqXWm0ik6ClcQ/udF8RI82k161IRhoHBWu327cs='; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Завантаження листів недоступне</title>
    <script>
    try {
        const dark = localStorage.getItem('pzp_dark_mode') !== 'false';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    } catch {}
    </script>
    <link rel="stylesheet" href="/css/base.css?v=0.84.5">
    <link rel="stylesheet" href="/css/dark-mode.css?v=0.84.5">
    <link rel="stylesheet" href="/css/responsive.css?v=0.84.5">
</head>
<body>
    <main>
        <h1>Завантаження листів відвідуваності більше недоступне</h1>
        <p>Для відміток початку й завершення зміни скористайтеся розділом HR.</p>
    </main>
</body>
</html>
