    <style>
        .main-content { padding: 0 !important; max-width: none !important; }

        /* OmniClaw Layout */
        .omni-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: calc(100vh - 56px);
            overflow: hidden;
        }

        /* Sidebar — conversation list */
        .omni-sidebar {
            border-right: 1px solid var(--border-color, #e2e8f0);
            display: flex;
            flex-direction: column;
            background: var(--bg-primary, #fff);
            overflow: hidden;
        }

        .omni-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
        }

        .omni-sidebar-header h2 {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .omni-search {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-secondary, #f7fafc);
            color: var(--text-primary, #1a202c);
            outline: none;
        }

        .omni-search:focus {
            border-color: var(--accent-color, #F5C842);
        }

        .omni-channel-filters {
            display: flex;
            gap: 4px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .omni-channel-btn {
            padding: 4px 10px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            background: transparent;
            color: var(--text-secondary, #718096);
            transition: all 0.15s;
        }

        .omni-channel-btn.active {
            background: var(--accent-color, #F5C842);
            color: #000;
            border-color: var(--accent-color, #F5C842);
        }

        .omni-conv-list {
            flex: 1;
            overflow-y: auto;
        }

        .omni-conv-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            transition: background 0.1s;
        }

        .omni-conv-item:hover {
            background: var(--bg-hover, rgba(0,0,0,0.03));
        }

        .omni-conv-item.active {
            background: var(--accent-bg, rgba(245,200,66,0.1));
        }

        .omni-conv-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            color: #fff;
        }

        .omni-conv-avatar.ch-telegram { background: #0088cc; }
        .omni-conv-avatar.ch-viber { background: #7360f2; }
        .omni-conv-avatar.ch-sms { background: #48bb78; }
        .omni-conv-avatar.ch-facebook { background: #1877f2; }
        .omni-conv-avatar.ch-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .omni-conv-avatar.ch-binotel { background: #ff6b35; }

        .omni-conv-info {
            flex: 1;
            min-width: 0;
        }

        .omni-conv-name {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .omni-conv-preview {
            font-size: 12px;
            color: var(--text-secondary, #718096);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .omni-conv-meta {
            text-align: right;
            flex-shrink: 0;
        }

        .omni-conv-time {
            font-size: 11px;
            color: var(--text-secondary, #718096);
        }

        .omni-conv-badge {
            background: var(--accent-color, #F5C842);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 4px;
        }

        .omni-conv-waiting {
            display: inline-flex;
            align-items: center;
            margin-top: 4px;
            padding: 2px 6px;
            border-radius: 999px;
            background: rgba(37,99,235,0.1);
            color: #1D4ED8;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .omni-reply-state {
            display: inline-flex;
            align-items: center;
            margin-left: 8px;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(37,99,235,0.1);
            color: #1D4ED8;
            font-size: 11px;
            font-weight: 800;
            vertical-align: middle;
        }

        /* Chat area */
        .omni-chat {
            display: flex;
            flex-direction: column;
            background: var(--bg-primary, #fff);
            overflow: hidden;
        }

        .omni-chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary, #718096);
            font-size: 16px;
            text-align: center;
            padding: 40px;
        }

        .omni-chat-empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .omni-chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .omni-chat-header-name {
            font-weight: 700;
            font-size: 15px;
        }

        .omni-chat-header-channel {
            font-size: 12px;
            color: var(--text-secondary, #718096);
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--bg-secondary, #f7fafc);
        }

        .omni-chat-header-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .omni-chat-header-actions button {
            padding: 6px 12px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-primary, #1a202c);
        }

        .omni-chat-header-actions button:hover {
            background: var(--bg-hover, rgba(0,0,0,0.05));
        }

        .omni-case-context {
            border-bottom: 1px solid var(--border-color, #e2e8f0);
            padding: 10px 16px;
            background: var(--bg-secondary, #f7fafc);
            color: var(--text-primary, #1a202c);
        }

        .omni-case-context[hidden] {
            display: none !important;
        }

        .omni-case-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .omni-case-title {
            font-weight: 800;
            font-size: 13px;
        }

        .omni-case-meta {
            color: var(--text-secondary, #718096);
            font-size: 12px;
        }

        .omni-case-link {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 5px 10px;
            border-radius: 7px;
            border: 1px solid var(--border-color, #e2e8f0);
            background: var(--bg-primary, #fff);
            color: var(--text-primary, #1a202c);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
        }

        .omni-case-link.primary {
            background: var(--accent-color, #F5C842);
            border-color: var(--accent-color, #F5C842);
            color: #000;
        }

        .omni-case-link.suggested {
            border-color: #f59e0b;
            color: #92400e;
        }

        .omni-case-pill {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(22, 163, 74, 0.12);
            color: #166534;
            font-size: 11px;
            font-weight: 800;
        }

        .omni-case-pill.suggested {
            background: rgba(245, 158, 11, 0.14);
            color: #92400e;
        }

        .omni-case-pill.unresolved {
            background: rgba(100, 116, 139, 0.14);
            color: #475569;
        }

        .omni-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .omni-msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .omni-msg.inbound {
            align-self: flex-start;
            background: var(--bg-secondary, #f0f0f0);
            border-bottom-left-radius: 4px;
        }

        .omni-msg.outbound {
            align-self: flex-end;
            background: var(--accent-color, #F5C842);
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .omni-msg.outbound.ai {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        .omni-msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .omni-msg-sender {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 2px;
            opacity: 0.7;
        }

        /* Input area */
        .omni-chat-input {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color, #e2e8f0);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .omni-chat-input textarea {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 12px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            max-height: 120px;
            min-height: 42px;
            background: var(--bg-secondary, #f7fafc);
            color: var(--text-primary, #1a202c);
            outline: none;
        }

        .omni-chat-input textarea:focus {
            border-color: var(--accent-color, #F5C842);
        }

        .omni-reply-toggle {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            color: var(--text-secondary, #718096);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            user-select: none;
        }

        .omni-reply-toggle input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color, #F5C842);
        }

        .omni-reply-toggle:has(input:disabled) {
            opacity: 0.45;
        }

        .omni-send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--accent-color, #F5C842);
            color: #000;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .omni-send-btn:hover {
            opacity: 0.85;
        }

        .omni-send-btn:disabled {
            cursor: not-allowed;
            opacity: 0.45;
            background: var(--border-color, #cbd5e0);
            color: var(--text-secondary, #718096);
        }

        .omni-send-truth {
            border-top: 1px solid var(--border-color, #e2e8f0);
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-secondary, #718096);
            background: var(--bg-secondary, #f7fafc);
        }

        .omni-send-truth.info,
        .omni-send-state.info {
            color: var(--info-color, #2563eb);
        }

        .omni-send-truth.success,
        .omni-send-state.success {
            color: var(--success-color, #16a34a);
        }

        .omni-send-truth.warning,
        .omni-send-state.warning {
            color: var(--warning-color, #d97706);
        }

        .omni-send-truth.error,
        .omni-send-state.error {
            color: var(--danger-color, #dc2626);
        }

        .omni-send-state {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            line-height: 1.35;
        }

        .omni-quick-replies {
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            overflow-x: auto;
            border-top: 1px solid var(--border-color, #e2e8f0);
        }

        .omni-quick-btn {
            padding: 4px 12px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            background: transparent;
            color: var(--text-primary, #1a202c);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .omni-quick-btn:hover {
            background: var(--accent-bg, rgba(245,200,66,0.15));
        }

        .omni-quick-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Stats bar */
        .omni-stats {
            display: flex;
            gap: 16px;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-secondary, #718096);
            border-bottom: 1px solid var(--border-color, #e2e8f0);
        }

        .omni-stat b {
            color: var(--text-primary, #1a202c);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .omni-container {
                grid-template-columns: 1fr;
            }
            .omni-sidebar {
                display: none;
            }
            .omni-sidebar.mobile-show {
                display: flex;
                position: absolute;
                inset: 0;
                z-index: 100;
            }
        }

        /* Dark mode overrides */
        .dark-mode .omni-sidebar {
            background: var(--bg-primary, #1a1a2e);
        }
        .dark-mode .omni-chat {
            background: var(--bg-primary, #1a1a2e);
        }
        .dark-mode .omni-msg.inbound {
            background: rgba(255,255,255,0.08);
        }
    </style>
</head>

    <script>
    /**
     * OmniClaw Page — omnichannel inbox UI
     * v23.2.0
     */
    (function() {
        'use strict';

        const API_BASE = (window.APP_CONFIG && APP_CONFIG.API_URL) || '';
        let conversations = [];
        let currentConvId = null;
        let selectedConversationQueryId = null;
        let conversationQueryApplied = false;
        let caseContextRequestSeq = 0;
        let quickReplies = [];
        let activeChannel = 'all';
        let searchQuery = '';

        // DOM refs
        const $ = id => document.getElementById(id);
        const convList = $('omniConvList');
        const messages = $('omniMessages');
        const inputArea = $('omniInputArea');
        const chatHeader = $('omniChatHeader');
        const emptyState = $('omniEmpty');
        const quickRepliesEl = $('omniQuickReplies');
        const statsEl = $('omniStats');
        const searchInput = $('omniSearch');
        const input = $('omniInput');
        const sendBtn = $('omniSendBtn');
        const replyExpectedEl = $('omniReplyExpected');
        const sendTruthEl = $('omniSendTruth');
        const caseContextEl = $('omniCaseContext');
        let isSending = false;

        // ---- Auth ----
        function getHeaders() {
            const token = localStorage.getItem('pzp_token');
            return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
        }

        async function api(path, opts = {}) {
            try {
                const res = await fetch(API_BASE + '/api/omni' + path, {
                    ...opts,
                    headers: { ...getHeaders(), ...(opts.headers || {}) }
                });
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('pzp_token');
                    window.location.href = '/';
                    return { success: false, error: 'Сесія закінчилась' };
                }
                let body = null;
                try { body = await res.json(); } catch {}
                if (!res.ok) {
                    return { success: false, error: body?.error || ('Помилка сервера: ' + res.status), ...(body || {}) };
                }
                return body || { success: true };
            } catch (err) {
                console.error('API error:', err);
                return { success: false, error: 'Помилка мережі' };
            }
        }

        // ---- Channel icons ----
        const CHANNEL_ICONS = {
            telegram: 'TG', viber: 'Vi', sms: 'SM',
            facebook: 'FB', instagram: 'IG', binotel: 'Bi'
        };

        const CHANNEL_NAMES = {
            telegram: 'Telegram', viber: 'Viber', sms: 'SMS',
            facebook: 'Facebook', instagram: 'Instagram', binotel: 'Binotel'
        };
        const SEND_DISABLED_CHANNELS = new Set(['binotel']);

        // ---- Load data ----
        async function loadConversations() {
            const params = new URLSearchParams({ limit: '100', offset: '0' });
            if (activeChannel !== 'all') params.set('channel', activeChannel);
            if (searchQuery) params.set('search', searchQuery);
            const res = await api('/conversations?' + params);
            if (res.success) {
                conversations = (res.data && res.data.conversations) || [];
                renderConversations();
                await selectConversationFromQuery();
            }
        }

        async function loadMessages(convId) {
            const res = await api('/conversations/' + convId + '/messages?limit=100');
            if (res.success) {
                renderMessages((res.data && res.data.messages) || res.data || []);
            }
        }

        async function loadQuickReplies() {
            const res = await api('/quick-replies');
            if (res.success) {
                quickReplies = res.data || [];
            }
        }

        async function loadStats() {
            const res = await api('/stats');
            if (res.success && res.data) {
                const d = res.data;
                const byStatus = d.byStatus || {};
                statsEl.innerHTML =
                    '<span class="omni-stat">Всього: <b>' + (d.total || 0) + '</b></span>' +
                    '<span class="omni-stat">Відкриті: <b>' + (byStatus.open || 0) + '</b></span>' +
                    '<span class="omni-stat">Очікують: <b>' + (byStatus.pending || 0) + '</b></span>';
            }
        }

        // ---- Render ----
        function replySlaLabel(conv) {
            if (!conv || !conv.waitingReply) return '';
            switch (conv.replySlaState) {
                case 'overdue': return 'SLA прострочено';
                case 'due_soon': return 'SLA скоро спливає';
                case 'on_track': return 'SLA в нормі';
                default: return '';
            }
        }

        function replyWaitingText(conv) {
            if (!conv || !conv.waitingReply || !conv.awaitingReplySince) return '';
            return ['Очікуємо відповідь з ' + formatTime(conv.awaitingReplySince), replySlaLabel(conv)].filter(Boolean).join(' · ');
        }

        function replyWaitingBadge(conv, cls) {
            const text = replyWaitingText(conv);
            return text ? '<span class="' + (cls || 'omni-conv-waiting') + '">' + esc(text) + '</span>' : '';
        }

        function renderConversations() {
            renderOmniExplainability();
            if (!conversations.length) {
                convList.innerHTML = omniEmptyHtml();
                return;
            }
            convList.innerHTML = conversations.map(c => {
                const isActive = c.id === currentConvId;
                const initials = (c.customerName || c.externalId || '?').slice(0, 2).toUpperCase();
                const time = c.lastMessageAt ? formatTime(c.lastMessageAt) : '';
                const badge = c.unreadCount > 0 ? '<span class="omni-conv-badge">' + c.unreadCount + '</span>' : '';
                const waiting = replyWaitingBadge(c);
                return '<div class="omni-conv-item' + (isActive ? ' active' : '') + '" data-id="' + c.id + '">' +
                    '<div class="omni-conv-avatar ch-' + c.channel + '">' + initials + '</div>' +
                    '<div class="omni-conv-info">' +
                        '<div class="omni-conv-name">' + esc(c.customerName || c.externalId) + '</div>' +
                        '<div class="omni-conv-preview">' + esc(c.lastMessage || '') + '</div>' +
                    '</div>' +
                    '<div class="omni-conv-meta">' +
                        '<div class="omni-conv-time">' + time + '</div>' +
                        badge +
                        waiting +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function getOmniFilterSummary() {
            const filters = [];
            if (activeChannel !== 'all') filters.push({ label: 'Канал', value: CHANNEL_NAMES[activeChannel] || activeChannel });
            if (searchQuery) filters.push({ label: 'Пошук', value: searchQuery });
            if (selectedConversationQueryId && !currentConvId) filters.push({ label: 'Посилання', value: 'розмова #' + selectedConversationQueryId });
            return filters;
        }

        function renderOmniExplainability() {
            if (!window.Explainability) return;
            const filters = getOmniFilterSummary();
            const html = Explainability.renderFilterSummary(filters, {
                label: 'Зріз розмов',
                clearAction: filters.length ? 'omni' : '',
                clearLabel: 'Показати всі розмови'
            });
            Explainability.setRegion('omniExplainability', html);
        }

        function omniEmptyHtml() {
            const filters = getOmniFilterSummary();
            if (window.Explainability) {
                return Explainability.renderEmptyState({
                    icon: '✉',
                    title: filters.length ? 'Розмов за цим зрізом немає' : 'Розмов ще немає',
                    message: filters.length
                        ? 'Поточний пошук, канал або точне посилання звузили список. Скиньте зріз, щоб повернути всі доступні розмови.'
                        : 'Коли зʼявиться повідомлення з підключеного каналу, воно буде тут.',
                    clearAction: filters.length ? 'omni' : '',
                    clearLabel: 'Показати всі розмови'
                });
            }
            return '<div style="padding:24px;text-align:center;color:var(--text-secondary,#718096)">Немає розмов</div>';
        }

        function resetOmniFilters() {
            activeChannel = 'all';
            searchQuery = '';
            selectedConversationQueryId = null;
            conversationQueryApplied = true;
            if (searchInput) searchInput.value = '';
            document.querySelectorAll('.omni-channel-btn').forEach(b => b.classList.toggle('active', b.dataset.channel === 'all'));
            const url = new URL(window.location.href);
            url.searchParams.delete('search');
            url.searchParams.delete('conversation');
            url.searchParams.delete('conversationId');
            history.replaceState({}, '', url.pathname + url.search + url.hash);
            loadConversations();
        }

        function currentConversation() {
            return conversations.find(c => c.id === currentConvId) || null;
        }

        function canSendConversation(conv) {
            return Boolean(conv && conv.sendCapable !== false && !SEND_DISABLED_CHANNELS.has(String(conv.channel || '').toLowerCase()));
        }

        function sendTruthTone(sendTruth) {
            const status = sendTruth?.status || '';
            if (status === 'provider_failed_immediate' || status === 'provider_failed_later' || status === 'channel_unavailable') return 'error';
            if (status === 'provider_unknown' || status === 'saved') return 'warning';
            if (status === 'provider_delivered' || status === 'provider_read') return 'success';
            if (status === 'provider_attempted') return 'info';
            return 'warning';
        }

        function sendTruthLabel(sendTruth) {
            if (!sendTruth) return '';
            if (sendTruth.message) return sendTruth.message;
            switch (sendTruth.status) {
                case 'provider_attempted':
                    return 'Провайдер прийняв запит. Фінальна доставка ще не підтверджується.';
                case 'provider_delivered':
                    return 'Повідомлення доставлено за підтвердженням провайдера.';
                case 'provider_read':
                    return 'Провайдер підтвердив перегляд повідомлення.';
                case 'provider_failed_immediate':
                    return 'Провайдер одразу не прийняв відправку. Повідомлення лишилось у CRM.';
                case 'provider_failed_later':
                    return 'Провайдер пізніше повідомив про недоставку. Повідомлення лишилось у CRM.';
                case 'provider_unknown':
                    return 'Повідомлення збережено в CRM, але статус провайдера невідомий.';
                case 'channel_unavailable':
                    return 'Цей канал недоступний для відправки з CRM.';
                case 'saved':
                    return 'Повідомлення збережено в CRM. Очікуємо immediate-result провайдера.';
                default:
                    return 'Стан відправки невідомий.';
            }
        }

        function parseMessageMeta(meta) {
            if (!meta) return {};
            if (typeof meta === 'object') return meta;
            try { return JSON.parse(meta); } catch { return {}; }
        }

        function sendTruthFromDurableStatus(message) {
            switch (message?.deliveryStatus) {
                case 'saved':
                    return { status: 'saved', providerReference: message.providerMessageId || null, error: message.deliveryError || null };
                case 'accepted':
                    return { status: 'provider_attempted', providerReference: message.providerMessageId || null, error: message.deliveryError || null };
                case 'delivered':
                    return { status: 'provider_delivered', providerReference: message.providerMessageId || null, error: message.deliveryError || null };
                case 'read':
                    return { status: 'provider_read', providerReference: message.providerMessageId || null, error: message.deliveryError || null };
                case 'failed':
                    return { status: 'provider_failed_immediate', providerReference: message.providerMessageId || null, error: message.deliveryError || null };
                case 'later_failed':
                    return { status: 'provider_failed_later', providerReference: message.providerMessageId || null, error: message.deliveryError || null };
                case 'attempted':
                case 'unknown':
                    return { status: 'provider_unknown', providerReference: message.providerMessageId || null, error: message.deliveryError || null };
                default:
                    return null;
            }
        }

        function sendTruthFromMessage(message) {
            const meta = parseMessageMeta(message?.meta);
            const durable = sendTruthFromDurableStatus(message);
            if (['delivered', 'read', 'later_failed'].includes(message?.deliveryStatus) && durable) return durable;
            return message?.sendTruth || meta.sendTruth || durable;
        }

        function renderSendTruthState(sendTruth) {
            if (!sendTruth) return '';
            const tone = sendTruthTone(sendTruth);
            return '<span class="omni-send-state ' + tone + '">' + esc(sendTruthLabel(sendTruth)) + '</span>';
        }

        function setSendFeedback(sendTruth, fallbackText) {
            if (!sendTruthEl) return;
            const message = sendTruth ? sendTruthLabel(sendTruth) : fallbackText;
            if (!message) {
                sendTruthEl.hidden = true;
                sendTruthEl.textContent = '';
                sendTruthEl.className = 'omni-send-truth';
                return;
            }
            const tone = sendTruth ? sendTruthTone(sendTruth) : 'warning';
            sendTruthEl.hidden = false;
            sendTruthEl.className = 'omni-send-truth ' + tone;
            sendTruthEl.textContent = message;
        }

        function updateSendControls(conv) {
            const canSend = canSendConversation(conv);
            input.disabled = !canSend || isSending;
            sendBtn.disabled = !canSend || isSending;
            if (replyExpectedEl) replyExpectedEl.disabled = !canSend || isSending;
            input.placeholder = canSend ? 'Написати повідомлення...' : 'Канал доступний лише для перегляду';
            if (!canSend && replyExpectedEl) replyExpectedEl.checked = false;
            if (!canSend && conv) {
                setSendFeedback({
                    status: 'channel_unavailable',
                    channel: conv.channel,
                    message: (CHANNEL_NAMES[conv.channel] || conv.channel || 'Канал') + ' недоступний для відправки з CRM. Відкривайте історію без compose-дії.'
                });
            }
        }

        function renderMessages(msgs) {
            messages.innerHTML = msgs.map(m => {
                const dir = m.direction;
                const isAI = m.aiGenerated;
                const cls = 'omni-msg ' + dir + (isAI ? ' ai' : '');
                const sender = dir === 'outbound' ? (m.senderName || 'Оператор') : '';
                const senderHtml = sender ? '<div class="omni-msg-sender">' + esc(sender) + (isAI ? ' (AI)' : '') + '</div>' : '';
                const sendTruthHtml = dir === 'outbound' ? renderSendTruthState(sendTruthFromMessage(m)) : '';
                return '<div class="' + cls + '">' +
                    senderHtml +
                    '<div>' + esc(m.content || '') + '</div>' +
                    sendTruthHtml +
                    '<div class="omni-msg-time">' + formatTime(m.createdAt) + '</div>' +
                '</div>';
            }).join('');
            messages.scrollTop = messages.scrollHeight;
        }

        function renderQuickReplies() {
            const disabled = !canSendConversation(currentConversation());
            quickRepliesEl.innerHTML = quickReplies.map(qr =>
                '<button type="button" class="omni-quick-btn" data-content="' + esc(qr.content) + '"' + (disabled ? ' disabled aria-disabled="true"' : '') + '>' + esc(qr.title) + '</button>'
            ).join('');
        }

        function setConversationUrl(convId, replace) {
            const url = new URL(window.location.href);
            if (convId) url.searchParams.set('conversation', String(convId));
            else url.searchParams.delete('conversation');
            const state = convId ? { omniConversation: convId } : {};
            const method = replace ? 'replaceState' : 'pushState';
            history[method](state, '', url.pathname + url.search + url.hash);
        }

        async function fetchConversationContext(convId) {
            const res = await api('/conversations/' + convId + '/context');
            if (!res.success || !res.data) return null;
            return res.data;
        }

        async function selectConversationFromQuery() {
            if (!selectedConversationQueryId || conversationQueryApplied) return;
            let target = conversations.find(c => c.id === selectedConversationQueryId);
            if (!target) {
                const context = await fetchConversationContext(selectedConversationQueryId);
                target = context && context.conversation;
                if (target && !conversations.some(c => c.id === target.id)) {
                    conversations = [target].concat(conversations);
                    renderConversations();
                }
            }
            if (target) {
                conversationQueryApplied = true;
                selectConversation(selectedConversationQueryId, { replaceUrl: true });
            } else {
                conversationQueryApplied = true;
                if (caseContextEl) {
                    caseContextEl.hidden = false;
                    caseContextEl.innerHTML = '<div class="omni-case-row"><span class="omni-case-pill unresolved">Розмову не знайдено</span><span class="omni-case-meta">Перевірте посилання або відкрийте розмову зі списку.</span></div>';
                }
            }
        }

        function caseLink(href, label, cls) {
            if (!href) return '';
            return '<a class="omni-case-link ' + (cls || '') + '" href="' + esc(href) + '">' + esc(label) + '</a>';
        }

        function renderCaseContext(context) {
            if (!caseContextEl) return;
            const exact = context.exact || {};
            const suggestions = context.suggestions || {};
            const links = context.links || {};
            const suggestedLinks = context.suggestedLinks || {};
            const relatedBookings = context.relatedBookings || [];
            const hasExact = exact.lead || exact.customer || exact.booking;
            const hasSuggestion = suggestions.lead || suggestions.customer || suggestions.booking;
            const pillClass = hasExact ? '' : (hasSuggestion ? 'suggested' : 'unresolved');
            const pillText = hasExact ? 'Точний CRM-зв’язок' : (hasSuggestion ? 'Ймовірний збіг' : 'CRM-зв’язок не знайдено');
            const title = exact.lead?.clientName || exact.customer?.name || suggestions.lead?.clientName || suggestions.customer?.name || 'Без прив’язки до кейсу';
            const meta = [
                exact.lead ? 'лід #' + exact.lead.id : null,
                exact.customer ? 'клієнт #' + exact.customer.id : null,
                exact.booking ? 'бронювання ' + exact.booking.id : null,
                !exact.booking && relatedBookings.length ? 'бронювань клієнта: ' + relatedBookings.length : null
            ].filter(Boolean).join(' · ');

            const exactActions = [
                caseLink(links.leadWorkspace, 'Відкрити кейс', 'primary'),
                caseLink(links.customer, 'Клієнт', ''),
                caseLink(links.booking, 'Таймлайн', '')
            ].join('');
            const suggestedActions = !hasExact && hasSuggestion ? [
                caseLink(suggestedLinks.leadWorkspace, 'Ймовірний кейс', 'suggested'),
                caseLink(suggestedLinks.customer, 'Ймовірний клієнт', 'suggested'),
                caseLink(suggestedLinks.booking, 'Ймовірне бронювання', 'suggested')
            ].join('') : '';

            caseContextEl.hidden = false;
            caseContextEl.innerHTML =
                '<div class="omni-case-row">' +
                    '<span class="omni-case-pill ' + pillClass + '">' + pillText + '</span>' +
                    '<span class="omni-case-title">' + esc(title) + '</span>' +
                    (meta ? '<span class="omni-case-meta">' + esc(meta) + '</span>' : '') +
                    exactActions +
                    suggestedActions +
                '</div>';
        }

        async function loadCaseContext(convId) {
            if (!caseContextEl) return;
            const requestSeq = ++caseContextRequestSeq;
            caseContextEl.hidden = false;
            caseContextEl.innerHTML = '<div class="omni-case-row"><span class="omni-case-pill unresolved">Завантаження CRM-контексту...</span></div>';
            const context = await fetchConversationContext(convId);
            if (requestSeq !== caseContextRequestSeq) return;
            if (context) {
                renderCaseContext(context);
            } else {
                caseContextEl.innerHTML = '<div class="omni-case-row"><span class="omni-case-pill unresolved">CRM-контекст недоступний</span><span class="omni-case-meta">Розмову можна вести без прив’язки до кейсу.</span></div>';
            }
        }

        // ---- Actions ----
        function selectConversation(convId, options = {}) {
            currentConvId = convId;
            const conv = conversations.find(c => c.id === convId);
            if (!conv) return;
            selectedConversationQueryId = convId;
            conversationQueryApplied = true;
            if (!options.skipUrl) setConversationUrl(convId, !!options.replaceUrl);

            emptyState.style.display = 'none';
            chatHeader.style.display = 'flex';
            messages.style.display = 'flex';
            inputArea.style.display = 'flex';
            quickRepliesEl.style.display = 'flex';

            $('omniChatName').textContent = conv.customerName || conv.externalId;
            $('omniChatChannel').innerHTML = esc(CHANNEL_NAMES[conv.channel] || conv.channel) + replyWaitingBadge(conv, 'omni-reply-state');
            $('omniChatAvatar').className = 'omni-conv-avatar ch-' + conv.channel;
            $('omniChatAvatar').textContent = (conv.customerName || conv.externalId || '?').slice(0, 2).toUpperCase();

            const aiBtn = $('omniToggleAI');
            const aiEnabled = conv.meta && conv.meta.ai_enabled;
            aiBtn.style.background = aiEnabled ? '#667eea' : '';
            aiBtn.style.color = aiEnabled ? '#fff' : '';
            setSendFeedback(null);
            if (replyExpectedEl) replyExpectedEl.checked = false;
            updateSendControls(conv);

            renderConversations();
            loadMessages(convId);
            loadCaseContext(convId);
            renderQuickReplies();
        }

        async function sendMessage() {
            const text = input.value.trim();
            const conv = currentConversation();
            if (!text || !currentConvId || isSending) return;
            if (!canSendConversation(conv)) {
                updateSendControls(conv);
                return;
            }
            isSending = true;
            updateSendControls(conv);
            setSendFeedback({
                status: 'saved',
                channel: conv?.channel,
                message: 'Зберігаємо в CRM і чекаємо immediate-result провайдера...'
            });

            const res = await api('/conversations/' + currentConvId + '/send', {
                method: 'POST',
                body: JSON.stringify({
                    text,
                    reply_expected: !!(replyExpectedEl && replyExpectedEl.checked)
                })
            });

            if (res.success) {
                input.value = '';
                input.style.height = 'auto';
                if (replyExpectedEl) replyExpectedEl.checked = false;
                setSendFeedback(res.sendTruth || res.data?.meta?.sendTruth || {
                    status: 'provider_unknown',
                    channel: conv?.channel,
                    message: 'Повідомлення збережено, але стан провайдера не повернувся.'
                });
                loadMessages(currentConvId);
                loadConversations();
            } else {
                setSendFeedback(res.sendTruth || {
                    status: 'provider_failed_immediate',
                    channel: conv?.channel,
                    message: res.error || 'Не вдалося виконати відправку. Повідомлення не вважається доставленим.'
                });
            }
            isSending = false;
            updateSendControls(currentConversation() || conv);
        }

        async function closeConversation() {
            if (!currentConvId) return;
            await api('/conversations/' + currentConvId, {
                method: 'PATCH',
                body: JSON.stringify({ status: 'closed' })
            });
            currentConvId = null;
            emptyState.style.display = '';
            chatHeader.style.display = 'none';
            messages.style.display = 'none';
            inputArea.style.display = 'none';
            quickRepliesEl.style.display = 'none';
            if (caseContextEl) caseContextEl.hidden = true;
            setConversationUrl(null, true);
            loadConversations();
            loadStats();
        }

        async function toggleAI() {
            if (!currentConvId) return;
            const conv = conversations.find(c => c.id === currentConvId);
            if (!conv) return;
            const aiEnabled = conv.meta && conv.meta.ai_enabled;
            // Toggle AI via PATCH meta
            await api('/conversations/' + currentConvId, {
                method: 'PATCH',
                body: JSON.stringify({ meta: { ai_enabled: !aiEnabled } })
            });
            loadConversations();
        }

        // ---- Helpers ----
        function esc(s) {
            if (!s) return '';
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            if (isToday) {
                return d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
            }
            return d.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit' }) +
                   ' ' + d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
        }

        // ---- Events ----
        convList.addEventListener('click', e => {
            const item = e.target.closest('.omni-conv-item');
            if (item) selectConversation(parseInt(item.dataset.id));
        });

        $('omniSendBtn').addEventListener('click', sendMessage);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        $('omniCloseConv').addEventListener('click', closeConversation);
        $('omniToggleAI').addEventListener('click', toggleAI);

        // Channel filters
        $('omniFilters').addEventListener('click', e => {
            const btn = e.target.closest('.omni-channel-btn');
            if (!btn) return;
            document.querySelectorAll('.omni-channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeChannel = btn.dataset.channel;
            conversationQueryApplied = true;
            loadConversations();
        });
        document.addEventListener('click', e => {
            const clear = e.target.closest('[data-explain-clear="omni"]');
            if (!clear) return;
            e.preventDefault();
            resetOmniFilters();
        });

        // Search
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = searchInput.value.trim();
                conversationQueryApplied = true;
                loadConversations();
            }, 300);
        });

        // Quick replies
        quickRepliesEl.addEventListener('click', e => {
            const btn = e.target.closest('.omni-quick-btn');
            if (btn && !btn.disabled && !input.disabled) {
                input.value = btn.dataset.content;
                input.focus();
            }
        });

        // WebSocket for real-time updates
        function setupWS() {
            if (typeof window.ws !== 'undefined' && window.ws) {
                const origOnMessage = window.ws.onmessage;
                window.ws.onmessage = function(event) {
                    if (origOnMessage) origOnMessage.call(this, event);
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'omni:message' || data.type === 'omni:conversation') {
                            loadConversations();
                            loadStats();
                            var evtConvId = data.data && (data.data.conversation && data.data.conversation.id || data.data.message && data.data.message.conversationId);
                        if (currentConvId && evtConvId === currentConvId) {
                                loadMessages(currentConvId);
                            }
                        }
                    } catch (e) { /* ignore non-JSON */ }
                };
            }
        }

        function applyQueryContext() {
            const params = new URLSearchParams(window.location.search);
            const queryConversation = parseInt(params.get('conversation') || params.get('conversationId') || '0', 10);
            if (Number.isInteger(queryConversation) && queryConversation > 0) {
                selectedConversationQueryId = queryConversation;
                conversationQueryApplied = false;
            }
            const querySearch = (params.get('search') || '').trim();
            if (!querySearch) return;
            searchQuery = querySearch;
            if (searchInput) searchInput.value = querySearch;
        }

        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const queryConversation = parseInt(params.get('conversation') || params.get('conversationId') || '0', 10);
            if (Number.isInteger(queryConversation) && queryConversation > 0) {
                selectedConversationQueryId = queryConversation;
                conversationQueryApplied = false;
                selectConversationFromQuery();
            }
        });

        // ---- Init ----
        async function init() {
            applyQueryContext();
            await Promise.all([loadConversations(), loadQuickReplies(), loadStats()]);
            setupWS();
            // Refresh every 30s
            setInterval(() => {
                loadConversations();
                loadStats();
            }, 30000);
        }

        // Auth check (standalone page pattern — same as chat-page.js)
        document.addEventListener('DOMContentLoaded', function() {
            var token = localStorage.getItem('pzp_token');
            if (!token) {
                window.location.href = '/';
                return;
            }
            var savedUser = localStorage.getItem('pzp_current_user');
            if (savedUser) {
                try {
                    var parsed = JSON.parse(savedUser);
                    if (typeof AppState !== 'undefined') AppState.currentUser = parsed;
                    var userEl = document.getElementById('currentUser');
                    if (userEl) userEl.textContent = parsed.name || parsed.username || '';
                } catch (e) { /* ignore */ }
            }
            if (typeof showAuthenticatedPageShell === 'function') showAuthenticatedPageShell();
            else if (typeof Sidebar !== 'undefined' && Sidebar.markShellReady) Sidebar.markShellReady();
            if (typeof ParkWS !== 'undefined') ParkWS.connect();
            init();
        });
    })();
    </script>

    <script src="js/ui.js?v=0.49.18"></script>
    <script src="js/alerts.js?v=0.49.18"></script>
</body>
