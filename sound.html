<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Genix | Звук</title>
    <meta name="description" content="Event Genix — Звуковий модуль">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=38.1.1">
    <link rel="stylesheet" href="css/auth.css?v=38.1.1">
    <link rel="stylesheet" href="css/layout.css?v=38.1.1">
    <link rel="stylesheet" href="css/pages.css?v=38.1.1">
    <link rel="stylesheet" href="css/modals.css?v=38.1.1">
    <link rel="stylesheet" href="css/sound.css?v=38.1.1">
    <link rel="stylesheet" href="css/dark-mode.css?v=38.1.1">
    <link rel="stylesheet" href="css/responsive.css?v=38.1.1">
    <link rel="stylesheet" href="css/role-panel.css?v=38.1.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body data-page-group="sound">
    <script>(function(){var s=localStorage.getItem('pzp_dark_mode');if(s==='true'||(s===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.body.classList.add('dark-mode')}})();</script>

    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
    <!-- Login overlay -->
    <div id="loginOverlay" class="page-login-overlay hidden">
        <a href="/">Увійти в систему</a>
    </div>

    <div id="mainApp" class="hidden">
        <!-- Бокове меню -->
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-brand">
                    <img src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                    <div class="em-logo">
                        <span class="em-logo-title">Event Genix</span>
                        <span class="em-logo-sub">AI First CRM</span>
                    </div>
                </div>
                <div class="sidebar-user-card" id="sidebarUserCard">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName"></div>
                        <div class="sidebar-user-role" id="sidebarUserRole"></div>
                    </div>
                    <div class="sidebar-user-status online" id="sidebarUserStatus" aria-label="Онлайн">●</div>
                </div>
                <div class="sidebar-day-context" id="sidebarDayContext" style="display:none"></div>
            </div>
            <nav class="sidebar-links" id="sidebarLinks" aria-label="Головне меню"></nav>
        <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Згорнути/розгорнути меню">
            <span class="collapse-icon">◀</span>
            <span class="collapse-text">Згорнути</span>
        </button>
        </aside>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <header class="header">
            <div class="header-content">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Меню" aria-label="Відкрити/закрити меню">☰</button>
                <div class="user-panel">
                    <span id="currentUser" class="user-name"></span>
                    <button id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="page-container">
            <div class="sound-page">
                <div class="sound-header">
                    <div>
                        <h1>🔊 Звук — Лог подій</h1>
                        <p class="subtitle">Історія всіх звукових подій: оголошення, програвання, TTS</p>
                    </div>
                    <div class="sound-header-actions">
                        <button class="btn-outline" id="logRefreshBtn" title="Оновити" aria-label="Оновити лог">🔄 Оновити</button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="sound-log-filters">
                    <div class="sound-filter" role="group" aria-label="Фільтр за типом дії">
                        <button class="log-action-btn sound-filter-btn active" data-action="" aria-pressed="true">Всі</button>
                        <button class="log-action-btn sound-filter-btn" data-action="play" aria-pressed="false">▶ Програвання</button>
                        <button class="log-action-btn sound-filter-btn" data-action="tts" aria-pressed="false">🎙️ TTS</button>
                        <button class="log-action-btn sound-filter-btn" data-action="create" aria-pressed="false">➕ Створення</button>
                        <button class="log-action-btn sound-filter-btn" data-action="update" aria-pressed="false">✏️ Зміни</button>
                        <button class="log-action-btn sound-filter-btn" data-action="delete" aria-pressed="false">🗑️ Видалення</button>
                    </div>
                    <div class="sound-log-date-filter">
                        <label for="logDateFrom">Від:</label>
                        <input type="date" id="logDateFrom" aria-label="Дата початку">
                        <label for="logDateTo">До:</label>
                        <input type="date" id="logDateTo" aria-label="Дата кінця">
                    </div>
                </div>

                <!-- Stats summary -->
                <div class="sound-log-stats" id="logStats"></div>

                <!-- Log table -->
                <div id="logContainer" class="sound-log-wrap">
                    <div class="sound-empty"><div class="sound-empty-icon">📊</div><p>Завантаження...</p></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js?v=38.1.1"></script>
    <script src="js/api.js?v=38.1.1"></script>
    <script src="js/auth.js?v=38.1.1"></script>
    <script src="js/components/sidebar.js?v=38.1.1"></script>
    <script>if (typeof Sidebar !== "undefined") Sidebar.init("#sidebarLinks");</script>
    <script>
    (async function() {
        // Logout handler
        var logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) logoutBtn.addEventListener('click', function() {
            localStorage.removeItem('pzp_token');
            localStorage.removeItem(CONFIG.STORAGE.CURRENT_USER);
            window.location.href = '/';
        });

        var token = localStorage.getItem('pzp_token');
        if (token) {
            var user = await apiVerifyToken();
            if (user) {
                AppState.currentUser = user;
                document.getElementById('mainApp')?.classList.remove('hidden');
                document.getElementById('loginOverlay')?.classList.add('hidden');
                var ue = document.getElementById('currentUser'); if (ue) ue.textContent = user.name;
                if (typeof Sidebar !== 'undefined' && Sidebar.initUserCard) Sidebar.initUserCard();
                return;
            }
        }
        document.getElementById('loginOverlay')?.classList.remove('hidden');
    })();
    </script>
    <script src="js/sound-page.js?v=38.1.1"></script>
    <script src="js/role-panel.js?v=38.1.1"></script>
</body>
</html>
