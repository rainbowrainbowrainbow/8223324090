<html lang="uk">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Genix | HR</title>
    <meta name="description" content="Event Genix — AI First CRM для дитячих розважальних центрів">
    <meta property="og:title" content="Event Genix">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=43.16.0">
    <link rel="stylesheet" href="css/layout.css?v=43.16.0">
    <link rel="stylesheet" href="css/pages.css?v=43.16.0">
    <link rel="stylesheet" href="css/modals.css?v=43.16.0">
    <link rel="stylesheet" href="css/dark-mode.css?v=43.16.0">
    <link rel="stylesheet" href="css/responsive.css?v=43.16.0">
    <link rel="stylesheet" href="css/role-panel.css?v=43.16.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           HR TABS
           ========================================== */
        .hr-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: var(--gray-100);
            border-radius: var(--radius);
            padding: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .hr-tab {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: var(--font-sm);
            font-weight: 700;
            color: var(--gray-500);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--speed-fast) var(--ease-smooth);
            white-space: nowrap;
            text-align: center;
        }
        .hr-tab:hover { color: var(--gray-700); background: rgba(255,255,255,0.5); }
        .hr-tab.active {
            background: var(--white);
            color: var(--primary);
            box-shadow: var(--shadow-xs);
        }
        body.dark-mode .hr-tabs { background: #1E1E38; }
        body.dark-mode .hr-tab { color: #9CA3AF; }
        body.dark-mode .hr-tab:hover { color: #E2E8F0; background: rgba(255,255,255,0.05); }
        body.dark-mode .hr-tab.active { background: #2A2A4A; color: var(--primary-light); }

        .hr-tab-content { display: none; }
        .hr-tab-content.active { display: block; }

        /* ==========================================
           TAB 1: TODAY DASHBOARD
           ========================================== */
        .hr-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .hr-summary-card {
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-xs);
        }
        .hr-summary-card .value {
            font-size: 28px;
            font-weight: 900;
            color: var(--gray-800);
            line-height: 1.2;
        }
        .hr-summary-card .label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-500);
            margin-top: 4px;
        }
        .hr-summary-card.green .value { color: #10B981; }
        .hr-summary-card.yellow .value { color: #F59E0B; }
        .hr-summary-card.red .value { color: #EF4444; }

        .hr-today-date {
            font-size: var(--font-lg);
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 16px;
        }

        .hr-staff-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hr-staff-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius);
            padding: 14px 18px;
            box-shadow: var(--shadow-xs);
            transition: box-shadow var(--speed-fast) var(--ease-smooth);
        }
        .hr-staff-row:hover { box-shadow: var(--shadow-sm); }

        .hr-staff-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .hr-staff-indicator.present { background: #10B981; }
        .hr-staff-indicator.late { background: #F59E0B; }
        .hr-staff-indicator.absent { background: #9CA3AF; }
        .hr-staff-indicator.done { background: #3B82F6; }
        .hr-staff-indicator.sick { background: #8B5CF6; }
        .hr-staff-indicator.vacation { background: #8B5CF6; }
        .hr-staff-indicator.day_off { background: #8B5CF6; }
        .hr-staff-indicator.no_show { background: #EF4444; }
        .hr-staff-indicator.auto_closed { background: #6B7280; }

        .hr-staff-info {
            flex: 1;
            min-width: 0;
        }
        .hr-staff-name {
            font-weight: 700;
            font-size: var(--font-base);
            color: var(--gray-800);
        }
        .hr-staff-meta {
            font-size: var(--font-xs);
            color: var(--gray-500);
            margin-top: 2px;
        }
        .hr-staff-meta .late-badge {
            color: #F59E0B;
            font-weight: 700;
        }

        .hr-clock-btn {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: var(--font-xs);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--speed-fast) var(--ease-smooth);
            white-space: nowrap;
            min-width: 160px;
            text-align: center;
        }
        .hr-clock-btn.clock-in {
            background: var(--gray-100);
            color: var(--gray-600);
        }
        .hr-clock-btn.clock-in:hover { background: var(--gray-200); }
        .hr-clock-btn.clock-out {
            background: #10B981;
            color: #fff;
        }
        .hr-clock-btn.clock-out:hover { background: #059669; }
        .hr-clock-btn.clock-out.late {
            background: #F59E0B;
            color: #fff;
        }
        .hr-clock-btn.clock-out.late:hover { background: #D97706; }
        .hr-clock-btn.done {
            background: #DBEAFE;
            color: #3B82F6;
            cursor: default;
        }
        .hr-clock-btn.special {
            background: #EDE9FE;
            color: #7C3AED;
            cursor: default;
        }

        /* Context menu */
        .hr-context-menu {
            position: fixed;
            z-index: 1100;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 4px 0;
            min-width: 180px;
            display: none;
        }
        .hr-context-menu.visible { display: block; }
        .hr-context-item {
            display: block;
            width: 100%;
            padding: 10px 16px;
            border: none;
            background: none;
            font-family: inherit;
            font-size: var(--font-sm);
            color: var(--gray-700);
            text-align: left;
            cursor: pointer;
        }
        .hr-context-item:hover { background: var(--gray-50); }

        /* ==========================================
           TAB 2: SCHEDULE
           ========================================== */
        .hr-schedule-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .hr-schedule-controls .btn-nav {
            padding: 6px 12px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            border-radius: var(--radius-xs);
            font-size: var(--font-base);
            cursor: pointer;
            font-family: inherit;
        }
        .hr-schedule-controls .btn-nav:hover { background: var(--gray-50); }
        .hr-week-label {
            font-weight: 700;
            font-size: var(--font-base);
            color: var(--gray-800);
            min-width: 220px;
            text-align: center;
        }
        .hr-schedule-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .hr-schedule-actions button {
            padding: 6px 14px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            border-radius: var(--radius-xs);
            font-family: inherit;
            font-size: var(--font-xs);
            font-weight: 700;
            cursor: pointer;
            color: var(--gray-600);
        }
        .hr-schedule-actions button:hover { background: var(--gray-50); color: var(--primary); }

        .hr-view-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
        }
        .hr-view-btn {
            padding: 6px 16px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            font-family: inherit;
            font-size: var(--font-xs);
            font-weight: 700;
            cursor: pointer;
            color: var(--gray-500);
        }
        .hr-view-btn:first-child { border-radius: var(--radius-xs) 0 0 var(--radius-xs); }
        .hr-view-btn:last-child { border-radius: 0 var(--radius-xs) var(--radius-xs) 0; border-left: none; }
        .hr-view-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .hr-schedule-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius);
            border: 1px solid var(--gray-100);
            box-shadow: var(--shadow-xs);
        }
        .hr-schedule-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 600px;
        }
        .hr-schedule-table th {
            background: var(--gray-50);
            padding: 10px 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-500);
            text-align: center;
            border-bottom: 1px solid var(--gray-200);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .hr-schedule-table th:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            z-index: 3;
            background: var(--gray-50);
            min-width: 140px;
        }
        .hr-schedule-table td {
            padding: 6px 8px;
            text-align: center;
            border-bottom: 1px solid var(--gray-50);
            font-size: var(--font-xs);
            vertical-align: middle;
            cursor: pointer;
            min-width: 80px;
            transition: background var(--speed-fast);
        }
        .hr-schedule-table td:first-child {
            text-align: left;
            font-weight: 700;
            color: var(--gray-700);
            position: sticky;
            left: 0;
            background: var(--white);
            z-index: 1;
            cursor: default;
            padding-left: 12px;
        }
        .hr-schedule-table td:hover:not(:first-child) { background: var(--gray-50); }
        .hr-schedule-table th.today { background: #FEF3C7; color: var(--primary); }
        .hr-schedule-table td.today { background: #FFFBEB; }

        .hr-shift-cell {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.3;
        }
        .hr-shift-cell.regular { background: #D1FAE5; color: #065F46; }
        .hr-shift-cell.overtime, .hr-shift-cell.event { background: #FEF3C7; color: #92400E; }
        .hr-shift-cell.training { background: #DBEAFE; color: #1E40AF; }
        .hr-shift-cell.holiday { background: #EDE9FE; color: #5B21B6; }
        .hr-shift-cell.empty { color: var(--gray-300); font-weight: 400; }
        .hr-shift-cell.past { opacity: 0.5; }

        /* ==========================================
           TAB 3: TEAM
           ========================================== */
        .hr-team-filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .hr-team-search {
            padding: 8px 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: var(--font-sm);
            min-width: 200px;
            background: var(--white);
            color: var(--gray-700);
        }
        .hr-team-select {
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: var(--font-sm);
            background: var(--white);
            color: var(--gray-700);
        }
        .hr-team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }
        .hr-team-card {
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-xs);
            display: flex;
            gap: 16px;
            transition: box-shadow var(--speed-fast);
        }
        .hr-team-card:hover { box-shadow: var(--shadow-sm); }
        .hr-team-card.inactive { opacity: 0.5; }

        .hr-team-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            color: var(--gray-400);
            flex-shrink: 0;
            overflow: hidden;
        }
        .hr-team-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hr-team-details { flex: 1; min-width: 0; }
        .hr-team-name {
            font-weight: 800;
            font-size: var(--font-base);
            color: var(--gray-800);
            margin-bottom: 4px;
        }
        .hr-team-role {
            font-size: var(--font-xs);
            color: var(--gray-500);
            margin-bottom: 8px;
        }
        .hr-team-badges {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .hr-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 11px;
            cursor: help;
        }
        .hr-badge--ok {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success, #22c55e);
        }
        .hr-badge--warn {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning, #f59e0b);
        }
        .hr-missing-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(239, 68, 68, 0.1));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--gray-700);
        }
        .hr-team-contact {
            font-size: var(--font-xs);
            color: var(--gray-600);
            line-height: 1.6;
        }
        .hr-team-stats {
            font-size: 11px;
            color: var(--gray-500);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--gray-100);
        }
        .hr-team-edit {
            margin-top: 10px;
            padding: 6px 14px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            border-radius: var(--radius-xs);
            font-family: inherit;
            font-size: var(--font-xs);
            font-weight: 700;
            cursor: pointer;
            color: var(--gray-600);
        }
        .hr-team-edit:hover { background: var(--gray-50); color: var(--primary); }

        /* ==========================================
           TAB 4: REPORTS
           ========================================== */
        .hr-report-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .hr-report-controls select,
        .hr-report-controls input {
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: var(--font-sm);
            background: var(--white);
            color: var(--gray-700);
        }

        .hr-report-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .hr-report-stat {
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-xs);
        }
        .hr-report-stat .stat-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--gray-800);
        }
        .hr-report-stat .stat-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .hr-report-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .hr-report-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-xs);
            border: 1px solid var(--gray-100);
        }
        .hr-report-table th {
            background: var(--gray-50);
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-500);
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--gray-200);
        }
        .hr-report-table td {
            padding: 12px 14px;
            font-size: var(--font-sm);
            border-bottom: 1px solid var(--gray-50);
            color: var(--gray-700);
            white-space: nowrap;
        }
        .hr-report-table tr:last-child td { border-bottom: none; }
        .hr-report-table tr:hover td { background: var(--gray-50); }
        .hr-report-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

        /* ==========================================
           MODALS
           ========================================== */
        .hr-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .hr-modal {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .hr-modal h3 {
            font-size: var(--font-lg);
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 16px;
        }
        .hr-modal .form-group {
            margin-bottom: 14px;
        }
        .hr-modal .form-group label {
            display: block;
            font-size: var(--font-xs);
            font-weight: 700;
            color: var(--gray-600);
            margin-bottom: 4px;
        }
        .hr-modal .form-group input,
        .hr-modal .form-group select,
        .hr-modal .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-xs);
            font-family: inherit;
            font-size: var(--font-sm);
            color: var(--gray-700);
            background: var(--white);
            box-sizing: border-box;
        }
        .hr-modal .form-group textarea { resize: vertical; min-height: 60px; }
        .hr-modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .hr-modal-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-xs);
            font-family: inherit;
            font-size: var(--font-sm);
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-600);
        }
        .btn-secondary:hover { background: var(--gray-200); }
        .btn-danger {
            background: #EF4444;
            color: #fff;
        }
        .btn-danger:hover { background: #DC2626; }
        .btn-export {
            padding: 8px 20px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            border-radius: var(--radius-xs);
            font-family: inherit;
            font-size: var(--font-sm);
            font-weight: 700;
            cursor: pointer;
            color: var(--gray-600);
        }
        .btn-export:hover { background: var(--gray-50); color: var(--primary); }
        .btn-add {
            padding: 8px 20px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-family: inherit;
            font-size: var(--font-xs);
            font-weight: 700;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .btn-add:hover { opacity: 0.9; }

        /* ==========================================
           DARK MODE
           ========================================== */
        body.dark-mode .hr-summary-card,
        body.dark-mode .hr-staff-row,
        body.dark-mode .hr-team-card,
        body.dark-mode .hr-report-stat,
        body.dark-mode .hr-modal {
            background: #2A2A4A;
            border-color: #3D3D5C;
            color: #E2E8F0;
        }
        body.dark-mode .hr-summary-card .hr-summary-value { color: inherit; }
        body.dark-mode .hr-summary-card .hr-summary-label { color: #9CA3AF; }
        body.dark-mode .hr-staff-name,
        body.dark-mode .hr-team-name,
        body.dark-mode .hr-today-date,
        body.dark-mode .hr-week-label,
        body.dark-mode .hr-modal h3 {
            color: #E2E8F0;
        }
        body.dark-mode .hr-staff-role,
        body.dark-mode .hr-staff-dept { color: #9CA3AF; }
        body.dark-mode .hr-clock-btn { background: #3D3D5C; color: #E2E8F0; border-color: #4A4A6A; }
        body.dark-mode .hr-clock-btn:hover { background: #4A4A6A; }
        body.dark-mode .hr-schedule-table th { background: #1E1E38; color: #9CA3AF; border-color: #3D3D5C; }

    <script>
    // ─── Shifts Summary (v33.5) ──────────
    async function loadShiftsSummary() {
        const month = document.getElementById('shiftsMonthPicker')?.value || new Date().toISOString().slice(0,7);
        const container = document.getElementById('shiftsSummaryContainer');
        if (!container) return;
        container.innerHTML = '<p style="color:var(--gray-400)">Завантаження...</p>';
        try {
            const token = localStorage.getItem('pzp_token');
            const res = await fetch(`/api/hr/shifts-summary?month=${month}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const { summary = [], period } = await res.json();
            if (!summary.length) {
                container.innerHTML = '<p style="color:var(--gray-400); font-size:13px;">Немає даних.<br>Додайте <b>display_name</b> аніматорам (як вписують в бронюваннях).</p>';
                return;
            }
            container.innerHTML = `
                <p style="font-size:12px;color:var(--gray-400);margin:0 0 12px">${period.from} — ${period.to}</p>
                <table class="data-table" style="width:100%">
                  <thead><tr><th>Аніматор</th><th style="text-align:center">Всього</th><th style="text-align:center">Ведучий</th><th style="text-align:center">Другий</th></tr></thead>
                  <tbody>${summary.map(s => `
                    <tr>
                      <td><strong>${s.name}</strong> <span style="font-size:12px;color:var(--gray-400);margin-left:6px;">(${s.displayName})</span></td>
                      <td style="text-align:center"><strong>${s.total}</strong></td>
                      <td style="text-align:center">${s.asHost}</td>
                      <td style="text-align:center">${s.asSecond}</td>
                    </tr>`).join('')}
                  </tbody>
                </table>`;
        } catch (e) { container.innerHTML = `<p style="color:#ef4444">❌ ${e.message}</p>`; }
    }
    document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('shiftsMonthPicker');
        if (picker) { picker.value = new Date().toISOString().slice(0,7); loadShiftsSummary(); }
    });

    // v33.8.0: Salary commit to finance
    async function commitSalaries() {
        var monthEl = document.getElementById('salaryMonth');
        var month = monthEl ? monthEl.value : null;
        if (!month) { if (typeof showToast === 'function') showToast('Оберіть місяць', 'error'); return; }
        if (!confirm('Нарахувати зарплати за ' + month + '? Це запише транзакції у фінанси.')) return;
        var token = localStorage.getItem('pzp_token');
        try {
            var resp = await fetch('/api/hr/salary/commit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ month: month })
            });
            var data = await resp.json();
            if (resp.ok && data.success) {
                if (typeof showToast === 'function') showToast('Нараховано ' + data.committed + ' зарплат за ' + month + '!', 'success');
            } else {
                if (typeof showToast === 'function') showToast(data.error || 'Помилка', 'error');
            }
        } catch (e) {
            if (typeof showToast === 'function') showToast('Помилка: ' + e.message, 'error');
        }
    }
    </script>
