<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Genix | Програми</title>
    <meta name="description" content="Event Genix — AI First CRM для дитячих розважальних центрів">
    <meta property="og:title" content="Event Genix">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <script>
    // Early embed-mode detection — MUST run before CSS to prevent sidebar flash
    (function() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('embedded') === '1' || params.get('embed') === '1') {
            document.documentElement.classList.add('embed-mode');
        }
        try { if (window.self !== window.top) document.documentElement.classList.add('embed-mode'); } catch(e) { document.documentElement.classList.add('embed-mode'); }
    })();
    </script>
    <link rel="stylesheet" href="css/base.css?v=40.4.0">
    <link rel="stylesheet" href="css/layout.css?v=40.4.0">
    <link rel="stylesheet" href="css/pages.css?v=40.4.0">
    <link rel="stylesheet" href="css/modals.css?v=40.4.0">
    <link rel="stylesheet" href="css/dark-mode.css?v=40.4.0">
    <link rel="stylesheet" href="css/responsive.css?v=40.4.0">
    <link rel="stylesheet" href="css/role-panel.css?v=40.4.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .embed-mode .sidebar-nav,
        .embed-mode .header,
        .embed-mode .sidebar-overlay,
        .embed-mode .skip-link,
        .embed-mode .page-login-overlay { display: none !important; }
        .embed-mode .page-container { margin-left: 0 !important; padding: 16px !important; }
    </style>
</head>
<body data-page-group="art">
    <script>
    // Dark mode flash prevention
    (function(){var s=localStorage.getItem('pzp_dark_mode');if(s==='true'||(s===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.body.classList.add('dark-mode')}})();
    </script>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
    <!-- Login overlay (hidden if authorized) -->
    <div id="loginOverlay" class="page-login-overlay hidden">
        <a href="/">Увійти в систему</a>
    </div>

    <div id="mainApp">
        <!-- Бокове меню -->
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-brand">
                    <img loading="lazy" src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                    <div class="em-logo">
                        <span class="em-logo-title">Event Genix</span>
                        <span class="em-logo-sub">AI First CRM</span>
                    </div>
                </div>
                <div class="sidebar-user-card" id="sidebarUserCard">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName"></div>
                        <div class="sidebar-user-role" id="sidebarUserRole"></div>
                    </div>
                    <div class="sidebar-user-status online" id="sidebarUserStatus">●</div>
                </div>
                <div class="sidebar-day-context" id="sidebarDayContext" style="display:none"></div>
            </div>
            <nav class="sidebar-links" id="sidebarLinks"></nav>
        <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Згорнути/розгорнути меню">
            <span class="collapse-icon">◀</span>
            <span class="collapse-text">Згорнути</span>
        </button>
        </aside>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <header class="header">
            <div class="header-content">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Меню" aria-label="Відкрити/закрити меню">☰</button>
                <div class="user-panel">
                    <span id="currentUser" class="user-name"></span>
                    <button type="button" id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="page-container">
            <div class="page-header">
                <h2>Каталог програм</h2>
                <button type="button" id="addProductBtn" class="btn-page-primary">+ Додати програму</button>
            </div>

            <!-- Category tabs -->
            <div id="categoryTabs" class="category-tabs"></div>

            <!-- Add/edit form (hidden by default) -->
            <div id="productForm" class="inline-form" style="display:none;">
                <div class="form-field">
                    <label>Код</label>
                    <input type="text" id="pf-code" aria-label="КВ1" placeholder="КВ1" maxlength="20" style="width:80px">
                </div>
                <div class="form-field">
                    <label>Назва</label>
                    <input type="text" id="pf-name" aria-label="Квест «Загадки Фараона»" placeholder="Квест «Загадки Фараона»" style="min-width:200px">
                </div>
                <div class="form-field">
                    <label>Мітка</label>
                    <input type="text" id="pf-label" aria-label="КВ1(60)" placeholder="КВ1(60)" style="width:120px">
                </div>
                <div class="form-field">
                    <label>Іконка</label>
                    <input type="text" id="pf-icon" aria-label="🏛" placeholder="🏛" style="width:60px">
                </div>
                <div class="form-field">
                    <label>Категорія</label>
                    <select id="pf-category">
                        <option value="quest">Квести</option>
                        <option value="animation">Анімація</option>
                        <option value="show">Шоу</option>
                        <option value="photo">Фото</option>
                        <option value="masterclass">Майстер-класи</option>
                        <option value="pinata">Піньяти</option>
                        <option value="custom">Кастом</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Хвилин</label>
                    <input type="number" id="pf-duration" value="60" min="0" step="15" style="width:80px">
                </div>
                <div class="form-field">
                    <label>Ціна (₴)</label>
                    <input type="number" id="pf-price" value="0" min="0" style="width:100px">
                </div>
                <div class="form-field">
                    <label>Ведучих</label>
                    <input type="number" id="pf-hosts" value="1" min="0" style="width:70px">
                </div>
                <div class="form-field">
                    <label>Вік</label>
                    <input type="text" id="pf-age" aria-label="6-12" placeholder="6-12" style="width:80px">
                </div>
                <div class="form-field">
                    <label>Дітей</label>
                    <input type="text" id="pf-kids" aria-label="до 15" placeholder="до 15" style="width:80px">
                </div>
                <div class="form-field">
                    <label>Опис</label>
                    <input type="text" id="pf-description" aria-label="Короткий опис" placeholder="Короткий опис" style="min-width:200px">
                </div>
                <div class="form-field" style="flex-direction:row; align-items:center; gap:8px; margin-top:20px;">
                    <label style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="pf-perchild"> За дитину</label>
                    <label style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="pf-filler"> Наповнювач</label>
                    <label style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="pf-active" checked> Активна</label>
                </div>
                <input type="hidden" id="pf-id" value="">
                <input type="hidden" id="pf-sort" value="0">
                <div style="display:flex; gap:8px; margin-top:20px;">
                    <button type="button" id="saveProductBtn" class="btn-page-primary">Зберегти</button>
                    <button type="button" id="cancelProductBtn" class="btn-page-secondary">Скасувати</button>
                </div>
            </div>

            <!-- Products grid -->
            <div id="productsGrid" class="cards-grid"></div>
        </main>
    </div>

    <!-- v10.4: Особистий кабінет -->
    <div id="profileModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Особистий кабінет">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close">&times;</span>
            <h3>Особистий кабінет</h3>
            <div id="profileContent" class="profile-content">
                <div class="profile-loading">Завантаження...</div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <span id="notificationText"></span>
    </div>

    <script src="js/ui.js?v=40.4.0"></script>
    <script src="js/config.js?v=40.4.0"></script>
    <script src="js/notification.js?v=40.4.0"></script>
    <script src="js/api.js?v=40.4.0"></script>
    <script src="js/auth.js?v=40.4.0"></script>
    <script src="js/components/sidebar.js?v=40.4.0"></script>
    <script>if (typeof Sidebar !== "undefined" && !document.documentElement.classList.contains('embed-mode')) Sidebar.init("#sidebarLinks");</script>
    <script src="js/programs-page.js?v=40.4.0"></script>
    <script>
    // Sidebar toggle for mobile
    (function(){
        var t=document.getElementById('sidebarToggle'),s=document.getElementById('sidebarNav'),o=document.getElementById('sidebarOverlay');
        if(t&&s){t.addEventListener('click',function(){s.classList.toggle('open');if(o)o.classList.toggle('hidden')})}
        if(o&&s){o.addEventListener('click',function(){s.classList.remove('open');o.classList.add('hidden')})}
    })();
    </script>
    <script src="js/role-panel.js?v=40.4.0"></script>
    <script src="js/alerts.js?v=40.4.0"></script>
</body>
</html>
