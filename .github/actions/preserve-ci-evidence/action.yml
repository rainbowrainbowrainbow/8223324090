name: Preserve complete CI evidence
description: Keep GitHub uploads on hosted runners and independently verified private archives on the approved local worker.
inputs:
  name:
    description: Original artifact name
    required: true
  path:
    description: Original newline-separated evidence paths
    required: true
  if-no-files-found:
    description: Preserve the original error, warn or ignore policy
    default: warn
  retention-days:
    description: Retention for the unchanged hosted-runner upload path
    default: '7'
runs:
  using: composite
  steps:
    - name: Preserve hosted-runner evidence
      if: runner.environment != 'self-hosted'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
    - name: Require independently verified private host archive
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        EVIDENCE_NAME: ${{ inputs.name }}
        EVIDENCE_PATHS: ${{ inputs.path }}
        EVIDENCE_MISSING: ${{ inputs.if-no-files-found }}
      run: node scripts/ci-local-evidence.cjs
