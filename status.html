    <title>Event Genix | Status</title>
    <meta name="description" content="Event Genix — системний статус">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #0a1628 0%, #0f1f3a 30%, #0a2540 60%, #112240 100%);
            color: #E2E8F0;
            min-height: 100vh;
        }

        .status-header {
            text-align: center;
            padding: 48px 20px 32px;
        }
        .status-header .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .status-header .logo-img {
            width: 44px; height: 44px;
            border-radius: 12px;
        }
        .status-header h1 {
            font-size: 22px;
            font-weight: 900;
            color: #F0FDF4;
        }
        .status-header .subtitle {
            color: #94A3B8;
            font-size: 14px;
            font-weight: 600;
        }

        /* Overall status banner */
        .overall-banner {
            max-width: 700px;
            margin: 0 auto 32px;
            padding: 20px 24px;
            border-radius: 16px;
            text-align: center;
            font-weight: 800;
            font-size: 18px;
        }
        .overall-banner.operational {
            background: rgba(16,185,129,0.12);
            border: 1px solid rgba(16,185,129,0.3);
            color: #6EE7B7;
        }
        .overall-banner.degraded {
            background: rgba(201,168,76,0.12);
            border: 1px solid rgba(201,168,76,0.3);
            color: #C9A84C;
        }
        .overall-banner.partial_outage {
            background: rgba(251,146,60,0.12);
            border: 1px solid rgba(251,146,60,0.3);
            color: #FB923C;
        }
        .overall-banner.major_outage {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #F87171;
        }
        .overall-banner.maintenance {
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.3);
            color: #A5B4FC;
        }
        .overall-banner .status-dot {
            display: inline-block;
            width: 12px; height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
            animation: pulse 2s ease-in-out infinite;
        }
        .overall-banner.operational .status-dot { background: #10B981; }
        .overall-banner.degraded .status-dot { background: #C9A84C; }
        .overall-banner.partial_outage .status-dot { background: #FB923C; }
        .overall-banner.major_outage .status-dot { background: #EF4444; }
        .overall-banner.maintenance .status-dot { background: #6366F1; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* Section */
        .status-section {
            margin-bottom: 28px;
        }
        .status-section-title {
            font-size: 13px;
            font-weight: 800;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        /* Component rows */
        .component-list {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
        }
        .component-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .component-row:last-child { border-bottom: none; }

        .component-name {
            font-weight: 700;
            font-size: 14px;
            color: #E2E8F0;
        }
        .component-desc {
            font-size: 12px;
            color: #64748B;
            margin-top: 2px;
        }

        .component-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .component-badge.operational {
            background: rgba(16,185,129,0.15);
            color: #6EE7B7;
        }
        .component-badge.degraded {
            background: rgba(201,168,76,0.15);
            color: #C9A84C;
        }
        .component-badge.partial_outage {
            background: rgba(251,146,60,0.15);
            color: #FB923C;
        }
        .component-badge.major_outage {
            background: rgba(239,68,68,0.15);
            color: #F87171;
        }
        .component-badge.maintenance {
            background: rgba(99,102,241,0.15);
            color: #A5B4FC;
        }

        /* Incidents */
        .incident-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 12px;
        }
        .incident-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .incident-severity {
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .incident-severity.minor {
            background: rgba(201,168,76,0.15);
            color: #C9A84C;
        }
        .incident-severity.major {
            background: rgba(251,146,60,0.15);
            color: #FB923C;
        }
        .incident-severity.critical {
            background: rgba(239,68,68,0.15);
            color: #F87171;
        }
        .incident-title {
            font-weight: 800;
            font-size: 15px;
            color: #F0FDF4;
        }
        .incident-meta {
            font-size: 12px;
            color: #64748B;
            margin-bottom: 10px;
        }
        .incident-update {
            padding: 8px 0 8px 16px;
            border-left: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 6px;
        }
        .incident-update-status {
            font-size: 11px;
            font-weight: 700;
            color: #94A3B8;
            text-transform: uppercase;
        }
        .incident-update-msg {
            font-size: 13px;
            color: #CBD5E1;
            margin-top: 2px;
        }
        .incident-update-time {
            font-size: 11px;
            color: #475569;
            margin-top: 2px;
        }

        .no-incidents {
            text-align: center;
            padding: 32px;
            color: #64748B;
            font-size: 14px;
            font-weight: 600;
        }

        /* Footer */
        .status-footer {
            text-align: center;
            padding: 24px;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
        }
        .status-footer a {
            color: #6EE7B7;
            text-decoration: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #64748B;
            font-size: 14px;
        }

        html[data-theme="light"] body:not(.dark-mode) {
            background:
                radial-gradient(ellipse at 20% 0%, rgba(16,185,129,0.10) 0%, transparent 45%),
                linear-gradient(180deg, #FBFAF6 0%, #F4EFE6 100%);
            color: #1F2933;
        }
        html[data-theme="light"] body:not(.dark-mode) .page-container {
            background: transparent;
        }
        html[data-theme="light"] body:not(.dark-mode) .status-header h1,
        html[data-theme="light"] body:not(.dark-mode) .component-name,
        html[data-theme="light"] body:not(.dark-mode) .incident-title {
            color: #0F172A;
        }
        html[data-theme="light"] body:not(.dark-mode) .status-header .subtitle,
        html[data-theme="light"] body:not(.dark-mode) .component-desc,
        html[data-theme="light"] body:not(.dark-mode) .incident-meta,
        html[data-theme="light"] body:not(.dark-mode) .incident-update-time,
        html[data-theme="light"] body:not(.dark-mode) .no-incidents,
        html[data-theme="light"] body:not(.dark-mode) .loading,
        html[data-theme="light"] body:not(.dark-mode) .status-footer {
            color: #64748B;
        }
        html[data-theme="light"] body:not(.dark-mode) .component-list,
        html[data-theme="light"] body:not(.dark-mode) .incident-card {
            background: rgba(255,255,255,0.86);
            border-color: rgba(113,89,50,0.14);
            box-shadow: 0 16px 34px rgba(54,43,24,0.08);
        }
        html[data-theme="light"] body:not(.dark-mode) .component-row {
            border-bottom-color: rgba(113,89,50,0.10);
        }
        html[data-theme="light"] body:not(.dark-mode) .incident-update {
            border-left-color: rgba(15,118,110,0.18);
        }
        html[data-theme="light"] body:not(.dark-mode) .incident-update-msg {
            color: #334155;
        }
        html[data-theme="light"] body:not(.dark-mode) .status-header a {
            background: rgba(255,255,255,0.78) !important;
            border-color: rgba(15,118,110,0.20) !important;
            color: #0F766E !important;
        }
        html[data-theme="light"] body:not(.dark-mode) .status-footer a {
            color: #0F766E;
        }

        @media (max-width: 480px) {
            .status-header { padding: 32px 16px 24px; }
            .status-header h1 { font-size: 18px; }
            .overall-banner { font-size: 15px; padding: 16px 18px; margin-bottom: 24px; }
            .component-row { padding: 12px 14px; }
        }
    </style>
</head>
