    <style>
        /* Art Director page styles */
        .artdir-page { padding: 16px; max-width: 1400px; margin: 0 auto; }
        .artdir-page h1 { font-size: 22px; font-weight: 900; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* Tabs */
        .artdir-tabs {
            display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .artdir-tab {
            padding: 8px 16px; border: none; border-radius: 12px;
            font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
            background: rgba(255,255,255,0.35); color: var(--gray-600);
            transition: all 0.2s; backdrop-filter: blur(8px);
        }
        .artdir-tab:hover { background: rgba(255,255,255,0.6); }
        .artdir-tab.active { background: var(--primary); color: #fff; }
        .artdir-tab-content { display: none; }
        .artdir-tab-content.active { display: block; }
        .artdir-embed-frame { width: 100%; min-height: calc(100vh - 160px); border: none; border-radius: 12px; background: rgba(255,255,255,0.2); }

        /* Section blocks (reuse center pattern) */
        .artdir-section {
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 20px;
        }
        .artdir-section-title {
            font-size: 15px; font-weight: 800; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .artdir-section-title .section-icon { font-size: 18px; }

        /* ==================== OVERVIEW TAB ==================== */
        .overview-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px; margin-bottom: 16px;
        }
        .overview-stat {
            background: rgba(255,255,255,0.4);
            border-radius: 12px; padding: 12px; text-align: center;
        }
        .overview-stat-value { font-size: 22px; font-weight: 900; }
        .overview-stat-label { font-size: 11px; color: var(--gray-500); font-weight: 600; margin-top: 2px; }

        .stat-draft { color: var(--gray-600); }
        .stat-review { color: #1565C0; }
        .stat-approved { color: #2E7D32; }
        .stat-rejected { color: #C62828; }
        .stat-published { color: #6A1B9A; }

        .recent-list { display: flex; flex-direction: column; gap: 6px; }
        .recent-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; border-radius: 10px;
            background: rgba(255,255,255,0.4); font-size: 13px;
        }
        .recent-item-title { flex: 1; font-weight: 600; }
        .recent-item-status { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 700; }

        /* ==================== PIPELINE TAB ==================== */
        .pipeline-toolbar {
            display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
        }
        .pipeline-toolbar select, .pipeline-toolbar input {
            padding: 7px 12px; border: 1.5px solid var(--gray-200); border-radius: 10px;
            font-family: inherit; font-size: 13px; background: rgba(255,255,255,0.6);
        }
        .pipeline-toolbar input { flex: 1; min-width: 150px; }
        .pipeline-toolbar .btn-create {
            padding: 7px 16px; border: none; border-radius: 10px;
            background: var(--primary); color: #fff; font-weight: 700;
            font-family: inherit; font-size: 13px; cursor: pointer;
            white-space: nowrap;
        }
        .pipeline-toolbar .btn-create:hover { background: var(--primary-dark); }

        /* Kanban board */
        .pipeline-kanban {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }
        .kanban-column {
            background: rgba(255,255,255,0.2);
            border-radius: 14px; padding: 10px;
            min-height: 100px;
        }
        .kanban-column-header {
            font-size: 12px; font-weight: 800; padding: 6px 10px;
            margin-bottom: 8px; border-radius: 8px; text-align: center;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .kanban-header-draft { background: var(--gray-100); color: var(--gray-600); }
        .kanban-header-in_review { background: #E3F2FD; color: #1565C0; }
        .kanban-header-approved { background: #E8F5E9; color: #2E7D32; }
        .kanban-header-published { background: #F3E5F5; color: #6A1B9A; }

        .kanban-card {
            background: rgba(255,255,255,0.6);
            border-radius: 12px; padding: 10px 12px;
            margin-bottom: 8px; cursor: pointer;
            transition: all 0.2s; border: 2px solid transparent;
        }
        .kanban-card:hover { transform: translateY(-1px); box-shadow: 0 3px 12px rgba(0,0,0,0.06); }
        .kanban-card.priority-urgent { border-left: 3px solid #E53935; }
        .kanban-card.priority-high { border-left: 3px solid #FF9800; }
        .kanban-card-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
        .kanban-card-meta { font-size: 11px; color: var(--gray-500); display: flex; gap: 8px; flex-wrap: wrap; }
        .kanban-card-badge {
            display: inline-block; padding: 1px 6px; border-radius: 4px;
            font-size: 10px; font-weight: 700; background: var(--gray-100); color: var(--gray-500);
        }
        .kanban-card-actions { display: flex; gap: 4px; margin-top: 6px; }
        .kanban-card-actions button {
            padding: 3px 8px; border: none; border-radius: 6px;
            font-size: 10px; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: all 0.1s;
        }
        .btn-advance { background: #E8F5E9; color: #2E7D32; }
        .btn-advance:hover { background: #C8E6C9; }
        .btn-reject { background: #FFEBEE; color: #C62828; }
        .btn-reject:hover { background: #FFCDD2; }
        .btn-edit { background: var(--gray-100); color: var(--gray-600); }
        .btn-edit:hover { background: var(--gray-200); }

        .pipeline-empty {
            text-align: center; padding: 20px; color: var(--gray-400);
            font-size: 12px;
        }

        /* ==================== TEMPLATES TAB ==================== */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .template-card {
            background: rgba(255,255,255,0.5);
            border-radius: 14px; padding: 14px 16px;
            cursor: pointer; transition: all 0.2s;
            border: 2px solid transparent; position: relative;
        }
        .template-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .template-card-icon { font-size: 28px; margin-bottom: 8px; }
        .template-card-name { font-weight: 800; font-size: 14px; margin-bottom: 4px; }
        .template-card-desc { font-size: 12px; color: var(--gray-500); margin-bottom: 6px; line-height: 1.4; }
        .template-card-meta { font-size: 11px; color: var(--gray-400); display: flex; gap: 8px; }
        .template-card-badge {
            position: absolute; top: 10px; right: 10px;
            padding: 2px 8px; border-radius: 6px; font-size: 10px;
            font-weight: 700; background: var(--gray-100); color: var(--gray-500);
        }
        .template-card-use {
            font-size: 11px; color: var(--gray-400); margin-top: 4px;
        }

        .template-categories {
            display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap;
        }
        .template-cat-chip {
            padding: 5px 12px; border: none; border-radius: 8px;
            font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
            background: rgba(255,255,255,0.3); color: var(--gray-600);
            transition: all 0.2s;
        }
        .template-cat-chip:hover { background: rgba(255,255,255,0.5); }
        .template-cat-chip.active { background: var(--primary); color: #fff; }

        /* ==================== BRAND TAB ==================== */
        .brand-group { margin-bottom: 18px; }
        .brand-group-title {
            font-size: 13px; font-weight: 800; margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--gray-500); display: flex; align-items: center; gap: 6px;
        }
        .brand-items { display: flex; flex-direction: column; gap: 6px; }

        .brand-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; border-radius: 12px;
            background: rgba(255,255,255,0.4); font-size: 13px;
        }
        .brand-item-swatch {
            width: 32px; height: 32px; border-radius: 8px;
            border: 2px solid rgba(0,0,0,0.1); flex-shrink: 0;
        }
        .brand-item-title { font-weight: 700; flex: 1; }
        .brand-item-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--gray-500); }
        .brand-item-desc { font-size: 11px; color: var(--gray-400); flex: 2; }
        .brand-item-actions { display: flex; gap: 4px; }
        .brand-item-actions button {
            padding: 4px 8px; border: none; border-radius: 6px;
            font-size: 11px; cursor: pointer; font-family: inherit; font-weight: 600;
            background: var(--gray-100); color: var(--gray-500); transition: all 0.1s;
        }
        .brand-item-actions button:hover { background: var(--gray-200); }

        .brand-add-row {
            display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
        }
        .brand-add-row input, .brand-add-row select {
            padding: 6px 10px; border: 1.5px solid var(--gray-200); border-radius: 8px;
            font-family: inherit; font-size: 13px; background: rgba(255,255,255,0.6);
        }
        .brand-add-row input { flex: 1; min-width: 100px; }
        .brand-add-row button {
            padding: 6px 14px; border: none; border-radius: 8px;
            background: var(--primary); color: #fff; font-weight: 700;
            font-family: inherit; cursor: pointer; white-space: nowrap;
        }

        /* Status badges */
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .status-draft { background: var(--gray-100); color: var(--gray-600); }
        .status-in_review { background: #E3F2FD; color: #1565C0; }
        .status-approved { background: #E8F5E9; color: #2E7D32; }
        .status-rejected { background: #FFEBEE; color: #C62828; }
        .status-published { background: #F3E5F5; color: #6A1B9A; }
        .status-archived { background: var(--gray-100); color: var(--gray-400); }

        /* Category icons */
        .cat-icon-poster::before { content: '📄'; }
        .cat-icon-social::before { content: '📱'; }
        .cat-icon-certificate::before { content: '🎓'; }
        .cat-icon-banner::before { content: '🖼'; }
        .cat-icon-print::before { content: '🖨'; }

        /* Empty & Loading */
        .artdir-empty { text-align: center; padding: 30px; color: var(--gray-400); font-size: 13px; }
        .artdir-empty span { font-size: 32px; display: block; margin-bottom: 8px; }
        .artdir-loading { text-align: center; padding: 40px; color: var(--gray-400); font-size: 14px; }

        /* Responsive */
        @media (max-width: 768px) {
            .artdir-page { padding: 12px; }
            .artdir-tabs { gap: 3px; }
            .artdir-tab { padding: 6px 12px; font-size: 12px; }
            .overview-stats { grid-template-columns: repeat(2, 1fr); }
            .pipeline-kanban { grid-template-columns: 1fr; }
            .templates-grid { grid-template-columns: 1fr; }
            .brand-item { flex-direction: column; align-items: flex-start; gap: 6px; }
            .pipeline-toolbar { flex-direction: column; }
        }

        /* Dark mode overrides */
        .dark-mode .artdir-section { background: rgba(30,30,30,0.5); }
        .dark-mode .artdir-tab { background: rgba(50,50,50,0.4); color: var(--gray-400); }
        .dark-mode .artdir-tab.active { background: var(--primary); color: #fff; }
        .dark-mode .overview-stat { background: rgba(40,40,40,0.5); }
        .dark-mode .kanban-column { background: rgba(30,30,30,0.3); }
        .dark-mode .kanban-card { background: rgba(40,40,40,0.6); }
        .dark-mode .template-card { background: rgba(40,40,40,0.6); }
        .dark-mode .brand-item { background: rgba(40,40,40,0.4); }
        .dark-mode .recent-item { background: rgba(40,40,40,0.4); }
        .dark-mode .pipeline-toolbar select,
        .dark-mode .pipeline-toolbar input {
            background: rgba(40,40,40,0.8); color: #e0e0e0; border-color: var(--gray-600);
        }
        .dark-mode .brand-add-row input,
        .dark-mode .brand-add-row select {
            background: rgba(40,40,40,0.8); color: #e0e0e0; border-color: var(--gray-600);
        }
    </style>
</head>
<body data-page-group="art">
    <script>
    // Dark mode flash prevention
    (function(){var s=localStorage.getItem('pzp_dark_mode');if(s==='true'||(s===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.body.classList.add('dark-mode')}})();
    </script>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
    <!-- Login overlay -->
    <div id="loginOverlay" class="page-login-overlay hidden">
        <a href="/">Увійти в систему</a>
    </div>

    <div id="mainApp" class="main-app hidden">
        <!-- Бокове меню -->
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-brand">
                    <img loading="lazy" src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                    <div class="em-logo">
                        <span class="em-logo-title">Event Genix</span>
                        <span class="em-logo-sub">AI First CRM</span>
                    </div>
                </div>
                <div class="sidebar-user-card" id="sidebarUserCard">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName"></div>
                        <div class="sidebar-user-role" id="sidebarUserRole"></div>
                    </div>
                    <div class="sidebar-user-status online" id="sidebarUserStatus">●</div>
                </div>
                <div class="sidebar-day-context" id="sidebarDayContext" style="display:none"></div>
            </div>
            <nav class="sidebar-links" id="sidebarLinks"></nav>
        <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Згорнути/розгорнути меню">
            <span class="collapse-icon">◀</span>
            <span class="collapse-text">Згорнути</span>
        </button>
        </aside>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <header class="header">
            <div class="header-content">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Меню" aria-label="Відкрити/закрити меню">☰</button>
                <div class="user-panel">
                    <span id="currentUser" class="user-name"></span>
                    <button type="button" id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="page-container">
            <div class="artdir-page">
                <h1>Арт</h1>

                <!-- Tabs -->
                <div class="artdir-tabs" id="artdirTabs">
                    <button type="button" class="artdir-tab active" data-tab="overview">Огляд</button>
                    <button type="button" class="artdir-tab" data-tab="pipeline">Конвеєр</button>
                    <button type="button" class="artdir-tab" data-tab="templates">Шаблони</button>
                    <button type="button" class="artdir-tab" data-tab="brand">Brand Book</button>
                    <button type="button" class="artdir-tab" data-tab="programs">Програми</button>
                    <button type="button" class="artdir-tab" data-tab="designs">Дизайни</button>
                    <button type="button" class="artdir-tab" data-tab="graduation">Випускний</button>
                </div>

                <!-- Tab: Programs (read-only catalog) -->
                <div class="artdir-tab-content" id="tab-programs">
                    <iframe data-src="/programs?embedded=1" class="artdir-embed-frame" title="Каталог програм"></iframe>
                </div>

                <!-- Tab: Designs (full functionality) -->
                <div class="artdir-tab-content" id="tab-designs">
                    <iframe data-src="/designs?embedded=1" class="artdir-embed-frame" title="Дизайни"></iframe>
                </div>

                <!-- Tab: Graduation (v30.0.0) -->
                <div class="artdir-tab-content" id="tab-graduation">
                    <iframe data-src="/graduation?embedded=1" class="artdir-embed-frame" title="Конструктор випускного"></iframe>
                </div>

                <!-- Tab: Overview -->
                <div class="artdir-tab-content active" id="tab-overview">
                    <div class="artdir-section">
                        <div class="artdir-section-title">
                            <span class="section-icon"></span> Стан конвеєра
                        </div>
                        <div class="overview-stats" id="overviewStats">
                            <div class="artdir-loading">Завантаження...</div>
                        </div>
                    </div>

                    <div class="artdir-section">
                        <div class="artdir-section-title">
                            <span class="section-icon"></span> Останні зміни
                        </div>
                        <div class="recent-list" id="recentList">
                            <div class="artdir-loading">Завантаження...</div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Pipeline (Kanban) -->
                <div class="artdir-tab-content" id="tab-pipeline">
                    <div class="pipeline-toolbar" id="pipelineToolbar">
                        <select id="pipelineCategoryFilter">
                            <option value="">Всі категорії</option>
                            <option value="poster">Афіші</option>
                            <option value="social">Соцмережі</option>
                            <option value="certificate">Сертифікати</option>
                            <option value="banner">Банери</option>
                            <option value="print">Друк</option>
                        </select>
                        <select id="pipelinePriorityFilter">
                            <option value="">Всі пріоритети</option>
                            <option value="urgent">Терміново</option>
                            <option value="high">Високий</option>
                            <option value="normal">Звичайний</option>
                            <option value="low">Низький</option>
                        </select>
                        <input type="text" id="pipelineSearch" aria-label="Пошук..." placeholder="Пошук...">
                        <button type="button" class="btn-create" id="btnCreateContent">+ Створити</button>
                    </div>
                    <div class="pipeline-kanban" id="pipelineKanban">
                        <div class="artdir-loading">Завантаження...</div>
                    </div>
                </div>

                <!-- Tab: Templates -->
                <div class="artdir-tab-content" id="tab-templates">
                    <div class="template-categories" id="templateCategories">
                        <button type="button" class="template-cat-chip active" data-cat="">Всі</button>
                        <button type="button" class="template-cat-chip" data-cat="poster">Афіші</button>
                        <button type="button" class="template-cat-chip" data-cat="social">Соцмережі</button>
                        <button type="button" class="template-cat-chip" data-cat="certificate">Сертифікати</button>
                        <button type="button" class="template-cat-chip" data-cat="banner">Банери</button>
                        <button type="button" class="template-cat-chip" data-cat="print">Друк</button>
                    </div>
                    <div class="templates-grid" id="templatesGrid">
                        <div class="artdir-loading">Завантаження...</div>
                    </div>
                </div>

                <!-- Tab: Brand Book -->
                <div class="artdir-tab-content" id="tab-brand">
                    <div class="artdir-section" id="brandSection">
                        <div class="artdir-section-title">
                            <span class="section-icon"></span> Brand Guidelines
                            <button type="button" id="btnAddBrand" style="margin-left:auto; padding:4px 12px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-weight:700; font-family:inherit; font-size:12px; cursor:pointer;">+ Додати</button>
                        </div>
                        <div id="brandContent">
                            <div class="artdir-loading">Завантаження...</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Create/Edit Content -->
    <div id="contentModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Контент">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close" id="contentModalClose">&times;</span>
            <h3 id="contentModalTitle">Новий контент</h3>
            <form id="contentForm" autocomplete="off">
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div>
                        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Назва *</label>
                        <input type="text" id="contentTitle" aria-label="Назва контенту" required style="width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:14px; box-sizing:border-box;">
                    </div>
                    <div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;">
                        <div>
                            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Категорія *</label>
                            <select id="contentCategory" required style="width:100%; min-width:0; max-width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px;">
                                <option value="poster">Афіша</option>
                                <option value="social">Соцмережі</option>
                                <option value="certificate">Сертифікат</option>
                                <option value="banner">Банер</option>
                                <option value="print">Друк</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Пріоритет</label>
                            <select id="contentPriority" style="width:100%; min-width:0; max-width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px;">
                                <option value="normal">Звичайний</option>
                                <option value="high">Високий</option>
                                <option value="urgent">Терміново</option>
                                <option value="low">Низький</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Шаблон</label>
                        <select id="contentTemplate" style="width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px;">
                            <option value="">— Без шаблону —</option>
                        </select>
                    </div>
                    <div id="templateFieldsContainer" style="display:none;">
                        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:8px;">Поля шаблону</label>
                        <div id="templateFields" style="display:flex; flex-direction:column; gap:8px;"></div>
                    </div>
                    <div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;">
                        <div>
                            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Дедлайн</label>
                            <input type="date" id="contentDueDate" style="width:100%; min-width:0; max-width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px; box-sizing:border-box;">
                        </div>
                        <div>
                            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Відповідальний</label>
                            <input type="text" id="contentAssignee" aria-label="Ім'я" placeholder="Ім'я" style="width:100%; min-width:0; max-width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px; box-sizing:border-box;">
                        </div>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Нотатки</label>
                        <textarea id="contentNotes" rows="3" style="width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px; resize:vertical; box-sizing:border-box;"></textarea>
                    </div>
                    <button type="submit" style="padding:10px; border:none; border-radius:10px; background:var(--primary); color:#fff; font-weight:800; font-family:inherit; font-size:14px; cursor:pointer;">Зберегти</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Content Detail / Approval -->
    <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Деталі контенту">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close" id="detailModalClose">&times;</span>
            <h3 id="detailModalTitle">Деталі</h3>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- Modal: Add Brand Guideline -->
    <div id="brandModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Brand guideline">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close" id="brandModalClose">&times;</span>
            <h3>Нове правило бренду</h3>
            <form id="brandForm" autocomplete="off">
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div>
                            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Категорія *</label>
                            <select id="brandCategory" required style="width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px;">
                                <option value="color">Колір</option>
                                <option value="font">Шрифт</option>
                                <option value="tone">Тон</option>
                                <option value="rule">Правило</option>
                                <option value="logo">Лого</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Назва *</label>
                            <input type="text" id="brandTitle" required style="width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:14px; box-sizing:border-box;">
                        </div>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Значення *</label>
                        <input type="text" id="brandValue" required aria-label="#10B981, Nunito, текст правила..." placeholder="#10B981, Nunito, текст правила..." style="width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:14px; box-sizing:border-box;">
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Опис</label>
                        <input type="text" id="brandDescription" style="width:100%; padding:8px 12px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px; box-sizing:border-box;">
                    </div>
                    <button type="submit" style="padding:10px; border:none; border-radius:10px; background:var(--primary); color:#fff; font-weight:800; font-family:inherit; font-size:14px; cursor:pointer;">Додати</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Особистий кабінет">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close">&times;</span>
            <h3>Особистий кабінет</h3>
            <div id="profileContent" class="profile-content">
                <div class="profile-loading">Завантаження...</div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <span id="notificationText"></span>
    </div>

    <script src="js/ui.js?v=0.54.5"></script>
    <script src="js/config.js?v=0.54.5"></script>
    <script src="js/notification.js?v=0.54.5"></script>
    <script src="js/api.js?v=0.54.5"></script>
    <script src="js/auth.js?v=0.54.5"></script>
    <script src="js/components/sidebar.js?v=0.54.5"></script>
    <script>if (typeof Sidebar !== "undefined") Sidebar.init("#sidebarLinks");</script>
    <script src="js/art-director-page.js?v=0.54.5"></script><script src="js/alerts.js?v=0.54.5"></script>
</body>
</html>
