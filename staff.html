<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Genix | Графік</title>
    <meta name="description" content="Event Genix — AI First CRM для дитячих розважальних центрів">
    <meta property="og:title" content="Event Genix">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=37.8.0">
    <link rel="stylesheet" href="css/layout.css?v=37.8.0">
    <link rel="stylesheet" href="css/pages.css?v=37.8.0">
    <link rel="stylesheet" href="css/modals.css?v=37.8.0">
    <link rel="stylesheet" href="css/dark-mode.css?v=37.8.0">
    <link rel="stylesheet" href="css/responsive.css?v=37.8.0">
    <link rel="stylesheet" href="css/role-panel.css?v=37.8.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           SCHEDULE CANVAS
           ========================================== */

        .schedule-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .schedule-controls .week-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .schedule-controls .week-nav button {
            width: 40px; height: 40px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            border-radius: var(--radius-sm);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-family: inherit;
        }

        .schedule-controls .week-nav button:hover {
            background: var(--gray-50);
            border-color: var(--primary);
        }

        .schedule-controls .week-label {
            font-weight: 800;
            font-size: 15px;
            color: var(--gray-800);
            min-width: 200px;
            text-align: center;
        }

        .schedule-toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .schedule-toolbar .btn-page-secondary {
            font-size: 12px;
            padding: 6px 14px;
            min-height: 36px;
            white-space: nowrap;
            border-radius: var(--radius-sm);
        }

        .dept-filter {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .dept-chip {
            padding: 6px 12px;
            border: 2px solid transparent;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            background: var(--gray-100);
            color: var(--gray-600);
            transition: all 0.15s;
        }

        .dept-chip.active {
            color: #fff;
        }

        .dept-chip[data-dept="all"] { color: var(--gray-700); }
        .dept-chip[data-dept="all"].active { background: var(--gray-700); color: #fff; }
        .dept-chip[data-dept="animators"] { color: #059669; }
        .dept-chip[data-dept="animators"].active { background: #059669; color: #fff; }
        .dept-chip[data-dept="admin"] { color: #4F46E5; }
        .dept-chip[data-dept="admin"].active { background: #4F46E5; color: #fff; }
        .dept-chip[data-dept="cafe"] { color: #D97706; }
        .dept-chip[data-dept="cafe"].active { background: #D97706; color: #fff; }
        .dept-chip[data-dept="tech"] { color: #DC2626; }
        .dept-chip[data-dept="tech"].active { background: #DC2626; color: #fff; }
        .dept-chip[data-dept="cleaning"] { color: #7C3AED; }
        .dept-chip[data-dept="cleaning"].active { background: #7C3AED; color: #fff; }
        .dept-chip[data-dept="security"] { color: #64748B; }
        .dept-chip[data-dept="security"].active { background: #64748B; color: #fff; }

        /* Summary chips */
        .schedule-summary {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .summary-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--white);
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-100);
            font-size: 13px;
            font-weight: 700;
            box-shadow: var(--shadow-xs);
        }

        .summary-chip .chip-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .summary-chip .chip-count {
            font-size: 16px;
            font-weight: 800;
        }

        /* ==========================================
           SCHEDULE TABLE
           ========================================== */

        .schedule-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            max-width: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100);
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
            background: var(--white);
        }

        .schedule-table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--gray-50);
            padding: 10px 8px;
            font-size: 12px;
            font-weight: 800;
            color: var(--gray-600);
            text-align: center;
            border-bottom: 2px solid var(--gray-200);
            white-space: nowrap;
        }

        .schedule-table thead th:first-child {
            text-align: left;
            padding-left: 16px;
            min-width: 200px;
            position: sticky;
            left: 0;
            z-index: 11;
        }

        .schedule-table thead th.today {
            background: var(--primary);
            color: #fff;
            border-radius: 0;
        }

        .schedule-table thead .th-date {
            display: block;
            font-size: 13px;
            font-weight: 800;
        }

        .schedule-table thead .th-day {
            display: block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* Department group header */
        .dept-row td {
            background: var(--gray-50);
            padding: 6px 16px;
            font-weight: 800;
            font-size: 13px;
            color: var(--gray-700);
            border-top: 2px solid var(--gray-200);
        }

        .dept-row .dept-icon {
            margin-right: 6px;
        }

        /* Employee rows */
        .schedule-table tbody tr:not(.dept-row) {
            transition: background 0.1s;
        }

        .schedule-table tbody tr:not(.dept-row):hover {
            background: rgba(16,185,129,0.03);
        }

        .schedule-table td {
            padding: 0;
            border-bottom: 1px solid var(--gray-100);
            border-right: 1px solid var(--gray-50);
        }

        .schedule-table td:first-child {
            position: sticky;
            left: 0;
            background: var(--white);
            z-index: 5;
            padding: 8px 12px;
            border-right: 1px solid var(--gray-100);
        }

        .schedule-table tbody tr:not(.dept-row):hover td:first-child {
            background: rgba(16,185,129,0.03);
        }

        .emp-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .emp-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
        }

        .emp-info {
            display: flex;
            flex-direction: column;
        }

        .emp-name {
            font-weight: 700;
            font-size: 13px;
            color: var(--gray-800);
            line-height: 1.2;
        }

        .emp-position {
            font-size: 10px;
            color: var(--gray-400);
            font-weight: 600;
        }

        .emp-hours {
            font-size: 10px;
            font-weight: 700;
            color: var(--primary-dark);
            background: rgba(16,185,129,0.08);
            padding: 1px 6px;
            border-radius: 8px;
            display: none;
        }
        .show-hours .emp-hours { display: inline-block; }

        /* Schedule cells */
        .sch-cell {
            width: 100%;
            min-height: 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            padding: 4px 2px;
            text-align: center;
        }

        .sch-cell:hover {
            background: rgba(16,185,129,0.08);
        }

        .sch-cell .sch-time {
            font-size: 11px;
            font-weight: 700;
            color: var(--gray-700);
            line-height: 1.3;
        }

        .sch-cell .sch-label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 1px 6px;
            border-radius: 4px;
            margin-top: 1px;
        }

        /* Status colors */
        .sch-cell.status-working {
            background: rgba(16,185,129,0.06);
        }
        .sch-cell.status-working .sch-label {
            color: #059669;
            background: rgba(16,185,129,0.12);
        }

        .sch-cell.status-dayoff {
            background: var(--gray-50);
        }
        .sch-cell.status-dayoff .sch-label {
            color: var(--gray-400);
            background: var(--gray-100);
        }

        .sch-cell.status-vacation {
            background: rgba(59,130,246,0.06);
        }
        .sch-cell.status-vacation .sch-label {
            color: #2563EB;
            background: rgba(59,130,246,0.12);
        }

        .sch-cell.status-sick {
            background: rgba(239,68,68,0.06);
        }
        .sch-cell.status-sick .sch-label {
            color: #DC2626;
            background: rgba(239,68,68,0.1);
        }

        .sch-cell.status-remote {
            background: rgba(245,158,11,0.08);
        }
        .sch-cell.status-remote .sch-label {
            color: #D97706;
            background: rgba(245,158,11,0.12);
        }
        .sch-cell.status-remote .sch-time {
            color: #B45309;
        }

        .sch-cell.today-col {
            box-shadow: inset 0 0 0 2px rgba(16,185,129,0.15);
        }

        /* Edit modal */
        .sch-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .sch-modal-overlay.visible {
            display: flex;
        }

        .sch-modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: var(--shadow-lg);
        }

        .sch-modal h3 {
            font-size: 16px;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 16px;
        }

        .sch-modal .form-group {
            margin-bottom: 12px;
        }

        .sch-modal label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .sch-modal select,
        .sch-modal input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: var(--font-sm);
            font-family: inherit;
            min-height: 44px;
            box-sizing: border-box;
        }

        .sch-modal select:focus,
        .sch-modal input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }

        .sch-modal .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        /* Dark mode overrides */
        [data-theme="dark"] .schedule-table {
            background: var(--gray-800);
        }
        [data-theme="dark"] .schedule-table thead th {
            background: var(--gray-700);
            color: var(--gray-300);
            border-bottom-color: var(--gray-600);
        }
        [data-theme="dark"] .schedule-table td {
            border-bottom-color: var(--gray-700);
            border-right-color: var(--gray-700);
        }
        [data-theme="dark"] .schedule-table td:first-child {
            background: var(--gray-800);
            border-right-color: var(--gray-700);
        }
        [data-theme="dark"] .schedule-table tbody tr:not(.dept-row):hover td,
        [data-theme="dark"] .schedule-table tbody tr:not(.dept-row):hover td:first-child {
            background: rgba(16,185,129,0.05);
        }
        [data-theme="dark"] .dept-row td {
            background: var(--gray-700);
            color: var(--gray-300);
            border-top-color: var(--gray-600);
        }
        [data-theme="dark"] .emp-name { color: var(--gray-200); }
        [data-theme="dark"] .emp-position { color: var(--gray-500); }
        [data-theme="dark"] .schedule-wrapper {
            border-color: var(--gray-700);
        }
        [data-theme="dark"] .sch-cell .sch-time { color: var(--gray-300); }
        [data-theme="dark"] .sch-cell.status-dayoff {
            background: rgba(100,116,139,0.1);
        }
        [data-theme="dark"] .summary-chip {
            background: var(--gray-800);
            border-color: var(--gray-700);
            color: var(--gray-300);
        }
        [data-theme="dark"] .schedule-controls .week-nav button {
            background: var(--gray-800);
            border-color: var(--gray-700);
            color: var(--gray-300);
        }
        [data-theme="dark"] .schedule-controls .week-label {
            color: var(--gray-200);
        }
        [data-theme="dark"] .dept-chip {
            background: var(--gray-800);
        }
        [data-theme="dark"] .sch-modal {
            background: var(--gray-800);
            border: 1px solid var(--gray-700);
        }
        [data-theme="dark"] .sch-modal h3 { color: var(--gray-200); }
        [data-theme="dark"] .sch-modal select,
        [data-theme="dark"] .sch-modal input {
            background: var(--gray-700);
            border-color: var(--gray-600);
            color: var(--gray-200);
        }

        /* Load table (Excel-like workload view) */
        .load-table td, .load-table th {
            text-align: center;
            padding: 6px 10px;
            font-size: 13px;
        }
        .load-table td:first-child {
            text-align: left;
            font-weight: 700;
            padding-left: 16px;
        }
        .load-table .load-row-status td {
            font-weight: 700;
        }
        .load-table .load-total td {
            font-weight: 800;
            border-top: 2px solid var(--gray-300);
            background: var(--gray-50);
        }
        .load-cell-working { color: #059669; background: rgba(16,185,129,0.08); }
        .load-cell-dayoff { color: #94A3B8; background: rgba(148,163,184,0.08); }
        .load-cell-vacation { color: #2563EB; background: rgba(59,130,246,0.08); }
        .load-cell-sick { color: #DC2626; background: rgba(239,68,68,0.08); }
        .load-cell-remote { color: #D97706; background: rgba(245,158,11,0.08); }
        .load-cell-total { font-weight: 800; }
        [data-theme="dark"] .load-table .load-total td { background: var(--gray-700); border-top-color: var(--gray-600); }

        /* Responsive */
        @media (max-width: 768px) {
            .schedule-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .schedule-controls .week-nav {
                justify-content: center;
            }
            .schedule-toolbar {
                justify-content: center;
            }
            .dept-filter {
                justify-content: center;
            }
            .schedule-summary {
                justify-content: center;
            }
            .schedule-table td:first-child {
                min-width: 140px;
            }
            .emp-position { display: none; }
        }
    </style>
</head>
<body data-page-group="hr">
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
    <!-- Login overlay -->
    <div id="loginOverlay" class="page-login-overlay hidden">
        <a href="/">Увійти в систему</a>
    </div>

    <div id="mainApp">
        <!-- Бокове меню -->
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-brand">
                    <img src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                    <div class="em-logo">
                        <span class="em-logo-title">Event Genix</span>
                        <span class="em-logo-sub">AI First CRM</span>
                    </div>
                </div>
                <div class="sidebar-user-card" id="sidebarUserCard">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName"></div>
                        <div class="sidebar-user-role" id="sidebarUserRole"></div>
                    </div>
                    <div class="sidebar-user-status online" id="sidebarUserStatus">●</div>
                </div>
                <div class="sidebar-day-context" id="sidebarDayContext" style="display:none"></div>
            </div>
            <nav class="sidebar-links" id="sidebarLinks"></nav>
        <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Згорнути/розгорнути меню">
            <span class="collapse-icon">◀</span>
            <span class="collapse-text">Згорнути</span>
        </button>
        </aside>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <header class="header">
            <div class="header-content">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Меню" aria-label="Відкрити/закрити меню">☰</button>
                <div class="user-panel">
                    <span id="currentUser" class="user-name"></span>
                    <button id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="page-container">
            <div class="page-header">
                <h2>Графік роботи</h2>
                <button id="addStaffBtn" class="btn-page-primary" style="display:none">+ Додати співробітника</button>
            </div>

            <!-- Week navigation + department filter -->
            <div class="schedule-controls">
                <div class="week-nav">
                    <button id="prevWeekBtn" title="Попередній тиждень">‹</button>
                    <span id="weekLabel" class="week-label"></span>
                    <button id="nextWeekBtn" title="Наступний тиждень">›</button>
                    <button id="todayWeekBtn" title="Поточний тиждень" style="font-size:13px;width:auto;padding:0 12px;font-weight:700">Сьогодні</button>
                </div>
                <div class="schedule-toolbar">
                    <button id="copyWeekBtn" class="btn-page-secondary" style="display:none" title="Скопіювати цей тиждень на наступний">Копія тижня</button>
                    <button id="fillWeekBtn" class="btn-page-secondary" style="display:none" title="Масове заповнення тижня">Заповнити тиждень</button>
                    <button id="toggleHoursBtn" class="btn-page-secondary" title="Показати/сховати години">Години</button>
                    <button id="toggleLoadViewBtn" class="btn-page-secondary" title="Навантаження по дням">Навантаження</button>
                </div>
                <div id="deptFilter" class="dept-filter"></div>
            </div>

            <!-- Summary -->
            <div id="scheduleSummary" class="schedule-summary"></div>

            <!-- Load view (Excel-like daily workload) -->
            <div id="loadViewWrapper" class="schedule-wrapper" style="display:none">
                <table class="schedule-table load-table">
                    <thead id="loadViewHead"></thead>
                    <tbody id="loadViewBody"></tbody>
                </table>
            </div>

            <!-- Schedule table -->
            <div id="scheduleWrapper" class="schedule-wrapper">
                <table class="schedule-table">
                    <thead id="scheduleHead"></thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Edit schedule modal -->
    <div id="schModalOverlay" class="sch-modal-overlay">
        <div class="sch-modal">
            <h3 id="schModalTitle">Редагувати зміну</h3>
            <div class="form-group">
                <label>Статус</label>
                <select id="schStatus">
                    <option value="working">Робочий день</option>
                    <option value="remote">Віддалено</option>
                    <option value="dayoff">Вихідний</option>
                    <option value="vacation">Відпустка</option>
                    <option value="sick">Лікарняний</option>
                </select>
            </div>
            <div id="schTimeFields">
                <div class="form-group">
                    <label>Початок зміни</label>
                    <input type="time" id="schStart" value="09:00">
                </div>
                <div class="form-group">
                    <label>Кінець зміни</label>
                    <input type="time" id="schEnd" value="18:00">
                </div>
            </div>
            <div class="form-group">
                <label>Примітка</label>
                <input type="text" id="schNote" aria-label="Необов'язково" placeholder="Необов'язково">
            </div>
            <div class="modal-actions">
                <button id="schSaveBtn" class="btn-page-primary" style="flex:1">Зберегти</button>
                <button id="schCancelBtn" class="btn-page-secondary" style="flex:1">Скасувати</button>
            </div>
        </div>
    </div>

    <!-- Fill week modal -->
    <div id="fillWeekOverlay" class="sch-modal-overlay">
        <div class="sch-modal" style="max-width:440px">
            <h3>Заповнити тиждень</h3>
            <div class="form-group">
                <label>Працівник</label>
                <select id="fillStaffSelect" style="width:100%"></select>
            </div>
            <div class="form-group">
                <label>Дні тижня</label>
                <div id="fillDaysRow" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
                    <label style="display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600"><input type="checkbox" value="1" checked> Пн</label>
                    <label style="display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600"><input type="checkbox" value="2" checked> Вт</label>
                    <label style="display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600"><input type="checkbox" value="3" checked> Ср</label>
                    <label style="display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600"><input type="checkbox" value="4" checked> Чт</label>
                    <label style="display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600"><input type="checkbox" value="5" checked> Пт</label>
                    <label style="display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600"><input type="checkbox" value="6"> Сб</label>
                    <label style="display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600"><input type="checkbox" value="0"> Нд</label>
                </div>
            </div>
            <div class="form-group">
                <label>Статус</label>
                <select id="fillStatus">
                    <option value="working">Робочий день</option>
                    <option value="remote">Віддалено</option>
                    <option value="dayoff">Вихідний</option>
                    <option value="vacation">Відпустка</option>
                    <option value="sick">Лікарняний</option>
                </select>
            </div>
            <div id="fillTimeFields">
                <div class="form-group">
                    <label>Початок зміни</label>
                    <input type="time" id="fillStart" value="09:00">
                </div>
                <div class="form-group">
                    <label>Кінець зміни</label>
                    <input type="time" id="fillEnd" value="18:00">
                </div>
            </div>
            <div class="form-group">
                <label>Примітка</label>
                <input type="text" id="fillNote" aria-label="Необов'язково" placeholder="Необов'язково">
            </div>
            <div class="modal-actions">
                <button id="fillSaveBtn" class="btn-page-primary" style="flex:1">Заповнити</button>
                <button id="fillCancelBtn" class="btn-page-secondary" style="flex:1">Скасувати</button>
            </div>
        </div>
    </div>

    <!-- v10.4: Особистий кабінет -->
    <div id="profileModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Особистий кабінет">
        <div class="modal-content modal-medium">
            <span class="modal-close">&times;</span>
            <h3>Особистий кабінет</h3>
            <div id="profileContent" class="profile-content">
                <div class="profile-loading">Завантаження...</div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <span id="notificationText"></span>
    </div>

    <script>
    // Sidebar toggle for mobile
    (function(){
        var t=document.getElementById('sidebarToggle'),s=document.getElementById('sidebarNav'),o=document.getElementById('sidebarOverlay');
        if(t&&s){t.addEventListener('click',function(){s.classList.toggle('open');if(o)o.classList.toggle('hidden')})}
        if(o&&s){o.addEventListener('click',function(){s.classList.remove('open');o.classList.add('hidden')})}
    })();
    </script>
