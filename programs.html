    <style>
        .embed-mode .sidebar-nav,
        .embed-mode .header,
        .embed-mode .sidebar-overlay,
        .embed-mode .skip-link,
        .embed-mode .page-login-overlay { display: none !important; }
        .embed-mode .page-container { margin-left: 0 !important; padding: 16px !important; }

        .product-ia-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 16px;
            padding: 6px;
            border: 1px solid var(--border-color, rgba(148, 163, 184, 0.24));
            border-radius: 16px;
            background: var(--card-bg, rgba(255, 255, 255, 0.78));
        }

        .product-ia-tab {
            min-height: 40px;
            padding: 0 16px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: transparent;
            color: var(--gray-600, #64748b);
            font-weight: 800;
            cursor: pointer;
        }

        .product-ia-tab:hover,
        .product-ia-tab:focus-visible {
            border-color: var(--primary-color, #14b8a6);
            color: var(--text-primary, #0f172a);
            outline: none;
        }

        .product-ia-tab.active {
            background: var(--primary-color, #14b8a6);
            color: #062018;
            border-color: transparent;
        }

        .product-tab-panel.hidden { display: none !important; }
        .program-desc {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 8px;
            line-height: 1.45;
        }

        .product-doc-panel {
            display: grid;
            gap: 10px;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid var(--border-color, rgba(148, 163, 184, 0.24));
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.035);
        }

        .product-doc-empty {
            background: rgba(245, 158, 11, 0.08);
            border-style: dashed;
        }

        .product-doc-main,
        .product-doc-actions,
        .product-doc-checks {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .product-doc-label {
            color: var(--gray-500);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .product-doc-title {
            max-width: 100%;
            min-width: 0;
            overflow: hidden;
            color: var(--text-primary, #0f172a);
            font-size: 13px;
            font-weight: 800;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-doc-status,
        .product-doc-kind,
        .product-catalog-status {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 9px;
            border-radius: 999px;
            border: 1px solid rgba(20, 184, 166, 0.28);
            background: rgba(20, 184, 166, 0.10);
            color: var(--primary-dark, #0f766e);
            font-size: 12px;
            font-weight: 800;
        }

        .product-doc-status.unlinked {
            border-color: rgba(245, 158, 11, 0.30);
            background: rgba(245, 158, 11, 0.12);
            color: #b45309;
        }

        .product-doc-checks label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 30px;
            color: var(--gray-600, #475569);
            font-size: 12px;
            font-weight: 700;
        }

        .btn-doc-open,
        .btn-doc-link {
            min-height: 34px;
            font-size: 12px;
            text-decoration: none;
        }

        .product-catalog-intro {
            margin: 0 0 16px;
            color: var(--gray-500);
            font-size: 14px;
            line-height: 1.5;
        }

        .product-catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .product-catalog-card {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px;
            padding: 16px;
            border: 1px solid var(--border-color, rgba(148, 163, 184, 0.24));
            border-radius: 18px;
            background: var(--card-bg, #fff);
            box-shadow: var(--shadow-sm, 0 8px 24px rgba(15, 23, 42, 0.06));
        }

        .product-catalog-icon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(20, 184, 166, 0.12);
            font-size: 22px;
        }

        .product-catalog-title {
            color: var(--text-primary, #0f172a);
            font-size: 15px;
            font-weight: 900;
        }

        .product-catalog-desc {
            margin-top: 4px;
            color: var(--gray-500);
            font-size: 13px;
            line-height: 1.45;
        }

        .product-catalog-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: var(--gray-500);
            font-size: 12px;
            font-weight: 700;
        }

        .product-catalog-actions {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .kitchen-subtabs {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0 0 14px;
            padding: 5px;
            border: 1px solid var(--border-color, rgba(148, 163, 184, 0.22));
            border-radius: 14px;
            background: rgba(20, 184, 166, 0.06);
        }

        .kitchen-subtab {
            min-height: 36px;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--gray-600, #64748b);
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }

        .kitchen-subtab:hover,
        .kitchen-subtab:focus-visible {
            border-color: rgba(20, 184, 166, 0.36);
            color: var(--text-primary, #0f172a);
            outline: none;
        }

        .kitchen-subtab.active {
            background: rgba(20, 184, 166, 0.18);
            color: var(--primary-dark, #0f766e);
            border-color: rgba(20, 184, 166, 0.28);
        }

        .product-kitchen-fields.hidden,
        .product-menu-fields.hidden,
        .cake-decoration-field.hidden {
            display: none !important;
        }

        .product-kitchen-fields textarea,
        .product-kitchen-fields input,
        .product-kitchen-fields select,
        .cake-decoration-field textarea {
            width: min(420px, 100%);
        }

        .product-kitchen-fields textarea,
        .cake-decoration-field textarea {
            min-height: 74px;
            resize: vertical;
        }

        .menu-section-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 0 0 14px;
        }

        .menu-section-filter.hidden { display: none !important; }

        .menu-section-chip {
            min-height: 32px;
            padding: 0 11px;
            border: 1px solid var(--border-color, rgba(148, 163, 184, 0.24));
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--gray-600, #64748b);
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
        }

        .menu-section-chip.active {
            border-color: rgba(20, 184, 166, 0.38);
            background: rgba(20, 184, 166, 0.16);
            color: var(--primary-dark, #0f766e);
        }

        .kitchen-card-badges,
        .kitchen-detail-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .kitchen-card-badges {
            margin-top: 10px;
        }

        .kitchen-badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 9px;
            border: 1px solid rgba(20, 184, 166, 0.24);
            border-radius: 999px;
            background: rgba(20, 184, 166, 0.10);
            color: var(--primary-dark, #0f766e);
            font-size: 12px;
            font-weight: 900;
        }

        .menu-completeness-badge {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            margin-left: 6px;
            padding: 0 8px;
            border-radius: 999px;
            border: 1px solid rgba(245, 158, 11, 0.32);
            background: rgba(245, 158, 11, 0.12);
            color: #b45309;
            font-size: 11px;
            font-weight: 900;
            vertical-align: middle;
        }

        .menu-completeness-badge.complete {
            border-color: rgba(20, 184, 166, 0.30);
            background: rgba(20, 184, 166, 0.13);
            color: var(--primary-dark, #0f766e);
        }

        .kitchen-detail-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid var(--border-color, rgba(148, 163, 184, 0.24));
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.035);
        }

        .kitchen-detail-item {
            display: grid;
            gap: 4px;
            min-width: 0;
        }

        .kitchen-detail-item strong {
            color: var(--gray-500, #64748b);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .kitchen-detail-item span {
            color: var(--text-primary, #0f172a);
            font-size: 13px;
            line-height: 1.42;
        }

        .product-doc-modal .modal-content {
            max-width: 560px;
        }

        .product-doc-modal .form-field {
            margin-bottom: 12px;
        }

        .product-doc-modal input[type="text"],
        .product-doc-modal input[type="url"],
        .product-doc-modal select {
            width: 100%;
        }

        .product-doc-modal .doc-checkboxes {
            display: grid;
            gap: 8px;
            margin: 12px 0;
        }

        .product-doc-modal .doc-checkboxes label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .product-doc-modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        body.dark-mode .product-ia-tabs,
        [data-theme="dark"] .product-ia-tabs,
        body.dark-mode .product-catalog-card,
        [data-theme="dark"] .product-catalog-card {
            background: rgba(17, 24, 39, 0.92);
            border-color: rgba(255, 255, 255, 0.10);
        }

        body.dark-mode .product-doc-panel,
        body.dark-mode .menu-section-chip,
        body.dark-mode .kitchen-detail-panel,
        [data-theme="dark"] .product-doc-panel {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.10);
        }

        body.dark-mode .product-doc-empty,
        [data-theme="dark"] .product-doc-empty {
            background: rgba(245, 158, 11, 0.08);
        }

        body.dark-mode .product-doc-title,
        body.dark-mode .product-catalog-title,
        body.dark-mode .kitchen-detail-item span,
        [data-theme="dark"] .product-doc-title,
        [data-theme="dark"] .product-catalog-title {
            color: #f8fafc;
        }

        @media (max-width: 720px) {
            .product-ia-tabs,
            .kitchen-subtabs,
            .product-catalog-actions,
            .product-doc-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .product-ia-tab,
            .kitchen-subtab,
            .product-catalog-actions a,
            .product-doc-actions a,
            .product-doc-actions button {
                width: 100%;
                justify-content: center;
            }

            .product-catalog-card {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body data-page-group="art">
    <script>
    // Dark mode flash prevention
    (function(){var s=localStorage.getItem('pzp_dark_mode');if(s==='true'||(s===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.body.classList.add('dark-mode')}})();
    </script>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>

    <div id="loginOverlay" class="page-login-overlay hidden">
        <a href="/">Увійти в систему</a>
    </div>

    <div id="mainApp" class="main-app hidden">
        <!-- Бокове меню -->
        <aside class="sidebar-nav" id="sidebarNav">

                    <img loading="lazy" src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">

        </aside>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <header class="header">
            <div class="header-content">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Меню" aria-label="Відкрити/закрити меню">☰</button>
                <div class="user-panel">
                    <span id="currentUser" class="user-name"></span>
                    <button type="button" id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="page-container">
            <div class="page-header">
                <h2 id="productsPageTitle">Products · Розважальні програми</h2>
                <button type="button" id="addProductBtn" class="btn-page-primary">+ Додати програму</button>
            </div>

            <div id="productIaTabs" class="product-ia-tabs" aria-label="Products tabs"></div>

            <section id="programsPanel" class="product-tab-panel">
                <!-- Category tabs -->
                <div id="categoryTabs" class="category-tabs"></div>

                <!-- Add/edit form (hidden by default) -->
                <div id="productForm" class="inline-form" style="display:none;">
                    <div class="form-field">
                        <label>Код</label>
                        <input type="text" id="pf-code" aria-label="КВ1" placeholder="КВ1" maxlength="20" style="width:80px">
                    </div>
                    <div class="form-field">
                        <label>Назва</label>
                        <input type="text" id="pf-name" aria-label="Квест «Загадки Фараона»" placeholder="Квест «Загадки Фараона»" style="min-width:200px">
                    </div>
                    <div class="form-field">
                        <label>Мітка</label>
                        <input type="text" id="pf-label" aria-label="КВ1(60)" placeholder="КВ1(60)" style="width:120px">
                    </div>
                    <div class="form-field">
                        <label>Іконка</label>
                        <input type="text" id="pf-icon" aria-label="🏛" placeholder="🏛" style="width:60px">
                    </div>
                    <div class="form-field">
                        <label>Категорія</label>
                        <select id="pf-category">
                            <option value="quest">Квести</option>
                            <option value="animation">Анімація</option>
                            <option value="show">Шоу</option>
                            <option value="photo">Фото</option>
                            <option value="masterclass">Майстер-класи</option>
                            <option value="pinata">Піньяти</option>
                            <option value="custom">Кастом</option>
                            <option value="cake">Торти</option>
                            <option value="menu">Меню</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Хвилин</label>
                        <input type="number" id="pf-duration" value="60" min="0" step="15" style="width:80px">
                    </div>
                    <div class="form-field">
                        <label>Ціна (₴)</label>
                        <input type="number" id="pf-price" value="0" min="0" style="width:100px">
                    </div>
                    <div class="form-field">
                        <label>Ведучих</label>
                        <input type="number" id="pf-hosts" value="1" min="0" style="width:70px">
                    </div>
                    <div class="form-field">
                        <label>Вік</label>
                        <input type="text" id="pf-age" aria-label="6-12" placeholder="6-12" style="width:80px">
                    </div>
                    <div class="form-field">
                        <label>Дітей</label>
                        <input type="text" id="pf-kids" aria-label="до 15" placeholder="до 15" style="width:80px">
                    </div>
                    <div class="form-field">
                        <label>Опис</label>
                        <input type="text" id="pf-description" aria-label="Короткий опис" placeholder="Короткий опис" style="min-width:200px">
                    </div>
                    <div class="form-field product-kitchen-fields hidden">
                        <label for="pf-short-description">Короткий опис</label>
                        <textarea id="pf-short-description" placeholder="Коротко для картки продукту"></textarea>
                    </div>
                    <div class="form-field product-kitchen-fields hidden">
                        <label for="pf-promo-description">Promo опис</label>
                        <textarea id="pf-promo-description" placeholder="Продажний опис для клієнта"></textarea>
                    </div>
                    <div class="form-field product-kitchen-fields product-menu-fields hidden">
                        <label for="pf-menu-section">Розділ меню</label>
                        <input type="text" id="pf-menu-section" list="menu-section-options" placeholder="Салати / Піца / Гарячі напої">
                    </div>
                    <div class="form-field product-kitchen-fields hidden">
                        <label for="pf-weight-value">Вага / обʼєм / вихід</label>
                        <input type="text" id="pf-weight-value" placeholder="150 г / 250 мл / 1 шт">
                    </div>
                    <div class="form-field product-kitchen-fields hidden">
                        <label for="pf-serving-unit">Одиниця</label>
                        <input type="text" id="pf-serving-unit" placeholder="порція / шт / 100 г / склянка">
                    </div>
                    <div class="form-field product-kitchen-fields hidden">
                        <label for="pf-price-variant-note">Варіанти / ціна</label>
                        <textarea id="pf-price-variant-note" placeholder="Наприклад: 250/500 мл — 80/140 грн або 30 см / 40 см"></textarea>
                    </div>
                    <div class="form-field product-kitchen-fields hidden">
                        <label for="pf-availability-status">Статус меню</label>
                        <select id="pf-availability-status">
                            <option value="active">Активна</option>
                            <option value="draft">Чернетка</option>
                            <option value="seasonal">Сезонна</option>
                            <option value="sold_out">Стоп</option>
                            <option value="hidden">Прихована</option>
                        </select>
                    </div>
                    <div class="form-field product-kitchen-fields hidden">
                        <label for="pf-ingredients">Інгредієнти</label>

                    </div>
                    <div class="form-field product-kitchen-fields hidden">
                        <label for="pf-tech-card">Техкарта</label>
                        <textarea id="pf-tech-card" placeholder="Вага, вихід, зберігання, production notes"></textarea>
                    </div>
                    <div class="form-field cake-decoration-field hidden">
                        <label for="pf-cake-decoration">Оформлення торта</label>
                        <textarea id="pf-cake-decoration" placeholder="Декор, topper, кольори, свічки, тематичні елементи"></textarea>
                    </div>
                    <div class="form-field" style="flex-direction:row; align-items:center; gap:8px; margin-top:20px;">
                        <label style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="pf-perchild"> За дитину</label>
                        <label style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="pf-filler"> Наповнювач</label>
                        <label style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="pf-active" checked> Активна</label>
                    </div>
                    <input type="hidden" id="pf-id" value="">
                    <input type="hidden" id="pf-domain" value="program">
                    <input type="hidden" id="pf-kitchen-type" value="">
