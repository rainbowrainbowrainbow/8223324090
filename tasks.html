        /* v7.9: Task board styles */
        .board-tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }

        .task-assignment-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex: 0 0 auto; }

        body.dark-mode .task-assignment-incoming { background: rgba(168,85,247,0.16); color: #c4b5fd; border-color: rgba(196,181,253,0.24); }

        body.dark-mode .task-my-scope-summary span { background: rgba(15,23,42,0.62); border-color: rgba(148,163,184,0.12); }

        body.dark-mode .task-no-assignee { color: var(--gray-500); }
        body.dark-mode .task-card.status-done {

        body.dark-mode .done-today-board-note { color: #cbd5e1; background: rgba(16,185,129,0.12); }
        .task-card-actions { display: flex; gap: 4px; margin-top: 6px; }
        .task-card-actions button {
            padding: 4px 8px; border: none; border-radius: 6px; font-size: 11px;

        .task-card-actions button:hover { background: var(--gray-200); }

        .task-card-actions .btn-delete { background: #FFEBEE; color: #C62828; }

        /* Group headers (mobile stacked view) */
        .group-header {
            font-weight: 800; font-size: 15px; margin: 16px 0 8px;
            padding-bottom: 6px; border-bottom: 2px solid var(--gray-200);

        }
        .group-header:first-child { margin-top: 0; }

        /* Legacy compact add rows used by templates */
        .quick-add:not(.task-composer) {

        }

            padding: 8px 16px; border: none; border-radius: 8px;

        /* Quick add task composer */
        .quick-add.task-composer {
            display: grid;
            gap: 10px;
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(241,245,249,0.78));

            box-shadow: 0 16px 34px rgba(15, 23, 42, 0.08);

        }

        }
        .task-composer-title-wrap {

            color: #0f766e;

            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 900;
