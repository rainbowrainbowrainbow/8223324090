    <style>
        .demo-page { padding: 16px; max-width: 1400px; margin: 0 auto; }
        .demo-page h1 { font-size: 22px; font-weight: 900; margin-bottom: 20px; }

        /* Tabs */
        .demo-tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
        .demo-tab {
            padding: 8px 16px; border: none; border-radius: 12px;
            font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
            background: rgba(255,255,255,0.35); color: var(--gray-600);
            transition: all 0.2s; backdrop-filter: blur(8px);
        }
        .demo-tab:hover { background: rgba(255,255,255,0.6); }
        .demo-tab.active { background: var(--primary); color: #fff; }
        .demo-tab-content { display: none; }
        .demo-tab-content.active { display: block; }

        /* Section */
        .demo-section {
            background: rgba(255,255,255,0.35); backdrop-filter: blur(12px);
            border-radius: 16px; padding: 16px 18px; margin-bottom: 20px;
        }
        .demo-section-title {
            font-size: 15px; font-weight: 800; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        /* Demo mode toggle */
        .demo-toggle-bar {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
            padding: 12px 18px; border-radius: 14px;
            background: rgba(255,255,255,0.4);
        }
        .demo-toggle-label { font-weight: 700; font-size: 14px; flex: 1; }
        .demo-toggle-status { font-size: 13px; font-weight: 600; }
        .demo-toggle-status.on { color: #2E7D32; }
        .demo-toggle-status.off { color: var(--gray-400); }
        .toggle-switch {
            position: relative; width: 48px; height: 26px; cursor: pointer;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--gray-300); border-radius: 13px; transition: 0.3s;
        }
        .toggle-slider::before {
            content: ''; position: absolute; height: 20px; width: 20px;
            left: 3px; bottom: 3px; background: white; border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--primary); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(22px); }

        /* Overview stats */
        .demo-stats {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px; margin-bottom: 16px;
        }
        .demo-stat {
            background: rgba(255,255,255,0.4); border-radius: 12px;
            padding: 12px; text-align: center;
        }
        .demo-stat-value { font-size: 22px; font-weight: 900; }
        .demo-stat-label { font-size: 11px; color: var(--gray-500); font-weight: 600; margin-top: 2px; }

        /* Scenarios grid */
        .scenarios-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .scenario-card {
            background: rgba(255,255,255,0.5); border-radius: 14px;
            padding: 16px 18px; cursor: pointer; transition: all 0.2s;
            border: 2px solid transparent;
        }
        .scenario-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .scenario-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .scenario-card-icon { font-size: 28px; }
        .scenario-card-title { font-weight: 800; font-size: 15px; }
        .scenario-card-desc { font-size: 12px; color: var(--gray-500); line-height: 1.5; margin-bottom: 8px; }
        .scenario-card-meta { display: flex; gap: 10px; font-size: 11px; color: var(--gray-400); }
        .scenario-card-badge {
            display: inline-block; padding: 2px 8px; border-radius: 6px;
            font-size: 10px; font-weight: 700; background: var(--gray-100); color: var(--gray-500);
        }
        .scenario-card-runs { font-size: 11px; color: var(--gray-400); margin-top: 6px; }

        /* Packages grid */
        .packages-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .package-card {
            background: rgba(255,255,255,0.5); border-radius: 16px;
            padding: 20px; border: 2px solid transparent; position: relative;
            transition: all 0.2s;
        }
        .package-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .package-card.recommended { border-color: var(--primary); }
        .package-badge-rec {
            position: absolute; top: -8px; right: 16px;
            padding: 2px 10px; border-radius: 6px; font-size: 10px;
            font-weight: 800; background: var(--primary); color: #fff;
        }
        .package-name { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
        .package-price { font-size: 28px; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
        .package-price-period { font-size: 12px; color: var(--gray-400); font-weight: 600; }
        .package-desc { font-size: 13px; color: var(--gray-500); margin-bottom: 12px; }
        .package-features { display: flex; flex-direction: column; gap: 6px; }
        .package-feature {
            display: flex; align-items: center; gap: 8px; font-size: 13px;
        }
        .package-feature-check { color: #2E7D32; font-weight: 800; }
        .package-feature-cross { color: var(--gray-300); }
        .package-limits {
            margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-200);
            display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--gray-500);
        }

        /* Feature flags */
        .flags-list { display: flex; flex-direction: column; gap: 6px; }
        .flag-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; border-radius: 12px;
            background: rgba(255,255,255,0.4); font-size: 13px;
        }
        .flag-name { font-weight: 700; flex: 1; }
        .flag-desc { font-size: 12px; color: var(--gray-500); flex: 2; }
        .flag-pkg {
            font-size: 10px; padding: 2px 8px; border-radius: 6px;
            font-weight: 700; background: var(--gray-100); color: var(--gray-500);
        }
        .flag-status { font-size: 12px; font-weight: 700; }
        .flag-status.on { color: #2E7D32; }
        .flag-status.off { color: var(--gray-400); }

        /* Scenario player modal */
        .player-steps { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .player-step {
            display: flex; gap: 10px; padding: 10px 14px; border-radius: 12px;
            background: rgba(255,255,255,0.3); font-size: 13px; transition: all 0.2s;
        }
        .player-step.active { background: rgba(16,185,129,0.1); border: 1.5px solid var(--primary); }
        .player-step.done { opacity: 0.5; }
        .player-step-num {
            width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; background: var(--gray-100); color: var(--gray-500);
        }
        .player-step.active .player-step-num { background: var(--primary); color: #fff; }
        .player-step.done .player-step-num { background: #E8F5E9; color: #2E7D32; }
        .player-step-content { flex: 1; }
        .player-step-title { font-weight: 700; margin-bottom: 2px; }
        .player-step-desc { font-size: 12px; color: var(--gray-500); }
        .player-controls {
            display: flex; gap: 8px; margin-top: 14px; justify-content: center;
        }
        .player-controls button {
            padding: 8px 20px; border: none; border-radius: 10px;
            font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .btn-player-next { background: var(--primary); color: #fff; }
        .btn-player-next:hover { background: var(--primary-dark); }
        .btn-player-back { background: var(--gray-100); color: var(--gray-600); }
        .btn-player-open { background: #E3F2FD; color: #1565C0; }

        /* Empty/Loading */
        .demo-empty { text-align: center; padding: 30px; color: var(--gray-400); font-size: 13px; }
        .demo-empty span { font-size: 32px; display: block; margin-bottom: 8px; }
        .demo-loading { text-align: center; padding: 40px; color: var(--gray-400); font-size: 14px; }

        /* Responsive */
        @media (max-width: 768px) {
            .demo-page { padding: 12px; }
            .demo-stats { grid-template-columns: repeat(2, 1fr); }
            .scenarios-grid { grid-template-columns: 1fr; }
            .packages-grid { grid-template-columns: 1fr; }
            .flag-row { flex-direction: column; align-items: flex-start; gap: 6px; }
        }

        /* Dark mode */
        .dark-mode .demo-section { background: rgba(30,30,30,0.5); }
        .dark-mode .demo-toggle-bar { background: rgba(40,40,40,0.5); }
        .dark-mode .demo-stat { background: rgba(40,40,40,0.5); }
        .dark-mode .scenario-card { background: rgba(40,40,40,0.6); }
        .dark-mode .package-card { background: rgba(40,40,40,0.6); }
        .dark-mode .flag-row { background: rgba(40,40,40,0.4); }
        .dark-mode .player-step { background: rgba(40,40,40,0.3); }
    </style>
</head>
