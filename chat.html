<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Genix | Командний чат</title>
    <meta name="description" content="Event Genix — AI First CRM для дитячих розважальних центрів">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=21.1.0">
    <link rel="stylesheet" href="css/layout.css?v=21.1.0">
    <link rel="stylesheet" href="css/pages.css?v=21.1.0">
    <link rel="stylesheet" href="css/modals.css?v=21.1.0">
    <link rel="stylesheet" href="css/chat.css?v=21.1.0">
    <link rel="stylesheet" href="css/dark-mode.css?v=21.1.0">
    <link rel="stylesheet" href="css/responsive.css?v=21.1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .main-content { padding: 0 !important; max-width: none !important; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen hidden"></div>

    <div id="mainApp" class="main-app hidden">
        <!-- Sidebar nav -->
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-logo">
                <img src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                <div class="em-logo">
                    <span class="em-logo-title">Event Genix</span>
                    <span class="em-logo-sub">AI First CRM</span>
                </div>
            </div>
            <nav class="sidebar-links">
                <a href="/" class="nav-link"><span class="nav-icon">T</span> <span class="nav-text">Таймлайн</span></a>
                <a href="/tasks" class="nav-link"><span class="nav-icon">З</span> <span class="nav-text">Задачі</span></a>
                <a href="/programs" class="nav-link"><span class="nav-icon">П</span> <span class="nav-text">Програми</span></a>
                <a href="/staff" class="nav-link"><span class="nav-icon">Г</span> <span class="nav-text">Графік</span></a>
                <a href="/hr" class="nav-link"><span class="nav-icon">H</span> <span class="nav-text">HR</span></a>
                <a href="/designs" class="nav-link"><span class="nav-icon">Д</span> <span class="nav-text">Дизайни</span></a>
                <a href="/customers" class="nav-link"><span class="nav-icon">К</span> <span class="nav-text">Клієнти</span></a>
                <a href="/finance" class="nav-link"><span class="nav-icon">Ф</span> <span class="nav-text">Фінанси</span></a>
                <a href="/warehouse" class="nav-link"><span class="nav-icon">С</span> <span class="nav-text">Склад</span></a>
                <a href="/center" class="nav-link"><span class="nav-icon">Ц</span> <span class="nav-text">Центр</span></a>
                <a href="/chat" class="nav-link active"><span class="nav-icon">Чт</span> <span class="nav-text">Чат</span></a>
                <a href="/kleshnya" class="nav-link nav-link-kleshnya"><span class="nav-icon nav-icon--kleshnya">Кл</span> <span class="nav-text">Клешня</span></a>
            </nav>
        </aside>

        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                </div>
                <nav class="header-nav">
                    <a href="/" class="nav-link"><span class="nav-icon">T</span> <span class="nav-text">Таймлайн</span></a>
                    <a href="/tasks" class="nav-link"><span class="nav-icon">З</span> <span class="nav-text">Задачі</span></a>
                    <a href="/chat" class="nav-link active"><span class="nav-icon">Чт</span> <span class="nav-text">Чат</span></a>
                    <a href="/kleshnya" class="nav-link nav-link-kleshnya"><span class="nav-icon nav-icon--kleshnya">Кл</span> <span class="nav-text">Клешня</span></a>
                </nav>
                <div class="user-panel">
                    <span id="currentUser" class="user-name" role="button" tabindex="0"></span>
                    <button id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main class="main-content" style="margin-left: 220px;">
            <div class="chat-layout">
                <!-- Chat channels sidebar -->
                <div class="chat-sidebar" id="chatSidebar">
                    <div class="chat-sidebar-header">
                        <div class="chat-sidebar-top">
                            <h2 class="chat-sidebar-title">Канали</h2>
                        </div>
                        <div class="chat-search">
                            <svg class="chat-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" class="chat-search-input" id="chatSearchInput" placeholder="Пошук каналів...">
                        </div>
                    </div>
                    <div class="chat-channels-list" id="chatChannelsList"></div>
                </div>
                <div class="chat-sidebar-overlay" id="chatSidebarOverlay"></div>

                <!-- Chat main area -->
                <div class="chat-main">
                    <div class="chat-header">
                        <button class="chat-header-toggle" id="chatToggleSidebar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                        </button>
                        <div class="chat-header-info">
                            <div class="chat-header-name" id="chatHeaderName">Оберіть канал</div>
                            <div class="chat-header-desc" id="chatHeaderDesc"></div>
                        </div>
                        <div class="chat-header-actions">
                            <button class="chat-header-action-btn" id="chatSearchMsgBtn" title="Пошук повідомлень">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            </button>
                            <button class="chat-header-action-btn" id="chatInfoBtn" title="Учасники каналу">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Search bar (hidden by default) -->
                    <div class="chat-search-bar" id="chatSearchBar" style="display:none">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" class="chat-search-bar-input" id="chatSearchMsgInput" placeholder="Пошук повідомлень у каналі...">
                        <span class="chat-search-bar-count" id="chatSearchMsgCount"></span>
                        <button class="chat-search-bar-close" id="chatSearchMsgClose">&times;</button>
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-empty">
                            <div class="chat-empty-icon">
                                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            </div>
                            <div class="chat-empty-title">Командний чат</div>
                            <div class="chat-empty-hint">Оберіть канал зліва, щоб почати спілкування з командою</div>
                        </div>
                    </div>

                    <button class="chat-scroll-bottom" id="chatScrollBottom" title="Донизу">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>

                    <div class="chat-typing" id="chatTyping"></div>

                    <div class="chat-input-area" style="position: relative;">
                        <div class="chat-reply-preview" id="chatReplyPreview">
                            <div class="chat-reply-preview-bar"></div>
                            <div class="chat-reply-preview-text">
                                <div class="chat-reply-preview-user" id="chatReplyUser"></div>
                                <div class="chat-reply-preview-content" id="chatReplyContent"></div>
                            </div>
                            <button class="chat-reply-close" id="chatReplyClose">&times;</button>
                        </div>
                        <div class="chat-mention-popup" id="chatMentionPopup"></div>
                        <div class="chat-input-row">
                            <textarea class="chat-input" id="chatInput" placeholder="Написати повідомлення..." rows="1" disabled></textarea>
                            <button class="chat-send-btn" id="chatSendBtn" disabled title="Надіслати">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Channel info panel (slide-in from right) -->
                <div class="chat-info-panel" id="chatInfoPanel">
                    <div class="chat-info-panel-header">
                        <h3 class="chat-info-panel-title">Учасники</h3>
                        <button class="chat-info-panel-close" id="chatInfoPanelClose">&times;</button>
                    </div>
                    <div class="chat-info-panel-body" id="chatInfoPanelBody"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js?v=21.1.0"></script>
    <script src="js/api.js?v=21.1.0"></script>
    <script src="js/auth.js?v=21.1.0"></script>
    <script src="js/ws.js?v=21.1.0"></script>
    <script src="js/chat-page.js?v=21.1.0"></script>
</body>
</html>
