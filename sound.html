<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Genix | Звук</title>
    <meta name="description" content="Event Genix — Звуковий модуль">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=38.1.1">
    <link rel="stylesheet" href="css/auth.css?v=38.1.1">
    <link rel="stylesheet" href="css/layout.css?v=38.1.1">
    <link rel="stylesheet" href="css/pages.css?v=38.1.1">
    <link rel="stylesheet" href="css/modals.css?v=38.1.1">
    <link rel="stylesheet" href="css/sound.css?v=38.1.1">
    <link rel="stylesheet" href="css/dark-mode.css?v=38.1.1">
    <link rel="stylesheet" href="css/responsive.css?v=38.1.1">
    <link rel="stylesheet" href="css/role-panel.css?v=38.1.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body data-page-group="creative">
    <script>(function(){var s=localStorage.getItem('pzp_dark_mode');if(s==='true'||(s===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.body.classList.add('dark-mode')}})();</script>

    <div id="loginScreen" class="login-screen hidden">
        <div class="login-container">
            <h1>Event Genix</h1>
            <form id="loginForm" class="login-form">
                <input type="text" id="username" placeholder="Логін" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <button type="submit" class="btn-login">Увійти</button>
                <p id="loginError" class="error-message"></p>
            </form>
        </div>
    </div>

    <div id="mainApp" class="main-app hidden">
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-brand">
                    <img src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                    <div class="em-logo">
                        <span class="em-logo-title">Event Genix</span>
                        <span class="em-logo-sub">AI First CRM</span>
                    </div>
                </div>
                <div class="sidebar-user-card" id="sidebarUserCard">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName"></div>
                        <div class="sidebar-user-role" id="sidebarUserRole"></div>
                    </div>
                    <div class="sidebar-user-status online" id="sidebarUserStatus">●</div>
                </div>
            </div>
            <nav class="sidebar-links" id="sidebarLinks"></nav>
            <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Згорнути/розгорнути меню">
                <span class="collapse-icon">◀</span>
                <span class="collapse-text">Згорнути</span>
            </button>
        </aside>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <header class="header">
            <button id="sidebarToggle" class="sidebar-toggle">☰</button>
            <div class="header-right">
                <span id="currentUser" class="user-name" role="button" tabindex="0"></span>
                <button id="logoutBtn" class="btn-logout" title="Вийти">Вийти</button>
            </div>
        </header>

        <main class="main-content">
            <div class="sound-page">
                <div class="sound-header">
                    <div>
                        <h1>🔊 Звук</h1>
                        <p class="subtitle">Оголошення, бібліотека звуків, плейлисти</p>
                    </div>
                    <div class="sound-header-actions">
                        <button class="btn-create" onclick="SoundPage.newAnn()">+ Оголошення</button>
                    </div>
                </div>

                <div class="sound-tabs">
                    <button class="sound-tab active" data-tab="announcements">📢 Оголошення</button>
                    <button class="sound-tab" data-tab="library">🎵 Бібліотека</button>
                    <button class="sound-tab" data-tab="playlists">📋 Плейлисти</button>
                    <button class="sound-tab" data-tab="log">📊 Лог</button>
                </div>

                <!-- Tab: Announcements -->
                <div id="tab-announcements" class="sound-tab-content active">
                    <div class="sound-status-filter">
                        <button class="ann-status-btn sound-filter-btn active" data-status="">Всі</button>
                        <button class="ann-status-btn sound-filter-btn" data-status="draft">Чернетки</button>
                        <button class="ann-status-btn sound-filter-btn" data-status="active">Активні</button>
                        <button class="ann-status-btn sound-filter-btn" data-status="scheduled">Заплановані</button>
                    </div>
                    <div id="announcementsGrid" class="sound-grid">
                        <div class="sound-empty"><div class="sound-empty-icon">📢</div><p>Завантаження...</p></div>
                    </div>
                </div>

                <!-- Tab: Library -->
                <div id="tab-library" class="sound-tab-content">
                    <div class="sound-filter">
                        <button class="lib-filter-btn sound-filter-btn active" data-cat="">Всі</button>
                        <button class="lib-filter-btn sound-filter-btn" data-cat="quest">🎯 Квести</button>
                        <button class="lib-filter-btn sound-filter-btn" data-cat="atmosphere">🌙 Атмосфера</button>
                        <button class="lib-filter-btn sound-filter-btn" data-cat="effects">💥 Ефекти</button>
                        <button class="lib-filter-btn sound-filter-btn" data-cat="music">🎵 Музика</button>
                        <button class="lib-filter-btn sound-filter-btn" data-cat="announcement">📢 Оголошення</button>
                    </div>
                    <div id="libraryGrid" class="sound-grid">
                        <div class="sound-empty"><div class="sound-empty-icon">🎵</div><p>Бібліотека порожня</p></div>
                    </div>

                    <h3 style="margin-top:32px;font-size:16px;font-weight:700;">📤 Завантажити звук</h3>
                    <form class="upload-form" id="uploadForm" style="margin-top:12px;">
                        <div class="form-group">
                            <label for="soundName">Назва</label>
                            <input type="text" id="soundName" placeholder="Назва звуку">
                        </div>
                        <div class="form-group">
                            <label for="soundCategory">Категорія</label>
                            <select id="soundCategory">
                                <option value="general">Загальне</option>
                                <option value="quest">Квест</option>
                                <option value="atmosphere">Атмосфера</option>
                                <option value="effects">Ефекти</option>
                                <option value="music">Музика</option>
                                <option value="announcement">Оголошення</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="soundFile">Файл (.mp3, .wav, .ogg, .m4a)</label>
                            <input type="file" id="soundFile" accept=".mp3,.wav,.ogg,.m4a,.aac" required>
                        </div>
                        <button type="submit" class="btn-create">📤 Завантажити</button>
                    </form>
                </div>

                <!-- Tab: Playlists -->
                <div id="tab-playlists" class="sound-tab-content">
                    <div id="playlistsContainer">
                        <div class="sound-empty"><div class="sound-empty-icon">📋</div><p>Немає плейлистів</p></div>
                    </div>
                </div>

                <!-- Tab: Log -->
                <div id="tab-log" class="sound-tab-content">
                    <div id="logContainer">
                        <div class="sound-empty"><div class="sound-empty-icon">📊</div><p>Лог порожній</p></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js?v=38.1.1"></script>
    <script src="js/api.js?v=38.1.1"></script>
    <script src="js/auth.js?v=38.1.1"></script>
    <script src="js/components/sidebar.js?v=38.1.1"></script>
    <script>if (typeof Sidebar !== "undefined") Sidebar.init("#sidebarLinks");</script>
    <script>
    (async function() {
        const token = localStorage.getItem('pzp_token');
        if (token) {
            const user = await apiVerifyToken();
            if (user) {
                AppState.currentUser = user;
                document.getElementById('loginScreen')?.classList.add('hidden');
                document.getElementById('mainApp')?.classList.remove('hidden');
                var ue = document.getElementById('currentUser'); if (ue) ue.textContent = user.name;
                if (typeof Sidebar !== 'undefined' && Sidebar.initUserCard) Sidebar.initUserCard();
                return;
            }
        }
        window.location.href = '/';
    })();
    </script>
    <script src="js/sound-page.js?v=38.1.1"></script>
    <script src="js/role-panel.js?v=38.1.1"></script>
</body>
</html>
