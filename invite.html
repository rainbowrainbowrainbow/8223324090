    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
min-height: 100vh;
background: #064E3B;
background-image:
radial-gradient(ellipse at 30% 0%, rgba(16,185,129,0.4) 0%, transparent 60%),
radial-gradient(ellipse at 70% 100%, rgba(59,130,246,0.15) 0%, transparent 60%),
radial-gradient(circle at 10% 80%, rgba(139,92,246,0.1) 0%, transparent 40%);
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
-webkit-font-smoothing: antialiased;
}
.skip-link {
position: fixed;
top: 12px;
left: 50%;
width: 1px;
height: 1px;
padding: 0;
overflow: hidden;
clip: rect(0 0 0 0);
clip-path: inset(50%);
white-space: nowrap;
border: 0;
transform: translateX(-50%);
z-index: 1000;
}
.skip-link:focus,
.skip-link:focus-visible {
width: auto;
height: auto;
min-height: 44px;
padding: 12px 18px;
overflow: visible;
clip: auto;
clip-path: none;
background: #FFFFFF;
color: #065F46;
border: 2px solid #10B981;
border-radius: 12px;
box-shadow: 0 12px 30px rgba(0,0,0,0.22);
font-weight: 800;
text-decoration: none;
outline: 3px solid rgba(16,185,129,0.34);
outline-offset: 3px;
}
.invite-card {
background: #FFFFFF;
border-radius: 20px;
max-width: 480px;
width: 100%;
overflow: hidden;
box-shadow:
0 30px 80px rgba(0, 0, 0, 0.25),
0 12px 30px rgba(0, 0, 0, 0.12);
}
.invite-header {
position: relative;
text-align: center;
color: white;
}
.invite-hero-wrap {
position: relative;
width: 100%;
aspect-ratio: 16 / 9;
min-height: 180px;
overflow: hidden;
background: #0F172A;
}
.invite-hero {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.invite-hero-overlay {
position: absolute;
inset: 0;
background: linear-gradient(
180deg,
rgba(6,78,59,0.3) 0%,
rgba(6,78,59,0.1) 50%,
rgba(6,78,59,0.6) 100%
);
}
.invite-header-content {
padding: 20px 30px 28px;
background: linear-gradient(135deg, #065F46 0%, #047857 60%, #059669 100%);
position: relative;
}
.invite-header-content::before {
content: '';
position: absolute;
top: -40px;
right: -20px;
width: 120px;
height: 120px;
background: rgba(255,255,255,0.05);
border-radius: 50%;
pointer-events: none;
}
.logo-img {
width: 88px;
height: 88px;
border-radius: 50%;
margin-top: -44px;
border: 4px solid #FFFFFF;
box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
position: relative;
z-index: 1;
display: inline-block;
object-fit: contain;
object-position: center;
background: #FFFFFF;
}
.invite-brand {
font-size: 12px;
font-weight: 800;
letter-spacing: 0.12em;
text-transform: uppercase;
opacity: 0.78;
margin-top: 10px;
}
.invite-header h1 {
font-size: 26px;
font-weight: 900;
margin: 4px 0 4px;
letter-spacing: -0.3px;
overflow-wrap: anywhere;
}
.invite-header .subtitle {
font-size: 14px;
opacity: 0.9;
font-weight: 600;
}
.event-details {
background: rgba(255,255,255,0.12);
backdrop-filter: blur(8px);
border: 1px solid rgba(255,255,255,0.15);
border-radius: 12px;
padding: 14px 18px;
margin-top: 14px;
text-align: left;
display: grid;
gap: 8px;
}
.event-detail-row {
font-size: 14px;
padding: 10px 12px;
display: grid;
grid-template-columns: 28px minmax(0, 1fr);
align-items: center;
gap: 10px;
border: 1px solid rgba(255,255,255,0.14);
border-radius: 16px;
background: rgba(255,255,255,0.08);
}
.event-detail-icon {
font-size: 18px;
line-height: 1;
text-align: center;
}
.event-detail-copy {
min-width: 0;
}
.event-detail-label {
font-size: 10px;
font-weight: 900;
letter-spacing: 0.08em;
line-height: 1.2;
text-transform: uppercase;
opacity: 0.7;
}
.event-detail-value {
display: block;
margin-top: 2px;
font-size: 15px;
font-weight: 900;
line-height: 1.2;
overflow-wrap: anywhere;
}
.invite-body {
padding: 28px 30px;
}
.invite-section {
margin-bottom: 24px;
}
.invite-section:last-child {
margin-bottom: 0;
}
.invite-section h2 {
font-size: 16px;
font-weight: 800;
color: #1E293B;
margin-bottom: 12px;
display: flex;
align-items: center;
gap: 8px;
}
.invite-section p {
font-size: 14px;
color: #64748B;
line-height: 1.7;
}
.invite-info-row {
display: flex;
align-items: center;
gap: 14px;
padding: 14px 16px;
background: #F8FAFC;
border-radius: 12px;
margin-bottom: 8px;
transition: all 0.2s ease;
border: 1px solid transparent;
}
.invite-info-row:hover {
background: #ECFDF5;
border-color: #D1FAE5;
}
.invite-info-row .icon {
font-size: 22px;
width: 40px;
height: 40px;
display: flex;
align-items: center;
justify-content: center;
background: #ECFDF5;
border-radius: 10px;
flex-shrink: 0;
}
.invite-info-row .info {
flex: 1;
min-width: 0;
}
.invite-info-row .info .label {
font-size: 11px;
color: #94A3B8;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.5px;
}
.invite-info-row .info .value {
font-size: 15px;
font-weight: 700;
color: #1E293B;
overflow-wrap: anywhere;
}
.invite-info-row .info .value a {
color: #059669;
text-decoration: none;
font-weight: 800;
}
.invite-info-row .info .value a:hover {
text-decoration: underline;
}
.map-link {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
padding: 16px;
background: linear-gradient(135deg, #10B981 0%, #059669 100%);
color: white;
text-decoration: none;
border-radius: 14px;
font-weight: 800;
font-size: 15px;
transition: all 0.2s ease;
box-shadow: 0 6px 18px rgba(16, 185, 129, 0.3);
text-align: center;
overflow-wrap: anywhere;
}
.map-link:hover {
transform: translateY(-2px);
box-shadow: 0 10px 28px rgba(16, 185, 129, 0.4);
}
.invite-section--location .map-link {
margin-top: 12px;
}
.invite-section--visit .invite-info-row {
align-items: flex-start;
}
.invite-footer {
text-align: center;
padding: 16px 30px 20px;
border-top: 1px solid #F1F5F9;
background: #F8FAFC;
}
.invite-footer p {
font-size: 12px;
color: #94A3B8;
font-weight: 600;
}
.share-buttons {
display: flex;
gap: 10px;
justify-content: center;
margin-top: 10px;
flex-wrap: wrap;
}
.share-btn {
min-height: 40px;
padding: 9px 18px;
border: 2px solid #E2E8F0;
background: #FFFFFF;
border-radius: 10px;
font-weight: 700;
font-size: 13px;
cursor: pointer;
font-family: inherit;
transition: all 0.2s ease;
text-decoration: none;
color: #334155;
display: inline-flex;
align-items: center;
gap: 6px;
text-align: center;
overflow-wrap: anywhere;
}
.share-btn:hover {
border-color: #10B981;
color: #059669;
background: #ECFDF5;
transform: translateY(-1px);
box-shadow: 0 4px 12px rgba(16,185,129,0.15);
}
html[data-theme="light"] {
--invite-page-bg: #064E3B;
--invite-page-glow-a: rgba(16,185,129,0.4);
--invite-page-glow-b: rgba(59,130,246,0.15);
--invite-card-bg: #FFFFFF;
--invite-section-bg: #F8FAFC;
--invite-section-hover: #ECFDF5;
--invite-text: #1E293B;
--invite-muted: #64748B;
--invite-border: #F1F5F9;
--invite-strong-border: #D1FAE5;
}
html[data-theme="dark"] {
--invite-page-bg: #07111F;
--invite-page-glow-a: rgba(16,185,129,0.22);
--invite-page-glow-b: rgba(96,165,250,0.12);
--invite-card-bg: #111827;
--invite-section-bg: rgba(255,255,255,0.06);
--invite-section-hover: rgba(16,185,129,0.12);
--invite-text: #F8FAFC;
--invite-muted: #CBD5E1;
--invite-border: rgba(255,255,255,0.10);
--invite-strong-border: rgba(52,211,153,0.28);
}
body {
background: var(--invite-page-bg);
background-image:
radial-gradient(ellipse at 30% 0%, var(--invite-page-glow-a) 0%, transparent 60%),
radial-gradient(ellipse at 70% 100%, var(--invite-page-glow-b) 0%, transparent 60%);
}
.invite-card {
background: var(--invite-card-bg);
}
.invite-section h2,
.invite-info-row .info .value,
.share-btn {

}
.invite-section p,
.invite-info-row .info .label,
.invite-footer p {
color: var(--invite-muted);
}
.invite-info-row,
.invite-footer {
background: var(--invite-section-bg);
border-color: var(--invite-border);
}
.invite-info-row:hover,
.share-btn:hover {
background: var(--invite-section-hover);
border-color: var(--invite-strong-border);
}
.share-btn {

border-color: var(--invite-border);
}
@media (max-width: 480px) {
body { padding: 12px; }
.invite-body { padding: 24px 20px; }
.invite-header-content { padding: 16px 20px 24px; }
.invite-hero-wrap { min-height: 150px; }
.invite-header h1 { font-size: 23px; }
}
</style>

<body data-page-group="hr">
    <!-- Skip link for accessibility -->
    <a href="#invite-details" class="skip-link">Перейти до деталей запрошення</a>
    <div class="invite-card">
        <div class="invite-header">
            <div class="invite-hero-wrap">
                <img id="inviteHeroImage" loading="eager" decoding="async" src="/images/event-cards/event-card-holiday-party.png" alt="Зображення типу заходу" class="invite-hero">
                <div class="invite-hero-overlay"></div>
            </div>
            <div class="invite-header-content">
                <img loading="lazy" src="images/brand/event-genix-logo.png" alt="Логотип Event Genix" class="logo-img">
                <p class="invite-brand" id="inviteBrandName">Event Genix</p>
                <h1 id="inviteTitle">Запрошення</h1>
                <p class="subtitle">Запрошуємо на подію</p>
                <div id="eventDetails"></div>
            </div>
        </div>

        <div id="invite-details" class="invite-body">
            <div class="invite-section invite-section--location" id="inviteLocationSection"></div>
            <div class="invite-section invite-section--visit" id="inviteVisitSection"></div>
            <div class="invite-section" id="inviteContactSection"></div>
        </div>

        <div class="invite-footer">
            <p>Поділитися запрошенням</p>
            <div class="share-buttons">
                <a class="share-btn" onclick="shareInvite(event)">📤 Поділитись</a>
                <a class="share-btn" onclick="copyLink(event)">📋 Копіювати</a>
            </div>
        </div>
    </div>

    <script src="js/event-cards.js?v=0.78.93"></script>
    <script src="js/invite-config.js?v=0.78.93"></script>
    <script>
        const DEFAULT_INVITE_CONFIG = Object.freeze({
            brandName: 'Event Genix',
            shareTitle: 'Event Genix',
            shareFallbackText: 'Запрошуємо на подію!',
            location: Object.freeze({
                title: 'Як нас знайти',
                rows: Object.freeze([]),
                mapIcon: '🗺',
                mapLabel: 'Відкрити на карті',
                mapUrl: ''
            }),
            visit: Object.freeze({
                title: 'Перед візитом',
                tips: Object.freeze({
                    'holiday-party': Object.freeze([
                        Object.freeze({ icon: '⏱', label: 'Коли приходити', value: 'Приходьте за 5-10 хвилин до початку події.' })
                    ])
                })
            }),
            contact: Object.freeze({
                title: 'Контакти',
                rows: Object.freeze([])
            })
        });
        const INVITE_CONFIG = window.InviteConfig || DEFAULT_INVITE_CONFIG;

        // Show per-event details from URL params
        (function() {
            const params = new URLSearchParams(window.location.search);
            const date = params.get('date');
            const time = params.get('time');
            const end = params.get('end');
            const arrival = params.get('arrival') || params.get('guestTime') || params.get('guest_time');
            const program = params.get('program');
            const room = params.get('room');
            const eventType = params.get('type');
            const category = params.get('category');
            const hero = document.getElementById('inviteHeroImage');
            const title = document.getElementById('inviteTitle');
            const brand = document.getElementById('inviteBrandName');
            const card = resolveInviteEventCard(params, { program, eventType, category });

            if (hero) {
                hero.src = card.src;
                hero.alt = 'Зображення типу заходу';
                hero.dataset.card = card.key;
            }

            if (brand) brand.textContent = inviteConfigText(INVITE_CONFIG.brandName, DEFAULT_INVITE_CONFIG.brandName);
            if (title) title.textContent = program || 'Запрошення';

            renderInviteLocation();
            renderInviteVisitTips(card.key);
            renderInviteContact();

            const timeRange = formatInviteTimeRange(time, end);
            const hasArrival = Boolean(arrival);
            const hasActivityTime = Boolean(timeRange && (!hasArrival || normalizeInviteTime(arrival) !== normalizeInviteTime(time)));
            if (date || arrival || timeRange || program || room) {
                const container = document.getElementById('eventDetails');
                if (!container) return;
                const div = document.createElement('div');
                div.className = 'event-details';
                let html = '';
                if (date) html += renderEventDetailRow('📅', 'Дата', date);
                if (hasArrival) html += renderEventDetailRow('🕐', 'Прихід гостей', arrival);
                if (hasActivityTime) html += renderEventDetailRow('⏱', 'Час активності', timeRange);
                if (program) html += renderEventDetailRow('🎉', 'Активність', program);
                if (room) html += renderEventDetailRow('📍', 'Кімната', room);
                div.innerHTML = html;
                container.appendChild(div);
            }
        })();

        function normalizeInviteTime(value) {
            return String(value || '').trim().replace(/\s+/g, '');
        }

        function formatInviteTimeRange(start, end) {
            const normalizedStart = String(start || '').trim();
            const normalizedEnd = String(end || '').trim();
            if (normalizedStart && normalizedEnd && normalizeInviteTime(normalizedStart) !== normalizeInviteTime(normalizedEnd)) {
                return normalizedStart + ' - ' + normalizedEnd;
            }
            return normalizedStart;
        }

        function renderEventDetailRow(icon, label, value) {
            return '<div class="event-detail-row">'
                + '<span class="event-detail-icon" aria-hidden="true">' + escapeHtml(icon) + '</span>'
                + '<span class="event-detail-copy">'
                + '<span class="event-detail-label">' + escapeHtml(label) + '</span>'
                + '<strong class="event-detail-value">' + escapeHtml(value) + '</strong>'
                + '</span>'
                + '</div>';
        }

        function resolveInviteEventCard(params, event) {
            const allowedKeys = new Set(['holiday-party', 'show-program', 'family-event', 'workshop', 'private-party', 'quest']);
            const cards = window.EventCards?.EVENT_CARDS || {};
            const fallback = cards['holiday-party'] || {
                key: 'holiday-party',
                src: '/images/event-cards/event-card-holiday-party.png'
            };
            const requested = String(params.get('card') || '').trim();
            if (allowedKeys.has(requested) && cards[requested]) return cards[requested];

            const resolved = window.EventCards?.resolveEventCardKey?.({
                program: event.program,
                title: event.program,
                name: event.program,
                type: event.eventType,
                category: event.category
            });

            return allowedKeys.has(resolved) && cards[resolved] ? cards[resolved] : fallback;
        }

        function renderInviteVisitTips(cardKey) {
            const section = document.getElementById('inviteVisitSection');
            if (!section) return;
            const configTips = INVITE_CONFIG.visit?.tips || {};
            const fallbackTips = DEFAULT_INVITE_CONFIG.visit.tips;
            const tips = configTips[cardKey] || configTips['holiday-party'] || fallbackTips['holiday-party'];
            const title = inviteConfigText(INVITE_CONFIG.visit?.title, DEFAULT_INVITE_CONFIG.visit.title);
            section.hidden = !Array.isArray(tips) || tips.length === 0;
            section.innerHTML = section.hidden
                ? ''
                : renderInviteSectionTitle('✅', title) + tips.map(tip => renderInviteInfoRow(tip, 'data-visit-tip')).join('');
        }

        function renderInviteLocation() {
            const section = document.getElementById('inviteLocationSection');
            if (!section) return;
            const location = INVITE_CONFIG.location || DEFAULT_INVITE_CONFIG.location;
            const rows = inviteConfigRows(location.rows);
            const mapUrl = inviteConfigText(location.mapUrl, '');
            const title = inviteConfigText(location.title, DEFAULT_INVITE_CONFIG.location.title);
            section.hidden = rows.length === 0 && !mapUrl;
            if (section.hidden) {
                section.innerHTML = '';
                return;
            }
            section.innerHTML = renderInviteSectionTitle(location.titleIcon || '📍', title)
                + rows.map(row => renderInviteInfoRow(row)).join('')
                + (mapUrl
                    ? '<a href="' + escapeHtml(mapUrl) + '" target="_blank" rel="noopener" class="map-link">'
                        + escapeHtml(inviteConfigText(location.mapIcon, DEFAULT_INVITE_CONFIG.location.mapIcon)) + ' '
                        + escapeHtml(inviteConfigText(location.mapLabel, DEFAULT_INVITE_CONFIG.location.mapLabel))
                        + '</a>'
                    : '');
        }

        function renderInviteContact() {
            const section = document.getElementById('inviteContactSection');
            if (!section) return;
            const contact = INVITE_CONFIG.contact || DEFAULT_INVITE_CONFIG.contact;
            const rows = inviteConfigRows(contact.rows);
            section.hidden = rows.length === 0;
            section.innerHTML = section.hidden
                ? ''
                : renderInviteSectionTitle(contact.titleIcon || '📞', inviteConfigText(contact.title, DEFAULT_INVITE_CONFIG.contact.title))
                    + rows.map(row => renderInviteInfoRow(row)).join('');
        }

        function renderInviteSectionTitle(icon, title) {
            return '<h2>' + escapeHtml(inviteConfigText(icon, '')) + ' ' + escapeHtml(title) + '</h2>';
        }

        function renderInviteInfoRow(item, attributes) {
            const href = inviteConfigText(item.href, '');
            const value = href
                ? '<a href="' + escapeHtml(href) + '">' + escapeHtml(inviteConfigText(item.value, '')) + '</a>'
                : escapeHtml(inviteConfigText(item.value, ''));
            return '<div class="invite-info-row"' + (attributes ? ' ' + attributes : '') + '>'
                + '<span class="icon">' + escapeHtml(inviteConfigText(item.icon, '')) + '</span>'
                + '<div class="info">'
                + '<div class="label">' + escapeHtml(inviteConfigText(item.label, '')) + '</div>'
                + '<div class="value">' + value + '</div>'
                + '</div>'
                + '</div>';
        }

        function inviteConfigRows(rows) {
            return Array.isArray(rows)
                ? rows.filter(row => row && inviteConfigText(row.label, '') && inviteConfigText(row.value, ''))
                : [];
        }

        function inviteConfigText(value, fallback) {
            const text = String(value || '').trim();
            return text || String(fallback || '').trim();
        }

        function inviteLocationAddress() {
            const rows = inviteConfigRows(INVITE_CONFIG.location?.rows);
            const addressRow = rows.find(row => String(row.label || '').trim().toLowerCase() === 'адреса');
            return inviteConfigText(addressRow?.value, '');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function shareInvite(event) {
            const params = new URLSearchParams(window.location.search);
            const program = params.get('program') || '';
            const date = params.get('date') || '';
            const time = params.get('time') || '';
            const end = params.get('end') || '';
            const arrival = params.get('arrival') || params.get('guestTime') || params.get('guest_time') || '';
            const timeRange = formatInviteTimeRange(time, end);
            const hasDistinctArrival = Boolean(arrival && normalizeInviteTime(arrival) !== normalizeInviteTime(time));
            const timeDetails = [
                hasDistinctArrival ? 'Прихід гостей: ' + arrival : '',
                timeRange ? 'Час активності: ' + timeRange : ''
            ].filter(Boolean).join('. ');
            const shareTitle = inviteConfigText(INVITE_CONFIG.shareTitle, inviteConfigText(INVITE_CONFIG.brandName, DEFAULT_INVITE_CONFIG.shareTitle));
            const shareFallbackText = inviteConfigText(INVITE_CONFIG.shareFallbackText, DEFAULT_INVITE_CONFIG.shareFallbackText);
            const address = inviteLocationAddress();
            const locationTail = [shareTitle, address].filter(Boolean).join(' — ');
            const text = program && date
                ? 'Запрошуємо на ' + program + ' ' + date + (timeDetails ? '. ' + timeDetails : '') + '!' + (locationTail ? ' ' + locationTail : '')
                : shareFallbackText + (locationTail ? ' ' + locationTail : '');
            if (navigator.share) {
                navigator.share({ title: shareTitle, text: text, url: window.location.href });
            } else {
                copyLink(event);
            }
        }

        function writeClipboardText(text) {
            function fallbackCopy() {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    return Promise.resolve();
                } catch (err) {
                    return Promise.reject(err);
                } finally {
                    textarea.remove();
                }
            }

            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                const clipboardWrite = navigator.clipboard.writeText(text);
                const clipboardTimeout = new Promise(function(resolve, reject) {
                    setTimeout(function() { reject(new Error('Clipboard timeout')); }, 700);
                });
                return Promise.race([clipboardWrite, clipboardTimeout]).catch(fallbackCopy);
            }

            return fallbackCopy();
        }

        function copyLink(event) {
            writeClipboardText(window.location.href).then(function() {
                const btn = event && event.target ? event.target.closest('.share-btn') : null;
                if (btn) {
                    const original = btn.innerHTML;
                    btn.innerHTML = '✅ Скопійовано!';
                    setTimeout(function() { btn.innerHTML = original; }, 2000);
                }
            });
        }
    </script>
</body>
</html>
