<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Event Genix demo post template</title>
  <desc id="desc">Square demo template with craft background, Event Genix logo, headline area and CTA.</desc>
  <defs>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17324D" stop-opacity="0.86"/>
      <stop offset="0.52" stop-color="#17324D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E73783" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <image href="../event-card-family-event.png" x="-335" y="0" width="1728" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1080" fill="url(#shade)"/>
  <rect x="64" y="64" width="140" height="140" rx="34" fill="#FFFFFF" opacity="0.92"/>
  <image href="../../event-genix-logo.png" x="84" y="84" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
  <text x="64" y="360" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#A7F3D0">DEMO TEMPLATE</text>
  <text x="64" y="458" font-family="Nunito, Arial, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">Нова подія</text>
  <text x="64" y="555" font-family="Nunito, Arial, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">готова до</text>
  <text x="64" y="652" font-family="Nunito, Arial, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">публікації</text>
  <text x="64" y="736" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600" fill="#E0F2FE">Фото, короткий заголовок і один чіткий заклик.</text>
  <rect x="64" y="858" width="390" height="92" rx="28" fill="#2FB36D"/>
  <text x="104" y="918" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">Переглянути в CRM</text>
</svg>
