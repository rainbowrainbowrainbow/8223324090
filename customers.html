<html lang="uk">
<head>

    <title>Event Genix | Клієнти</title>
    <meta name="description" content="Event Genix — AI First CRM для дитячих розважальних центрів">
    <meta property="og:title" content="Event Genix">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=43.3.0">
    <link rel="stylesheet" href="css/layout.css?v=43.3.0">
    <link rel="stylesheet" href="css/pages.css?v=43.3.0">
    <link rel="stylesheet" href="css/modals.css?v=43.3.0">
    <link rel="stylesheet" href="css/dark-mode.css?v=43.3.0">
    <link rel="stylesheet" href="css/responsive.css?v=43.3.0">
    <link rel="stylesheet" href="css/role-panel.css?v=43.3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           CRM PAGE STYLES
           ========================================== */

        .crm-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--gray-100);
            box-shadow: var(--shadow-xs);
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1.2;
        }

        .stat-card .stat-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Filter bar */
        .crm-filters {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .crm-filters input,
        .crm-filters select {
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: var(--font-sm);
            font-family: inherit;
            min-height: 44px;
            box-sizing: border-box;
        }

        .crm-filters input:focus,
        .crm-filters select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }

        .crm-search {
            flex: 1;
            min-width: 200px;
        }

        .crm-filter-select {
            min-width: 140px;
        }

        .crm-filter-date {
            width: 140px;
        }

        .crm-toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .crm-toolbar .btn-page-secondary {
            font-size: 12px;
            padding: 6px 14px;
            min-height: 36px;
            white-space: nowrap;
            border-radius: var(--radius-sm);
        }

        /* Tab bar */
        .crm-tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 16px;
            background: var(--gray-100);
            border-radius: var(--radius);
            padding: 3px;
        }

        .crm-tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-500);
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
            text-align: center;
            min-height: 44px;
        }

        .crm-tab:hover {
            color: var(--gray-700);
        }

        .crm-tab.active {
            background: var(--white);
            color: var(--gray-800);
            box-shadow: var(--shadow-xs);
        }

        /* Customer table */
        .crm-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100);
        }

        .crm-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
            background: var(--white);
        }

        .crm-table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--gray-50);
            padding: 10px 12px;
            font-size: 11px;
            font-weight: 800;
            color: var(--gray-500);
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--gray-200);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .crm-table thead th:hover {
            color: var(--gray-700);
        }

        .crm-table tbody tr {
            transition: background 0.1s;
            cursor: pointer;
        }

        .crm-table tbody tr:hover {
            background: rgba(16,185,129,0.03);
        }

        .crm-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--gray-100);
            font-size: 13px;
            color: var(--gray-700);
        }

        .crm-table .customer-name {
            font-weight: 700;
            color: var(--gray-800);
        }

        .crm-table .customer-child {
            font-size: 12px;
            color: var(--gray-400);
        }

        .crm-table .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-source {
            background: rgba(16,185,129,0.1);
            color: #059669;
        }
        .badge-source-telegram  { background: rgba(0,136,204,0.12);  color: #0088CC; }
        .badge-source-facebook  { background: rgba(24,119,242,0.12); color: #1877F2; }
        .badge-source-instagram { background: rgba(193,53,132,0.12); color: #C13584; }
        .badge-source-viber     { background: rgba(115,82,143,0.12); color: #73528F; }
        .badge-source-tiktok    { background: rgba(0,0,0,0.1);       color: #333;    }
        .badge-source-turbo     { background: rgba(255,149,0,0.12);  color: #E86F00; }
        .badge-source-bnderoga  { background: rgba(255,200,0,0.12);  color: #B8860B; }
        .badge-source-google    { background: rgba(66,133,244,0.12); color: #4285F4; }
        .badge-source-manual    { background: rgba(100,100,100,0.1); color: #666;    }

        .badge-visits {
            background: rgba(59,130,246,0.1);
            color: #2563EB;
        }

        .badge-spent {
            background: rgba(245,158,11,0.1);
            color: #D97706;
        }

        /* RFM segments */
        .rfm-champion { background: rgba(16,185,129,0.15); color: #059669; }
        .rfm-loyal { background: rgba(59,130,246,0.15); color: #2563EB; }
        .rfm-potential { background: rgba(245,158,11,0.15); color: #D97706; }
        .rfm-at_risk { background: rgba(239,68,68,0.15); color: #DC2626; }
        .rfm-lost { background: rgba(100,116,139,0.15); color: #64748B; }

        /* RFM chart */
        .rfm-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .rfm-segment-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--gray-100);
            box-shadow: var(--shadow-xs);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rfm-segment-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .rfm-segment-info .rfm-count {
            font-size: 22px;
            font-weight: 900;
            line-height: 1.2;
        }

        .rfm-segment-info .rfm-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--gray-500);
        }

        /* Pagination */
        .crm-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .crm-pagination button {
            width: 36px;
            height: 36px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crm-pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .crm-pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .crm-pagination .page-info {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-500);
        }

        /* Empty state */
        .crm-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
        }

        .crm-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .crm-empty .empty-text {
            font-size: 15px;
            font-weight: 700;
        }

        /* Detail panel */
        .customer-detail {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--gray-100);
            box-shadow: var(--shadow-sm);
        }

        .customer-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .customer-detail-header h3 {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-800);
        }

        .detail-section {
            margin-bottom: 16px;
        }

        .detail-section h4 {
            font-size: 12px;
            font-weight: 800;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
        }

        .detail-field {
            font-size: 13px;
        }

        .detail-field .field-label {
            font-weight: 700;
            color: var(--gray-500);
            font-size: 11px;
        }

        .detail-field .field-value {
            color: var(--gray-800);
            font-weight: 600;
        }

        .detail-bookings {
            max-height: 300px;
            overflow-y: auto;
        }

        .detail-booking-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--gray-50);
            font-size: 13px;
        }

        .detail-booking-row:last-child {
            border-bottom: none;
        }

        /* Dark mode */
        [data-theme="dark"] .stat-card {
            background: var(--gray-800);
            border-color: var(--gray-700);
        }
        [data-theme="dark"] .stat-card .stat-label { color: var(--gray-400); }
        [data-theme="dark"] .crm-tabs { background: var(--gray-800); }
        [data-theme="dark"] .crm-tab { color: var(--gray-400); }
        [data-theme="dark"] .crm-tab.active {
            background: var(--gray-700);
            color: var(--gray-200);
        }
        [data-theme="dark"] .crm-table {
            background: var(--gray-800);
        }
        [data-theme="dark"] .crm-table thead th {
            background: var(--gray-700);
            color: var(--gray-400);
            border-bottom-color: var(--gray-600);
        }
        [data-theme="dark"] .crm-table td {
            border-bottom-color: var(--gray-700);
            color: var(--gray-300);
        }
        [data-theme="dark"] .crm-table .customer-name { color: var(--gray-200); }
        [data-theme="dark"] .crm-table tbody tr:hover {
            background: rgba(16,185,129,0.05);
        }
        [data-theme="dark"] .crm-table-wrap {
            border-color: var(--gray-700);
        }
        [data-theme="dark"] .crm-filters input,
        [data-theme="dark"] .crm-filters select {
            background: var(--gray-800);
            border-color: var(--gray-700);
            color: var(--gray-200);
        }
        [data-theme="dark"] .crm-pagination button {
            background: var(--gray-800);
            border-color: var(--gray-700);
            color: var(--gray-300);
        }
        [data-theme="dark"] .rfm-segment-card {
            background: var(--gray-800);
            border-color: var(--gray-700);
        }
        [data-theme="dark"] .customer-detail {
            background: var(--gray-800);
            border-color: var(--gray-700);
        }
        [data-theme="dark"] .customer-detail-header h3 { color: var(--gray-200); }
        [data-theme="dark"] .detail-field .field-value { color: var(--gray-200); }
        [data-theme="dark"] .detail-booking-row { border-bottom-color: var(--gray-700); }

        /* v30.4: Tag pills */
        .crm-tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .crm-tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .crm-tag-remove {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 0 2px;
            color: inherit;
            opacity: 0.6;
        }
        .crm-tag-remove:hover { opacity: 1; }
        .crm-tags-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .crm-tag-add-btn {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border: 1px dashed var(--gray-300);
            background: transparent;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--gray-500);
            cursor: pointer;
            font-family: inherit;
            min-height: 28px;
        }
        .crm-tag-add-btn:hover { border-color: var(--primary); color: var(--primary); }
        .crm-tag-dropdown {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            margin-top: 6px;
            width: 100%;
        }
        .crm-tag-option {
            padding: 4px 10px;
            border: 1px solid currentColor;
            background: transparent;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .crm-tag-option:hover { opacity: 0.8; }

        /* v30.4: Journey funnel */
        .journey-funnel {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--gray-100);
            box-shadow: var(--shadow-sm);
        }
        .journey-stage {
            margin-bottom: 8px;
        }
        .journey-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 700;
            font-size: 13px;
            min-height: 44px;
            transition: width 0.3s ease;
        }
        .journey-icon { font-size: 18px; }
        .journey-label { flex: 1; }
        .journey-count {
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap;
        }

        /* v30.4: Duplicate cards */
        .duplicates-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .duplicate-pair {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: var(--shadow-xs);
            flex-wrap: wrap;
        }
        .dup-card {
            flex: 1;
            min-width: 180px;
            font-size: 13px;
            line-height: 1.5;
        }
        .dup-match {
            font-size: 20px;
            flex-shrink: 0;
        }

        /* v30.4: Communications timeline */
        .comm-timeline {
            max-height: 300px;
            overflow-y: auto;
        }
        .comm-entry {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-50);
            font-size: 13px;
        }
        .comm-entry:last-child { border-bottom: none; }
        .comm-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
        .comm-text { flex: 1; color: var(--gray-700); }
        .comm-date { font-size: 11px; color: var(--gray-400); white-space: nowrap; }

        /* v30.4: NPS dashboard */
        .nps-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .nps-score-card {
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .nps-big-score {
            font-size: 48px;
            font-weight: 900;
            line-height: 1.2;
        }
        .nps-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .nps-bar-label { width: 30px; text-align: right; font-weight: 700; }
        .nps-bar-track {
            flex: 1;
            height: 20px;
            background: var(--gray-100);
            border-radius: 10px;
            overflow: hidden;
        }
        .nps-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .nps-bar-count { width: 30px; font-size: 12px; color: var(--gray-500); }

        /* v30.4: Bulk messaging */
        .bulk-form {
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }
        .bulk-form label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .bulk-form select,
        .bulk-form input,
        .bulk-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: var(--font-sm);
            font-family: inherit;
            min-height: 44px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .bulk-form textarea { min-height: 100px; resize: vertical; }
        .bulk-preview {
            padding: 12px;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            color: var(--gray-600);
            margin-bottom: 12px;
        }

        /* v30.4: Dark mode for new components */
        [data-theme="dark"] .crm-tag-dropdown {
            background: var(--gray-800);
            border-color: var(--gray-600);
        }
        [data-theme="dark"] .journey-funnel,
        [data-theme="dark"] .nps-score-card,
        [data-theme="dark"] .bulk-form {
            background: var(--gray-800);
            border-color: var(--gray-700);
        }
        [data-theme="dark"] .duplicate-pair {
            background: var(--gray-800);
            border-color: var(--gray-700);
        }
        [data-theme="dark"] .comm-entry { border-bottom-color: var(--gray-700); }
        [data-theme="dark"] .nps-bar-track { background: var(--gray-700); }
        [data-theme="dark"] .bulk-preview { background: var(--gray-700); color: var(--gray-300); }
        [data-theme="dark"] .bulk-form select,
        [data-theme="dark"] .bulk-form input,
        [data-theme="dark"] .bulk-form textarea {
            background: var(--gray-700);
            border-color: var(--gray-600);
            color: var(--gray-200);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .crm-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .crm-filters {
                flex-direction: column;
                align-items: stretch;
            }
            .crm-search { min-width: 0; }
            .crm-filter-date { width: 100%; }
            .crm-filter-select { min-width: 0; }
            .crm-toolbar {
                justify-content: center;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .rfm-overview {
                grid-template-columns: repeat(2, 1fr);
            }
            .nps-dashboard {
                grid-template-columns: 1fr;
            }
            .duplicate-pair {
                flex-direction: column;
                align-items: stretch;
            }
            .crm-tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body data-page-group="mgmt">
    <script>
    // Dark mode flash prevention
    (function(){var s=localStorage.getItem('pzp_dark_mode');if(s==='true'||(s===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.body.classList.add('dark-mode')}})();
    </script>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
    <!-- Login overlay -->
    <div id="loginOverlay" class="page-login-overlay hidden">
        <a href="/">Увійти в систему</a>
    </div>

    <div id="mainApp">
        <!-- Бокове меню -->
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-brand">
                    <img loading="lazy" src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                    <div class="em-logo">
                        <span class="em-logo-title">Event Genix</span>
                        <span class="em-logo-sub">AI First CRM</span>
                    </div>
                </div>
                <div class="sidebar-user-card" id="sidebarUserCard">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName"></div>
                        <div class="sidebar-user-role" id="sidebarUserRole"></div>
                    </div>
                    <div class="sidebar-user-status online" id="sidebarUserStatus">●</div>
                </div>
                <div class="sidebar-day-context" id="sidebarDayContext" style="display:none"></div>
            </div>
            <nav class="sidebar-links" id="sidebarLinks"></nav>
        <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Згорнути/розгорнути меню">
            <span class="collapse-icon">◀</span>
            <span class="collapse-text">Згорнути</span>
        </button>
        </aside>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <header class="header">
            <div class="header-content">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Меню" aria-label="Відкрити/закрити меню">☰</button>
                <div class="user-panel">
                    <span id="currentUser" class="user-name"></span>
                    <button type="button" id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="page-container">
            <div class="page-header">
                <h2>База клієнтів</h2>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                    <button type="button" id="exportVcfBtn" class="btn-page-secondary" style="display:none;font-size:12px;padding:6px 12px;min-height:36px">vCard</button>
                    <button type="button" id="importVcfBtn" class="btn-page-secondary" style="display:none;font-size:12px;padding:6px 12px;min-height:36px">vCard</button>
                    <button type="button" id="exportCsvBtn" class="btn-page-secondary" style="display:none">Експорт CSV</button>
                    <button type="button" id="addCustomerBtn" class="btn-page-primary" style="display:none">+ Новий клієнт</button>
                    <input type="file" id="vcfFileInput" accept=".vcf,.vcard" style="display:none">
                </div>
            </div>

            <!-- Stats overview -->
            <div id="crmStats" class="crm-stats"></div>

            <!-- Tabs -->
            <div class="crm-tabs">
                <button type="button" class="crm-tab active" data-tab="list">Список</button>
                <button type="button" class="crm-tab" data-tab="rfm">RFM-аналітика</button>
                <button type="button" class="crm-tab" data-tab="journey">Воронка</button>
                <button type="button" class="crm-tab" data-tab="duplicates">Дублікати</button>
                <button type="button" class="crm-tab" data-tab="nps">NPS</button>
                <button type="button" class="crm-tab" data-tab="bulk">Розсилка</button>
            </div>

            <!-- List tab -->
            <div id="tabList">
                <!-- Filters -->
                <div class="crm-filters">
                    <input type="text" id="searchInput" class="crm-search" aria-label="Пошук по імені, телефону, Instagram..." placeholder="Пошук по імені, телефону, Instagram...">
                    <select id="tagFilter" class="crm-filter-select">
                        <option value="">Всі теги</option>
                        <option value="VIP">VIP</option>
                        <option value="Проблемний">Проблемний</option>
                        <option value="Корпорат">Корпорат</option>
                        <option value="Рекомендація">Рекомендація</option>
                        <option value="Постійний">Постійний</option>
                    </select>
                    <select id="sourceFilter" class="crm-filter-select">
                        <option value="">Всі джерела</option>
                        <option value="telegram">🔵 Telegram</option>
                        <option value="facebook">🔷 Facebook</option>
                        <option value="instagram">🟣 Instagram</option>
                        <option value="viber">🟢 Viber</option>
                        <option value="tiktok">⚫ TikTok</option>
                        <option value="turbo">🟠 Turbo</option>
                        <option value="bnderoga">🟡 BnD</option>
                        <option value="google">🔍 Google</option>
                        <option value="recommendation">🤝 Рекомендація</option>
                        <option value="repeat">🔄 Повторний</option>
                        <option value="manual">✏️ Ручний</option>
                        <option value="other">Інше</option>
                    </select>
                    <select id="sortFilter" class="crm-filter-select">
                        <option value="updated_at">За оновленням</option>
                        <option value="name">За іменем</option>
                        <option value="total_bookings">За візитами</option>
                        <option value="total_spent">За витратами</option>
                        <option value="last_visit">За останнім візитом</option>
                        <option value="created_at">За створенням</option>
                        <option value="ltv">За LTV</option>
                    </select>
                    <input type="date" id="dateFromFilter" class="crm-filter-date" title="Візити від" aria-label="Дата від">
                    <input type="date" id="dateToFilter" class="crm-filter-date" title="Візити до" aria-label="Дата до">
                </div>

                <!-- Table -->
                <div class="crm-table-wrap">
                    <table class="crm-table">
                        <thead>
                            <tr>
                                <th>Клієнт</th>
                                <th>Телефон</th>
                                <th>Instagram</th>
                                <th>Джерело</th>
                                <th>Візити</th>
                                <th>Витрачено</th>
                                <th>Останній візит</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody"></tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="crm-pagination"></div>
            </div>

            <!-- RFM tab -->
            <div id="tabRfm" style="display:none">
                <div id="rfmOverview" class="rfm-overview"></div>
                <div class="crm-table-wrap">
                    <table class="crm-table">
                        <thead>
                            <tr>
                                <th>Клієнт</th>
                                <th>R (днів)</th>
                                <th>F (візити)</th>
                                <th>M (грн)</th>
                                <th>RFM</th>
                                <th>Сегмент</th>
                            </tr>
                        </thead>
                        <tbody id="rfmTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Journey funnel tab -->
            <div id="tabJourney" style="display:none"></div>

            <!-- Duplicates tab -->
            <div id="tabDuplicates" style="display:none"></div>

            <!-- NPS tab -->
            <div id="tabNps" style="display:none"></div>

            <!-- Bulk messaging tab -->
            <div id="tabBulk" style="display:none"></div>
        </main>
    </div>

    <!-- Customer detail modal -->
    <div id="customerDetailModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Деталі клієнта">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close">&times;</span>
            <div id="customerDetailContent"></div>
        </div>
    </div>

    <!-- Customer edit modal -->
    <div id="customerEditModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Редагувати клієнта">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close">&times;</span>
            <h3 id="customerEditTitle">Новий клієнт</h3>
            <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
                <div>
                    <label style="display:block;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Ім'я клієнта *</label>
                    <input type="text" id="editName" aria-label="Ім'я клієнта" style="width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:var(--font-sm);font-family:inherit;min-height:44px;box-sizing:border-box">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Телефон</label>
                        <input type="tel" id="editPhone" aria-label="+380..." placeholder="+380..." style="width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:var(--font-sm);font-family:inherit;min-height:44px;box-sizing:border-box">
                    </div>
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Instagram</label>
                        <input type="text" id="editInstagram" aria-label="@username" placeholder="@username" style="width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:var(--font-sm);font-family:inherit;min-height:44px;box-sizing:border-box">
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Ім'я дитини</label>
                        <input type="text" id="editChildName" style="width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:var(--font-sm);font-family:inherit;min-height:44px;box-sizing:border-box">
                    </div>
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">ДН дитини</label>
                        <input type="date" id="editChildBirthday" style="width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;min-height:44px;box-sizing:border-box">
                    </div>
                </div>
                <div>
                    <label style="display:block;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Звідки дізналися</label>
                    <select id="editSource" style="width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:var(--font-sm);font-family:inherit;min-height:44px;box-sizing:border-box">
                        <option value="">Не вказано</option>
                        <option value="instagram">Instagram</option>
                        <option value="google">Google</option>
                        <option value="recommendation">Рекомендація</option>
                        <option value="repeat">Повторний</option>
                        <option value="other">Інше</option>
                    </select>
                </div>
                <div>
                    <label style="display:block;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Нотатки</label>
                    <textarea id="editNotes" rows="3" style="width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:var(--font-sm);font-family:inherit;box-sizing:border-box;resize:vertical"></textarea>
                </div>
                <div style="display:flex;gap:8px;margin-top:4px">
                    <button type="button" id="saveCustomerBtn" class="btn-page-primary" style="flex:1">Зберегти</button>
                    <button type="button" id="cancelEditBtn" class="btn-page-secondary" style="flex:1">Скасувати</button>
                </div>
            </div>
        </div>
    </div>

    <!-- v10.4: Profile modal -->
    <div id="profileModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Особистий кабінет">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close">&times;</span>
            <h3>Особистий кабінет</h3>
            <div id="profileContent" class="profile-content">
                <div class="profile-loading">Завантаження...</div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <span id="notificationText"></span>
    </div>

    <script src="js/config.js?v=43.3.0"></script>
    <script src="js/notification.js?v=43.3.0"></script>
    <script src="js/api.js?v=43.3.0"></script>
    <script src="js/auth.js?v=43.3.0"></script>
    <script src="js/ui.js?v=43.3.0"></script>
    <script src="js/components/sidebar.js?v=43.3.0"></script>
    <script>if (typeof Sidebar !== "undefined") Sidebar.init("#sidebarLinks");</script>
    <script src="js/customers-page.js?v=43.3.0"></script>
    <script src="js/role-panel.js?v=43.3.0"></script>
    <script src="js/alerts.js?v=43.3.0"></script>
</body>
</html>
