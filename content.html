<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script>
    (function(){try{var s=localStorage.getItem('pzp_dark_mode');var d=s!=='false';document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>

    <script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window,document,"clarity","script","w841e2emn0");</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Genix | Контент</title>
    <meta name="description" content="Event Genix — AI First CRM для дитячих розважальних центрів">
    <meta property="og:title" content="Event Genix">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=0.79.1">
    <link rel="stylesheet" href="css/layout.css?v=0.79.1">
    <link rel="stylesheet" href="css/sidebar-aurora.css?v=0.79.1">
    <link rel="stylesheet" href="css/pages-shell.css?v=0.79.1">
    <link rel="stylesheet" href="css/modals.css?v=0.79.1">
    <link rel="stylesheet" href="css/dark-mode.css?v=0.79.1">
    <link rel="stylesheet" href="css/responsive.css?v=0.79.1">
    <link rel="stylesheet" href="css/content.css?v=0.79.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body data-page-group="product">
    <script>
    (function(){var s=localStorage.getItem('pzp_dark_mode');if(s!=='false'){document.body.classList.add('dark-mode')}})();
    </script>
    <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
    <div id="loginOverlay" class="page-login-overlay hidden">
        <a href="/">Увійти в систему</a>
    </div>

    <div id="mainApp" class="main-app hidden">
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-brand">
                    <img loading="lazy" src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                    <div class="em-logo">
                        <span class="em-logo-title">Event Genix</span>
                        <span class="em-logo-sub">AI First CRM</span>
                    </div>
                </div>
                <div class="sidebar-user-card" id="sidebarUserCard">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName"></div>
                        <div class="sidebar-user-role" id="sidebarUserRole"></div>
                    </div>
                    <div class="sidebar-user-status online" id="sidebarUserStatus">●</div>
                </div>
                <div class="sidebar-day-context" id="sidebarDayContext" style="display:none"></div>
            </div>
            <nav class="sidebar-links" id="sidebarLinks"></nav>
            <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Згорнути/розгорнути меню">
                <span class="collapse-icon">◀</span>
                <span class="collapse-text">Згорнути</span>
            </button>
        </aside>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <header class="header">
            <div class="header-content">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Меню" aria-label="Відкрити/закрити меню">☰</button>
                <div class="user-panel">
                    <span id="currentUser" class="user-name"></span>
                    <button type="button" id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="main-content page-container">
    <div class="content-page">
        <h1>📱 Контент-матриця <button class="content-btn content-btn--primary content-btn--small" onclick="ContentPage.openNewPost()">+ Пост</button></h1>

        <!-- Tabs -->
        <div class="content-tabs">
            <button class="content-tab active" data-tab="calendar">📅 Календар</button>
            <button class="content-tab" data-tab="posts">📝 Всі пости</button>
            <button class="content-tab" data-tab="cards">📇 Картки</button>
            <button class="content-tab" data-tab="analytics">📊 Аналітика</button>
            <button class="content-tab" data-tab="accounts">⚙️ Акаунти</button>
        </div>

        <!-- TAB: Calendar -->
        <div id="tab-calendar" class="content-tab-content active">
            <div class="content-controls">
                <div class="content-week-nav">
                    <button onclick="ContentPage.prevWeek()">←</button>
                    <span class="content-week-label" id="weekLabel">Тиждень 14</span>
                    <button onclick="ContentPage.nextWeek()">→</button>
                    <button class="content-btn content-btn--secondary content-btn--small" onclick="ContentPage.goToday()">Сьогодні</button>
                </div>
                <div class="content-view-toggle">
                    <button class="content-view-btn active" data-view="week" onclick="ContentPage.setView('week')">Тиждень</button>
                    <button class="content-view-btn" data-view="month" onclick="ContentPage.setView('month')">Місяць</button>
                </div>
            </div>

            <!-- Platform Filters -->
            <div class="content-platforms" id="platformFilters">
                <button class="content-platform-btn active" data-platform="all" onclick="ContentPage.filterPlatform('all')">Всі</button>
                <button class="content-platform-btn" data-platform="instagram" onclick="ContentPage.filterPlatform('instagram')">📸 Instagram</button>
                <button class="content-platform-btn" data-platform="telegram" onclick="ContentPage.filterPlatform('telegram')">📱 Telegram</button>
                <button class="content-platform-btn" data-platform="tiktok" onclick="ContentPage.filterPlatform('tiktok')">🎵 TikTok</button>
                <button class="content-platform-btn" data-platform="facebook" onclick="ContentPage.filterPlatform('facebook')">📘 Facebook</button>
                <button class="content-platform-btn" data-platform="threads" onclick="ContentPage.filterPlatform('threads')">🧵 Threads</button>
                <button class="content-platform-btn" data-platform="viber" onclick="ContentPage.filterPlatform('viber')">📲 Viber</button>
            </div>

            <!-- Stats row -->
            <div class="content-stats" id="weekStats"></div>

            <!-- Calendar Grid -->
            <div class="content-calendar" id="calendarGrid"></div>

            <!-- Generate button -->
            <div style="text-align:center;margin-top:12px">
                <button class="content-btn content-btn--primary" onclick="ContentPage.openGenerate()">🧠 Згенерувати план на тиждень</button>
            </div>
        </div>

        <!-- TAB: All Posts -->
        <div id="tab-posts" class="content-tab-content" style="display:none">
            <div class="content-filters-row">
                <select id="postsStatusFilter" class="content-filter-select" onchange="ContentPage.loadAllPosts()">
                    <option value="">Всі статуси</option>
                    <option value="draft">Чернетка</option>
                    <option value="pending_approval">На затвердженні</option>
                    <option value="approved">Затверджено</option>
                    <option value="scheduled">Заплановано</option>
                    <option value="published">Опубліковано</option>
                    <option value="failed">Помилка</option>
                </select>
                <select id="postsPlatformFilter" class="content-filter-select" onchange="ContentPage.loadAllPosts()">
                    <option value="">Всі платформи</option>
                    <option value="instagram">Instagram</option>
                    <option value="telegram">Telegram</option>
                    <option value="tiktok">TikTok</option>
                    <option value="facebook">Facebook</option>
                    <option value="threads">Threads</option>
                    <option value="viber">Viber</option>
                </select>
            </div>
            <div class="content-table-wrap" id="postsTable"></div>
        </div>

        <!-- TAB: Business Cards -->
        <div id="tab-cards" class="content-tab-content" style="display:none">
            <div class="content-controls">
                <div class="content-filters-row">
                    <select id="cardsCategoryFilter" class="content-filter-select" onchange="ContentPage.loadCards()">
                        <option value="">Всі категорії</option>
                        <option value="general">Загальне</option>
                        <option value="service">Послуги</option>
                        <option value="event">Події</option>
                        <option value="product">Товари</option>
                    </select>
                    <button class="content-btn content-btn--primary content-btn--small" onclick="ContentPage.openNewCard()">+ Нова картка</button>
                </div>
            </div>
            <div class="content-cards-grid" id="cardsGrid"></div>
            <div style="margin-top:24px">
                <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">📱 Правила соцмереж</h3>
                <div class="content-platforms" id="socialRulesButtons"></div>
            </div>
        </div>

        <!-- TAB: Analytics -->
        <div id="tab-analytics" class="content-tab-content" style="display:none">
            <div class="content-stats" id="analyticsStats" style="margin-bottom:24px"></div>
            <div id="analyticsDetails" class="content-empty">Оберіть період для перегляду аналітики</div>
        </div>

        <!-- TAB: Accounts -->
        <div id="tab-accounts" class="content-tab-content" style="display:none">
            <div class="content-accounts-grid" id="accountsGrid"></div>
        </div>
    </div>

    <!-- Post Modal -->
    <div class="content-modal-overlay" id="postModal">
        <div class="content-modal" style="position:relative">
            <button class="content-modal-close" onclick="ContentPage.closeModal()">&times;</button>
            <h2 id="modalTitle">Новий пост</h2>
            <input type="hidden" id="postId">
            <div class="content-field">
                <label for="postTitle">Назва</label>
                <input type="text" id="postTitle" placeholder="Назва посту...">
            </div>
            <div class="content-field">
                <label for="postBody">Текст посту</label>
                <textarea id="postBody" placeholder="Текст для соцмереж..." oninput="ContentPage.updateCharCount()"></textarea>
                <div class="content-char-count" id="charCount">0 символів</div>
            </div>
            <div class="content-field">
                <label>Платформи</label>
                <div class="content-platforms-select" id="modalPlatforms">
                    <label><input type="checkbox" value="instagram"> 📸 Instagram</label>
                    <label><input type="checkbox" value="telegram"> 📱 Telegram</label>
                    <label><input type="checkbox" value="tiktok"> 🎵 TikTok</label>
                    <label><input type="checkbox" value="facebook"> 📘 Facebook</label>
                    <label><input type="checkbox" value="threads"> 🧵 Threads</label>
                    <label><input type="checkbox" value="viber"> 📲 Viber</label>
                </div>
            </div>
            <div class="content-field">
                <label for="postTopic">Тема</label>
                <select id="postTopic">
                    <option value="general">Загальне</option>
                    <option value="animation">🎭 Анімація</option>
                    <option value="quest">🔍 Квест</option>
                    <option value="birthday">🎂 День народження</option>
                    <option value="show">🎪 Шоу</option>
                    <option value="masterclass">🎨 Майстер-клас</option>
                    <option value="promo">🔥 Промо</option>
                    <option value="event">🎉 Подія</option>
                    <option value="review">⭐ Відгук</option>
                </select>
            </div>
            <div class="content-field">
                <label for="postHashtags">Хештеги (через кому)</label>
                <input type="text" id="postHashtags" placeholder="#парк_закревського, #дітям, ...">
            </div>
            <div class="content-field">
                <label for="postSchedule">Дата та час публікації</label>
                <input type="datetime-local" id="postSchedule">
            </div>
            <div class="content-field">
                <label for="postNotes">Нотатки для команди</label>
                <textarea id="postNotes" placeholder="Внутрішні нотатки..." style="min-height:60px"></textarea>
            </div>
            <div class="content-field" id="postStatusDisplay" style="display:none">
                <label>Статус</label>
                <div id="postCurrentStatus"></div>
            </div>
            <div class="content-modal-actions" id="modalActions"></div>
        </div>
    </div>

    <!-- Generate Modal -->
    <div class="content-modal-overlay" id="generateModal">
        <div class="content-modal" style="position:relative;max-width:480px">
            <button class="content-modal-close" onclick="ContentPage.closeGenerate()">&times;</button>
            <h2>🧠 Згенерувати план</h2>
            <div class="content-field">
                <label>Тиждень</label>
                <input type="number" id="genWeek" min="1" max="53">
            </div>
            <div class="content-field">
                <label>Рік</label>
                <input type="number" id="genYear" min="2024" max="2030">
            </div>
            <div class="content-field">
                <label>Платформи</label>
                <div class="content-gen-option" id="genPlatforms">
                    <label><input type="checkbox" value="instagram" checked> 📸 Instagram</label>
                    <label><input type="checkbox" value="telegram" checked> 📱 Telegram</label>
                    <label><input type="checkbox" value="tiktok"> 🎵 TikTok</label>
                    <label><input type="checkbox" value="facebook"> 📘 Facebook</label>
                </div>
            </div>
            <div class="content-field">
                <label>Теми</label>
                <div class="content-gen-option" id="genTopics">
                    <label><input type="checkbox" value="animation" checked> 🎭 Анімація</label>
                    <label><input type="checkbox" value="quest" checked> 🔍 Квест</label>
                    <label><input type="checkbox" value="birthday" checked> 🎂 ДН</label>
                    <label><input type="checkbox" value="show" checked> 🎪 Шоу</label>
                    <label><input type="checkbox" value="masterclass" checked> 🎨 МК</label>
                </div>
            </div>
            <div class="content-modal-actions">
                <button class="content-btn content-btn--primary" onclick="ContentPage.generateWeek()">🧠 Згенерувати</button>
                <button class="content-btn content-btn--secondary" onclick="ContentPage.closeGenerate()">Скасувати</button>
            </div>
        </div>
    </div>

    <!-- Business Card Modal -->
    <div class="content-modal-overlay" id="cardModal">
        <div class="content-modal" style="position:relative;max-width:720px">
            <button class="content-modal-close" onclick="ContentPage.closeCardModal()">&times;</button>
            <h2 id="cardModalTitle">Нова бізнес-картка</h2>
            <input type="hidden" id="cardId">
            <div class="content-field">
                <label for="cardSlug">Slug (латиницею)</label>
                <input type="text" id="cardSlug" placeholder="animation, quest-minecraft...">
            </div>
            <div class="content-field">
                <label for="cardTitle">Назва</label>
                <input type="text" id="cardTitle" placeholder="Дитяча анімація">
            </div>
            <div class="content-field">
                <label for="cardCategory">Категорія</label>
                <select id="cardCategory">
                    <option value="service">Послуга</option>
                    <option value="event">Подія</option>
                    <option value="general">Загальне</option>
                    <option value="product">Товар</option>
                </select>
            </div>
            <div class="content-field">
                <label for="cardShortDesc">Короткий опис (1-2 речення)</label>
                <input type="text" id="cardShortDesc" placeholder="Яскраві аніматори для вашого свята">
            </div>
            <div class="content-field">
                <label for="cardFullDesc">Повний опис</label>
                <textarea id="cardFullDesc" placeholder="Детальний опис послуги..."></textarea>
            </div>
            <div class="content-field">
                <label for="cardAudience">Цільова аудиторія</label>
                <input type="text" id="cardAudience" placeholder="Діти 3-12 років, батьки">
            </div>
            <div class="content-field">
                <label for="cardPrice">Ціна</label>
                <input type="text" id="cardPrice" placeholder="від 2500₴/год">
            </div>
            <div class="content-field">
                <label for="cardFeatures">Ключові переваги (через кому)</label>
                <input type="text" id="cardFeatures" placeholder="Професійні аніматори, власні костюми, ...">
            </div>
            <div class="content-field">
                <label for="cardHashtagsIG">Хештеги Instagram</label>
                <input type="text" id="cardHashtagsIG" placeholder="#анімація, #дітям, ...">
            </div>
            <div class="content-field">
                <label for="cardHashtagsTT">Хештеги TikTok</label>
                <input type="text" id="cardHashtagsTT" placeholder="#fyp, #animation, ...">
            </div>
            <div class="content-field">
                <label for="cardHashtagsFB">Хештеги Facebook</label>
                <input type="text" id="cardHashtagsFB" placeholder="#ПаркЗакревського, ...">
            </div>
            <div class="content-field">
                <label for="cardTone">Тон комунікації</label>
                <input type="text" id="cardTone" placeholder="Яскраво, динамічно, з емоджі">
            </div>
            <div class="content-field">
                <label for="cardRules">Правила контенту</label>
                <input type="text" id="cardRules" placeholder="Фокус на безпеку, не згадувати ціну в IG">
            </div>
            <div class="content-field">
                <label for="cardCTA">Заклик до дії (CTA)</label>
                <input type="text" id="cardCTA" placeholder="Бронюйте за ☎️ 0800-XXX-XXXX">
            </div>
            <div class="content-field">
                <label for="cardDoNot">Не писати (через кому)</label>
                <input type="text" id="cardDoNot" placeholder="знижки більше 20%, порівняння з конкурентами">
            </div>
            <div class="content-modal-actions" id="cardModalActions"></div>
        </div>
    </div>

    <!-- Social Rules Modal -->
    <div class="content-modal-overlay" id="rulesModal">
        <div class="content-modal" style="position:relative;max-width:520px">
            <button class="content-modal-close" onclick="ContentPage.closeRulesModal()">&times;</button>
            <h2 id="rulesModalTitle">Правила платформи</h2>
            <input type="hidden" id="rulesPlatform">
            <div class="content-field">
                <label for="rulesMaxLength">Максимум символів</label>
                <input type="number" id="rulesMaxLength">
            </div>
            <div class="content-field">
                <label for="rulesMediaRequired">Медіа обовʼязкове</label>
                <select id="rulesMediaRequired"><option value="true">Так</option><option value="false">Ні</option></select>
            </div>
            <div class="content-field">
                <label for="rulesHashtagLimit">Ліміт хештегів</label>
                <input type="number" id="rulesHashtagLimit">
            </div>
            <div class="content-field">
                <label for="rulesTone">Тон</label>
                <input type="text" id="rulesTone">
            </div>
            <div class="content-field">
                <label for="rulesFormatting">Правила форматування</label>
                <textarea id="rulesFormatting" style="min-height:60px"></textarea>
            </div>
            <div class="content-field">
                <label for="rulesImageRatio">Формат зображення</label>
                <input type="text" id="rulesImageRatio" placeholder="1:1, 4:5, 9:16">
            </div>
            <div class="content-field">
                <label for="rulesHashtagPlacement">Розміщення хештегів</label>
                <select id="rulesHashtagPlacement"><option value="end">В кінці</option><option value="inline">В тексті</option><option value="none">Без хештегів</option></select>
            </div>
            <div class="content-field">
                <label for="rulesDefHashtags">Базові хештеги (через кому)</label>
                <input type="text" id="rulesDefHashtags">
            </div>
            <div class="content-modal-actions">
                <button class="content-btn content-btn--primary" onclick="ContentPage.saveRules()">💾 Зберегти</button>
                <button class="content-btn content-btn--secondary" onclick="ContentPage.closeRulesModal()">Скасувати</button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Особистий кабінет">
        <div class="modal-content modal-medium" role="dialog" aria-modal="true">
            <span class="modal-close">&times;</span>
            <h3>Особистий кабінет</h3>
            <div id="profileContent" class="profile-content">
                <div class="profile-loading">Завантаження...</div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <span id="notificationText"></span>
    </div>
        </main>
    </div>

    <script src="js/ui.js?v=0.79.1"></script>
    <script src="js/config.js?v=0.79.1"></script>
    <script src="js/notification.js?v=0.79.1"></script>
    <script src="js/api.js?v=0.79.1"></script>
    <script src="js/auth.js?v=0.79.1"></script>
    <script src="js/components/sidebar.js?v=0.79.1"></script>
    <script>if (typeof Sidebar !== "undefined") Sidebar.init("#sidebarLinks");</script>
    <script src="js/content-page.js?v=0.79.1"></script><script src="js/alerts.js?v=0.79.1"></script>
</body>
</html>
