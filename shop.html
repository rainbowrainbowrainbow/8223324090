<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Genix | Магазин</title>
    <link rel="stylesheet" href="css/base.css?v=37.6.0">
    <link rel="stylesheet" href="css/layout.css?v=37.6.0">
    <link rel="stylesheet" href="css/achievements.css?v=37.6.0">
    <link rel="stylesheet" href="css/dark-mode.css?v=37.6.0">
    <link rel="stylesheet" href="css/responsive.css?v=37.6.0">
    <link rel="stylesheet" href="css/role-panel.css?v=37.6.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.ico">
</head>
<body>
    <div id="mainApp" class="main-app">
        <!-- Бокове меню -->
        <aside class="sidebar-nav" id="sidebarNav">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-brand">
                    <img src="images/gear-logo.svg" alt="Event Genix" class="logo-img-small">
                    <div class="em-logo">
                        <span class="em-logo-title">Event Genix</span>
                        <span class="em-logo-sub">AI First CRM</span>
                    </div>
                </div>
                <div class="sidebar-user-card" id="sidebarUserCard">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName"></div>
                        <div class="sidebar-user-role" id="sidebarUserRole"></div>
                    </div>
                    <div class="sidebar-user-status online" id="sidebarUserStatus">●</div>
                </div>
                <div class="sidebar-day-context" id="sidebarDayContext" style="display:none"></div>
            </div>
            <nav class="sidebar-links" id="sidebarLinks"></nav>
        <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Згорнути/розгорнути меню">
            <span class="collapse-icon">◀</span>
            <span class="collapse-text">Згорнути</span>
        </button>
        </aside>
        <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>

        <header class="header">
            <div class="header-content">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Меню" aria-label="Відкрити/закрити меню">☰</button>
                <div class="user-panel">
                    <span id="currentUser" class="user-name"></span>
                    <button id="logoutBtn" class="btn-logout">Вийти</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="page-container" style="padding:20px">
            <div style="text-align:center;padding:40px;color:var(--gray-400)">Завантаження...</div>
        </main>
    </div>
    <script src="js/config.js?v=37.6.0"></script>
    <script src="js/api.js?v=37.6.0"></script>
    <script src="js/auth.js?v=37.6.0"></script>
    <script src="js/ui.js?v=37.6.0"></script>
    <script src="js/components/sidebar.js?v=37.6.0"></script>
    <script>if (typeof Sidebar !== "undefined") Sidebar.init("#sidebarLinks");</script>
    <script src="js/shop-page.js?v=37.6.0"></script>
    <script src="js/role-panel.js?v=37.6.0"></script>
</body>
</html>
