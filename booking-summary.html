<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script>
    (function(){try{var s=localStorage.getItem('pzp_dark_mode');var d=s!=='false';document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Genix | Банкетний лист</title>
    <meta name="description" content="Preview і друк банкетного листа Event Genix">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="css/base.css?v=0.77.17">
    <link rel="stylesheet" href="css/dark-mode.css?v=0.77.17">
    <link rel="stylesheet" href="css/responsive.css?v=0.77.17">
    <link rel="stylesheet" href="css/booking-summary.css?v=0.77.17">
</head>
<body class="booking-summary-page">
    <header class="booking-summary-toolbar" aria-label="Дії з банкетним листом">
        <div>
            <p class="booking-summary-kicker">Event Genix</p>
            <h1>Банкетний лист</h1>
        </div>
        <div class="booking-summary-actions">
            <a id="bookingSummaryBack" class="booking-summary-btn booking-summary-btn-secondary" href="/">Повернутись</a>
            <button id="bookingSummaryCopy" type="button" class="booking-summary-btn booking-summary-btn-secondary">Скопіювати текст</button>
            <div class="booking-summary-export" aria-label="Експорт PDF">
                <span>Експорт PDF</span>
                <button type="button" class="booking-summary-btn booking-summary-btn-secondary" data-booking-summary-pdf-mode="client">Для клієнта</button>
                <button type="button" class="booking-summary-btn booking-summary-btn-secondary" data-booking-summary-pdf-mode="kitchen">Для кухні</button>
                <button type="button" class="booking-summary-btn booking-summary-btn-secondary" data-booking-summary-pdf-mode="staff">Для персоналу</button>
            </div>
            <button id="bookingSummaryPrint" type="button" class="booking-summary-btn booking-summary-btn-primary">Друк / PDF</button>
        </div>
    </header>

    <main class="booking-summary-shell" id="bookingSummaryRoot">
        <section id="bookingSummaryState" class="booking-summary-state" role="status">
            Завантаження банкетного листа...
        </section>
        <section id="bookingSummaryWarnings" class="booking-summary-warnings" hidden></section>
        <div id="bookingSummaryPrintRoot" class="booking-summary-print-root" hidden>
            <article id="bookingSummaryDocument" class="booking-summary-document booking-summary-a4-page" aria-label="Документ банкетного листа" hidden></article>
        </div>
    </main>

    <script src="js/auth.js?v=0.77.17" defer></script>
    <script src="js/booking-summary-page.js?v=0.77.17" defer></script>
</body>
</html>
